[pytest]
testpaths = tests
# xunit1: nur damit schreibt pytest die Feature-ID (user_properties) pro Testfall ins JUnit-XML,
# das scripts/features/update_checklist.py für die Checkliste liest.
junit_family = xunit1
markers =
    feature(id): Funktions-ID aus docs/features/features.yaml (z. B. "ENG-05")
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using .httpx. with
