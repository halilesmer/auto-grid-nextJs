# Auto Grid – Funktionskatalog (einzige Quelle der Wahrheit)
#
# Aus dieser Datei wird docs/features/FEATURES.md erzeugt:
#   worker_python/.venv/bin/python scripts/features/update_checklist.py
# FEATURES.md NIE von Hand bearbeiten.
#
# Reihenfolge = Testreihenfolge (Abhängigkeiten zuerst). Kategorien und Features
# werden genau in dieser Reihenfolge getestet und in FEATURES.md angezeigt.
#
# Felder pro Feature:
#   id               eindeutig, Format KAT-NN (wird in Tests als Tag benutzt: @pytest.mark.feature("ENG-05") / tag: '@ENG-05')
#   titel            kurzer Name
#   beschreibung     was die Funktion tut
#   code             wichtigste Dateien (relativ zum Repo-Root)
#   tiers            welche Testebenen das Feature abdecken sollen:
#                      unit    – pytest + FakeMT5 (Mac/CI, ohne MT5)
#                      api     – pytest + FastAPI TestClient (Mac/CI)
#                      e2e     – Playwright gegen gemockten Worker (Mac/CI)
#                      live    – Playwright gegen den echten Worker auf dem VPS (DEMO-Konto)
#                      manuell – braucht eine manuelle Bestätigung (manual_results.yaml)
#   pruefung         Schritte für den manuellen Test
#   erwartet         erwartetes Ergebnis
#   bekannter_fehler (optional) bekannter Defekt; Tests dafür sind als xfail markiert

version: 1

kategorien:

  # ---------------------------------------------------------------------------
  - id: SYS
    titel: Verbindung & Infrastruktur
    features:
      - id: SYS-01
        titel: Worker erreichbar (REST über ngrok)
        beschreibung: Das Frontend erreicht den Worker über die im Browser gespeicherte Verbindung (Adresse + /api); axios sendet den ngrok-skip-browser-warning-Header. NEXT_PUBLIC_API_URL/NEXT_PUBLIC_WORKER_API_KEY sind nur noch der Startwert für die lokale Entwicklung (siehe SYS-07).
        code: [frontend_nextjs/src/lib/api.ts, frontend_nextjs/src/store/useConnectionStore.ts, worker_python/main.py]
        tiers: [live]
        pruefung:
          - Worker auf dem VPS starten (start.bat), Frontend lokal starten (npm run dev:frontend).
          - http://localhost:3000 öffnen.
        erwartet: Kontoliste lädt, im Log-Bereich steht der Worker als online.

      - id: SYS-02
        titel: WebSocket-Stream + Reconnect
        beschreibung: Verbindung zu /ws/stream; Nachrichten METRICS, LIVE_DATA, LOG werden in die Stores geleitet; bei Abbruch automatischer Reconnect.
        code: [frontend_nextjs/src/store/useWebSocketManager.ts, worker_python/src/api/ws_server.py]
        tiers: [e2e, live]
        pruefung:
          - Dashboard öffnen, DevTools → Network → WS prüfen.
          - Worker kurz neu starten.
        erwartet: WS verbindet sich, nach dem Neustart verbindet er sich von selbst wieder.

      - id: SYS-03
        titel: Plattform-Erkennung
        beschreibung: GET /system/platform meldet, ob der Worker unter Windows läuft (auch als einfacher Health-Check, siehe docs/NGrok). Der Health-Check antwortet auch während eine Update-Prüfung auf Git wartet.
        code: [worker_python/src/api/system.py]
        tiers: [api, live]
        pruefung:
          - GET /api/system/platform (mit X-API-Key) über ngrok aufrufen.
        erwartet: 'Antwort {"platform": "win32", "is_windows": true}.'

      - id: SYS-04
        titel: MT5-Terminal-Scanner
        beschreibung: GET /system/scan-mt5 sucht terminal64.exe auf dem VPS; der Konto-Dialog bietet die Pfade zur Auswahl an (Rescan, eigener Pfad).
        code: [worker_python/src/api/system.py, frontend_nextjs/src/components/account/components/MT5PathSelector.tsx, frontend_nextjs/src/components/account/hooks/useMT5Scanner.ts]
        tiers: [api, e2e, live]
        pruefung:
          - „Neues Konto“ öffnen, Feld MT5-Pfad ansehen, „Rescan“ klicken.
          - Checkbox „eigener Pfad“ aktivieren.
        erwartet: Installierte Terminals erscheinen in der Liste; mit „eigener Pfad“ erscheint ein Textfeld.

      - id: SYS-05
        titel: API-Schlüssel (WORKER_API_KEY)
        beschreibung: Ist WORKER_API_KEY auf dem VPS gesetzt, braucht jede /api/*-Anfrage den Header X-API-Key und /ws/stream den Query-Parameter api_key; das Frontend sendet den im Browser gespeicherten Schlüssel mit (SYS-07). Ohne Variable bleibt der Worker offen (mit Warnung beim Start). WORKER_API_KEY ist der Admin-Schlüssel; Benutzer bekommen eigene Schlüssel (USR-01).
        code: [worker_python/src/api/auth.py, worker_python/main.py, worker_python/src/api/ws_server.py, frontend_nextjs/src/lib/api.ts]
        tiers: [api, live]
        pruefung:
          - WORKER_API_KEY auf dem VPS setzen, Worker neu starten.
          - Dashboard mit passendem Schlüssel verbinden (SYS-07); danach die ngrok-URL /api/accounts direkt im Browser aufrufen.
        erwartet: Dashboard funktioniert normal; der direkte Aufruf ohne Schlüssel liefert 401.

      - id: SYS-07
        titel: Verbindung im Browser einrichten
        beschreibung: Worker-Adresse und API-Key werden im Verbindungsdialog eingegeben oder per Link übernommen, mit GET /api/system/platform getestet (ok/falscher Key/unsicher/nicht erreichbar/kein Worker) und erst nach erfolgreichem Test im Browser (localStorage) gespeichert; „Verbinden“ und „Trennen“ laden die Seite neu. Ohne Verbindung zeigt die Seite eine Anleitung statt des Dashboards; NEXT_PUBLIC_API_URL/NEXT_PUBLIC_WORKER_API_KEY dienen nur als Startwert, wenn noch nichts gespeichert ist.
        code: [frontend_nextjs/src/store/useConnectionStore.ts, frontend_nextjs/src/lib/connection.ts, frontend_nextjs/src/lib/api.ts, frontend_nextjs/src/components/connection/ConnectionDialog.tsx, frontend_nextjs/src/components/connection/ConnectionGate.tsx]
        tiers: [e2e]
        pruefung:
          - Im Browser localStorage den Eintrag grid-robot-connection löschen und neu laden.
          - Über den Knopf „VPS verbinden“ Adresse und Schlüssel eingeben, testen, verbinden; danach im Kopf-Menü „Verbindung ändern“ öffnen und trennen.
        erwartet: Ohne Verbindung erscheint die Anleitung statt des Dashboards; „Verbinden“ ist erst nach erfolgreichem Test klickbar und lädt danach das Dashboard; „Trennen“ führt zur Anleitung zurück.

      - id: SYS-08
        titel: Verbindungs-Link
        beschreibung: Ein Link/Code (#connect=…, base64url-JSON {v,u,k}) füllt Adresse und Schlüssel im Dialog und testet sofort; nichts wird ohne Bestätigung gespeichert, das Fragment verschwindet sofort aus der Adresszeile. worker_python/ops/windows/connect-link.ps1 erzeugt denselben Code.
        code: [frontend_nextjs/src/lib/connectionCode.ts, frontend_nextjs/src/components/layout/ConnectionSync.tsx, frontend_nextjs/src/components/connection/ConnectionDialog.tsx]
        tiers: [e2e]
        pruefung:
          - Einen Verbindungs-Link mit gültigem Code öffnen (z. B. #connect=…).
          - Einen unvollständigen/kaputten Code öffnen.
        erwartet: Gültiger Link zeigt das Ziel im Dialog und ein erfolgreiches Testergebnis, ohne die Verbindung schon zu speichern; ungültiger Code zeigt eine Fehlermeldung.

      - id: SYS-09
        titel: Verbindungsstatus im Header
        beschreibung: Das Kopf-Menü (UI-01) öffnet bei jeder Breite über ein kompaktes Zahnrad. Der zugängliche Name und der Tooltip nennen den aktuellen Verbindungsstatus (verbunden/kein Key/nicht erreichbar/unsicher/nicht verbunden). Im Menü stehen Host und Status; „Verbindung ändern“ öffnet den Verbindungsdialog. Der Status wird alle 30 s sowie bei Fenster-Fokus erneut über SYS-07 geprüft.
        code: [frontend_nextjs/src/components/layout/HeaderMenu.tsx, frontend_nextjs/src/components/layout/ConnectionSync.tsx, frontend_nextjs/src/components/layout/AppNav.tsx]
        tiers: [e2e]
        pruefung:
          - Bei laufendem Worker das Dashboard öffnen, dann den API-Key auf dem VPS ändern.
          - Zurück ins Browserfenster wechseln (Fokus).
        erwartet: Das Zahnrad öffnet das Menü mit Host und Status; nach dem Fokuswechsel nennen zugänglicher Name, Tooltip und Menü den aktualisierten Status.

      - id: SYS-06
        titel: MT5-Verbindung (Kaltstart, Zeitbudget, Python-Integration)
        beschreibung: Worker (/start, Symbolabfrage) und bot_runner verbinden sich über connect_to_mt5_with_timeout. Das Timeout ist ein Gesamtbudget (Warten auf die MT5-Sperre, initialize-Versuche, Neustart eines hängenden Terminals); danach wird nicht weiter versucht, /start antwortet also nach rund 120 s (+ Login). Bei IPC-Fehlern wird nur ein terminal64.exe desselben Pfads beendet, das älter als 180 s ist; ein startendes Terminal wird abgewartet. Die kurze Symbolabfrage (15 s) beendet nie ein Terminal. -10004 bei initialize heißt „keine IPC-Verbindung“, nicht „falsches Passwort“. Vor initialize wird der Python-Kanal des Terminals geprüft (named pipe MT5.Terminal.<SHA-256 des Pfads>). Ist das Terminal älter als 30 s und hat keinen Kanal, ist in MT5 unter Optionen → Community „Python integration“ abgewählt; dann kommt sofort eine klare Meldung statt 60 s Warten pro Versuch, und kein Terminal wird beendet. Auf einem VPS mit mehreren Terminals zählt der Worker die Kanäle. Fehlt der eigene Kanal und gibt es weniger Terminal-Kanäle als Terminals, die älter als 30 s sind, kommt dieselbe Meldung; hat jedes alte Terminal einen Kanal (Namensberechnung passt nicht), wird wie bisher verbunden. Ohne Python-Kanal wartet initialize fest 60 s, egal welches Timeout; ein weiterer Versuch oder ein Terminal-Neustart startet deshalb nur, wenn noch so viel Budget übrig ist. Der WebSocket-Stream ruft MT5 nicht auf, solange eine Verbindung die MT5-Sperre hält, und zeigt dann die Bot-Metriken.
        code: [worker_python/src/utils/mt5_helpers.py, worker_python/src/utils/mt5_connection.py, worker_python/src/utils/mt5_errors.py, worker_python/src/api/ws_server.py]
        tiers: [unit, api, manuell]
        pruefung:
          - Auf der Seite „VPS“ den VPS neu starten, MT5 nicht von Hand öffnen.
          - Sobald der Worker erreichbar ist, Konto wählen, eine Zone öffnen (Symbolliste) und sofort „Start Bot“ klicken.
          - "Nur DEMO, Bot vorher stoppen: Per RDP in MT5 Extras → Optionen → Community „Python-Integration“ abwählen, MT5 beenden und neu starten, „Start Bot“ klicken. Weitere Terminals anderer Konten laufen dabei weiter (Fehler trat nur mit mehreren Terminals auf). Danach den Haken wieder setzen und MT5 neu starten."
        erwartet: /start antwortet nach spätestens ~2–3 min (Erfolg oder klare Fehlermeldung). Das Worker-Log zeigt „henüz açılıyor, öldürülmüyor“ statt „Öldürülüyor“ für ein Terminal, das jünger als 180 s ist. Scheitert der erste Start am langsamen Kaltstart, verbindet ein zweiter Start mit demselben Terminal. Ohne Python-Integration scheitert „Start Bot“ nach wenigen Sekunden mit der Meldung „… 'Python integration' kutusunu işaretleyin …“, auch wenn weitere Terminals laufen; der Worker beantwortet währenddessen andere Anfragen. Mit Haken verbindet er in Sekunden.

  # ---------------------------------------------------------------------------
  - id: ACC
    titel: Konten
    features:
      - id: ACC-01
        titel: Kontoliste laden
        beschreibung: GET /accounts liefert alle Konten aus configs/accounts.json; das Dropdown zeigt sie an und schreibt sie in useAccountStore.
        code: [worker_python/src/api/accounts.py, frontend_nextjs/src/components/account/hooks/useAccounts.ts, frontend_nextjs/src/components/account/components/AccountDropdown.tsx]
        tiers: [api, e2e, live]
        pruefung:
          - Dashboard öffnen, Dropdown „Select Account“ aufklappen.
        erwartet: Alle registrierten Konten erscheinen (inkl. DEMO-Testkonto).

      - id: ACC-02
        titel: Konto anlegen + Validierung
        beschreibung: Dialog „New MT5 Account“; Pflichtfelder Name, Login, Passwort, Server, MT5-Pfad; Notizen max. 1000 Zeichen; POST /accounts.
        code: [worker_python/src/api/accounts.py, worker_python/src/api/models.py, frontend_nextjs/src/components/account/components/AccountForm.tsx, frontend_nextjs/src/components/account/hooks/useAccountForm.ts]
        tiers: [api, e2e]
        pruefung:
          - „Add new account“ klicken, leer absenden.
          - "(Nur mit einem Wegwerf-Konto!) Alle Felder ausfüllen und speichern."
        erwartet: Leeres Formular zeigt Pflichtfeld-Fehler; gültiges Konto erscheint danach im Dropdown.

      - id: ACC-03
        titel: Doppelter Login
        beschreibung: Gleicher Login wie ein bestehendes Konto → Rückfrage „bestehendes Konto bearbeiten?“; der Worker antwortet mit 409 (RFC-7807-Problem).
        code: [worker_python/src/api/accounts.py, worker_python/src/api/errors.py, frontend_nextjs/src/components/account/hooks/useAccountForm.ts]
        tiers: [api, e2e]
        pruefung:
          - Neues Konto mit dem Login eines vorhandenen Kontos anlegen.
        erwartet: Browser-Rückfrage erscheint; es entsteht kein zweites Konto.

      - id: ACC-04
        titel: Konto bearbeiten
        beschreibung: PUT /accounts/{id}; gesperrt, solange der Bot läuft.
        code: [worker_python/src/api/accounts.py, frontend_nextjs/src/components/account/components/AccountActions.tsx, frontend_nextjs/src/components/account/components/AccountFormDialog.tsx]
        tiers: [api, e2e]
        pruefung:
          - Konto wählen, „Edit account“, Notiz ändern, speichern.
        erwartet: Änderung bleibt nach Neuladen erhalten; bei laufendem Bot ist der Button deaktiviert.

      - id: ACC-05
        titel: Konto löschen
        beschreibung: DELETE /accounts/{id} nach Bestätigung („Delete Account“); gesperrt, solange der Bot läuft.
        code: [worker_python/src/api/accounts.py, frontend_nextjs/src/components/account/components/AccountActions.tsx]
        tiers: [api, e2e]
        pruefung:
          - "(Nur Wegwerf-Konto!) „Delete account“ → bestätigen."
        erwartet: Konto verschwindet aus dem Dropdown; bei laufendem Bot ist der Button deaktiviert.

      - id: ACC-06
        titel: Kontoauswahl lädt Einstellungen
        beschreibung: Auswahl im Dropdown lädt GET /settings/{id} in useSettingsStore; ohne Konto erscheint der Leerzustand „No account selected“.
        code: [frontend_nextjs/src/components/account/AccountSelector.tsx, frontend_nextjs/src/store/useSettingsStore.ts, frontend_nextjs/src/app/page.tsx]
        tiers: [e2e, live]
        pruefung:
          - Seite ohne Auswahl öffnen, dann das DEMO-Konto wählen.
        erwartet: Zuerst Leerzustand, danach erscheinen Zonen und allgemeine Einstellungen des Kontos.

      - id: ACC-07
        titel: LIVE/DEMO-Kennzeichnung
        beschreibung: Badge (DEMO/LIVE) am Anfang der Steuerleiste und Kennzeichnung DEMO/LIVE je Eintrag der Kontoliste, beides aus env_type des Kontos.
        code: [frontend_nextjs/src/app/page.tsx, frontend_nextjs/src/components/account/components/AccountDropdown.tsx]
        tiers: [e2e]
        pruefung:
          - DEMO-Konto wählen.
        erwartet: Badge zeigt DEMO, nicht LIVE.

      - id: ACC-08
        titel: LIVE/DEMO-Sicherheitsprüfung
        beschreibung: Ein als LIVE markiertes Konto darf nur mit einem echten, ein DEMO-Konto nur mit einem Demo-Server verbinden – sonst wird die Verbindung verweigert.
        code: [worker_python/src/utils/mt5_errors.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (würde ein falsch markiertes Konto erfordern).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ACC-09
        titel: Passwort nie in API-Antworten
        beschreibung: Der Worker gibt MT5-Passwörter in keiner Antwort zurück (Liste, Anlegen, Bearbeiten, 409-Problem), sondern nur has_password. Leeres Passwort beim Bearbeiten = unverändert.
        code: [worker_python/src/api/accounts.py, worker_python/src/api/helpers.py, frontend_nextjs/src/components/account/hooks/useAccountForm.ts]
        tiers: [api]
        pruefung:
          - DevTools → Network → Antwort von /api/accounts ansehen.
          - Konto bearbeiten, Passwortfeld leer lassen, speichern.
        erwartet: Kein Feld „password“ in der Antwort; das Konto verbindet sich danach weiterhin (Passwort unverändert).

      - id: ACC-10
        titel: Kontowechsel zeigt nur Daten des gewählten Kontos
        beschreibung: Beim Wechsel des Kontos werden Laufzeitdaten (Bot-Status, Preis, G/V, Positionen) zurückgesetzt, statt die Werte des vorherigen Kontos stehen zu lassen. Der WS-Stream folgt dem gewählten Konto (/ws/stream?account_id=, neu verbunden beim Wechsel); der Worker sendet jeder Verbindung nur ihr Konto – aus der MT5-Abfrage des API-Prozesses nur, wenn dessen Terminal an diesem Konto angemeldet ist, sonst aus der Metrikdatei des Bot-Prozesses. WS-Metriken tragen account_id; Metriken eines anderen Kontos (älterer Worker) ignoriert das Frontend.
        code: [frontend_nextjs/src/components/account/AccountSelector.tsx, frontend_nextjs/src/store/useWebSocketManager.ts, frontend_nextjs/src/lib/connectionCode.ts, worker_python/src/api/ws_server.py]
        tiers: [api, e2e, live]
        pruefung:
          - Konto mit laufendem Bot wählen, dann auf ein Konto wechseln, dessen Bot nicht läuft.
          - Zweites Konto mit laufendem Bot wählen, /chart bzw. /formasyon öffnen; DevTools → WS-URL und Nachrichten ansehen.
        erwartet: Das zweite Konto zeigt „Gestoppt“ und keine Preise/Positionen des ersten Kontos; zurück auf das erste Konto zeigt wieder dessen Status. Mit laufendem Bot bekommt das zweite Konto eigene Stream-Metriken (Live-Preis im Chart; die WS-URL enthält account_id=<Konto>, jede METRICS-Nachricht dessen account_id).

      - id: ACC-11
        titel: Kein Login im MT5-Terminal eines anderen Kontos
        beschreibung: mt5.login() stellt das verbundene Terminal auf ein anderes Konto um. Ist mt5_path eingetragen, aber nicht vorhanden, verbinden Worker (/start, Symbolabfrage) und Bot-Reconnect nicht mehr ohne Pfad mit irgendeinem laufenden Terminal, sondern melden „[CONFIG] MT5 terminal yolu bulunamadı“. Vor jedem Login wird terminal_info().path mit den mt5_path-Einträgen in accounts.json verglichen; gehört das Terminal einem anderen Konto (und nicht auch diesem), wird nicht eingeloggt („[TERMINAL] … hesabına ait“). Ein Konto ohne mt5_path kann sich daher nicht im Terminal eines Kontos mit eingetragenem Pfad anmelden. Der Bot prüft in jeder Runde vor Fernbefehlen und Handel account_info().login; ist sein Terminal auf ein fremdes Konto umgestellt, handelt er nicht („MT5 terminali başka bir hesaba … geçmiş“) und meldet sich wieder am eigenen Konto an; wird der Login abgelehnt, trennt er sich vom Terminal. Anlass 29.09.2026, 20:41 – T34 (DEMO-Konto A) wurde kurz auf DEMO-Konto B angemeldet.
        code: [worker_python/src/utils/mt5_terminal_guard.py, worker_python/src/utils/mt5_helpers.py, worker_python/src/core/startup.py, worker_python/src/core/reconnection.py, worker_python/src/core/loop.py]
        tiers: [unit, manuell]
        pruefung:
          - Nur DEMO. Zwei Konten mit je eigenem Terminal, Bot von Konto 1 läuft.
          - Bei Konto 2 im Bearbeiten-Dialog einen nicht existierenden MT5-Pfad eintragen, speichern und für Konto 2 eine Zone öffnen (Symbolliste) bzw. „Bot starten“ klicken.
          - Danach den richtigen Pfad wieder eintragen.
        erwartet: Konto 2 zeigt „[CONFIG] MT5 terminal yolu bulunamadı …“; das Journal von Terminal 1 enthält keine Anmeldung von Konto 2, der Bot von Konto 1 läuft ohne „BAĞLANTISI KOPTU“ weiter.

  # ---------------------------------------------------------------------------
  - id: USR
    titel: Benutzer & Zugriff
    features:
      - id: USR-01
        titel: Persönliche Schlüssel und Rollen
        beschreibung: Der Worker ordnet jeden X-API-Key (bzw. ?api_key= am WebSocket) einer Rolle zu. WORKER_API_KEY = Admin (sieht alles); der persönliche Schlüssel eines Benutzers (configs/users.json, nur als sha256-Hash) = Benutzer (nur eigene Konten). Unbekannt oder fehlend → 401. Ohne WORKER_API_KEY und ohne Benutzer bleibt der Worker offen (wie bisher, alle Admin); gibt es Benutzer (oder eine unlesbare users.json), aber keinen WORKER_API_KEY, wird ein Zugriff ohne Schlüssel abgelehnt. GET /api/auth/me liefert Name und Rolle.
        code: [worker_python/src/api/auth.py, worker_python/src/api/users_store.py, worker_python/main.py]
        tiers: [api]
        pruefung:
          - Mit dem Admin-Schlüssel und mit dem Schlüssel eines Benutzers GET /api/auth/me aufrufen.
          - Mit einem falschen Schlüssel dasselbe versuchen.
        erwartet: Admin- und Benutzerschlüssel liefern die jeweilige Rolle, ein falscher Schlüssel 401.

      - id: USR-02
        titel: Benutzerverwaltung (Admin)
        beschreibung: GET/POST /api/users, POST /api/users/{id}/key (Schlüssel erneuern), DELETE /api/users/{id} – nur mit Admin-Schlüssel (sonst 403). Der Schlüssel wird nur in der Antwort auf Anlegen/Erneuern angezeigt. Namen sind eindeutig (ohne Groß-/Kleinschreibung), 1–40 Zeichen. Ohne gesetzten WORKER_API_KEY verweigert der Worker das Anlegen (409), denn im offenen Modus ist jeder Admin und der erste Benutzer würde alle aussperren. Beim Löschen bleiben die Konten und ihre Bots erhalten und werden „ohne Besitzer“ (gehören dem Admin).
        code: [worker_python/src/api/users.py, worker_python/src/api/users_store.py, worker_python/src/api/models.py]
        tiers: [api]
        pruefung:
          - Als Admin einen Benutzer anlegen, den Schlüssel notieren, damit verbinden.
          - Schlüssel erneuern und mit dem alten Schlüssel verbinden.
        erwartet: Der neue Schlüssel funktioniert sofort, der alte wird nach dem Erneuern mit 401 abgelehnt; Benutzer sehen die Verwaltung nicht.

      - id: USR-03
        titel: Konto-Besitzer
        beschreibung: Konten tragen ein Feld owner (Benutzer-ID). Benutzer sehen und legen nur eigene Konten an (Besitzer wird vom Worker gesetzt, der Body wird ignoriert); der Admin sieht alle Konten und kann den Besitzer beim Anlegen/Bearbeiten setzen (Altbestand ohne Besitzer gehört dem Admin). Bearbeiten erhält den Besitzer. Die Konto-ID darf nur aus Ziffern bestehen (Dateinamen); id und login dürfen nicht mit einem anderen Konto kollidieren; ein Duplikat verrät keine Daten fremder Konten (409 ohne existing_account). Benutzer müssen einen mt5_path angeben, der ein von scan-mt5 gefundenes Terminal ist und nicht zu einem Konto eines anderen Besitzers gehört. Bearbeiten und Löschen eines Kontos lehnt der Worker bei laufendem Bot mit 409 ab.
        code: [worker_python/src/api/accounts.py, worker_python/src/api/models.py, worker_python/src/api/system.py]
        tiers: [api, e2e]
        pruefung:
          - Als Benutzer ein Konto anlegen und als Admin die Kontoliste öffnen.
          - Als Benutzer ein Konto mit der Login-Nummer eines fremden Kontos anlegen.
        erwartet: Das Konto erscheint beim Benutzer und beim Admin (mit Besitzer), aber nicht bei anderen Benutzern; das Duplikat wird ohne Details zum fremden Konto abgelehnt.

      - id: USR-04
        titel: Isolation aller kontobezogenen Endpunkte
        beschreibung: Einstellungen, UI-Zustand, Symbole, Logs (lesen, löschen, herunterladen), Start/Stop, Aktionen sowie Konto bearbeiten/löschen prüfen den Besitzer und antworten für fremde oder unbekannte Konten mit 404. Das schließt auch Glob- und Pfad-Tricks (/settings/*, /logs/download/..) aus. Der Admin behält Zugriff auf alle Konten.
        code: [worker_python/src/api/access.py, worker_python/src/api/settings.py, worker_python/src/api/ui_state.py, worker_python/src/api/symbols.py, worker_python/src/api/logs.py, worker_python/src/api/bot_control.py]
        tiers: [api]
        pruefung:
          - Mit dem Schlüssel eines Benutzers per curl ein Konto eines anderen Benutzers abrufen (Einstellungen, Logs, Start).
        erwartet: Immer 404; das eigene Konto und der Admin kommen durch.

      - id: USR-05
        titel: WebSocket-Isolation
        beschreibung: /ws/stream?api_key=…&account_id=… – Benutzer verbinden nur mit eigenen Konten (sonst Schließen mit 1008); ohne account_id kein „erstes Konto“-Fallback. Der Admin verbindet wie bisher. Bei offener Verbindung prüft der Worker die Berechtigung alle 5 s neu und schließt sie (1008), wenn Schlüssel erneuert/Benutzer gelöscht wurde oder das Konto den Besitzer wechselt bzw. gelöscht wird.
        code: [worker_python/src/api/ws_server.py, worker_python/src/api/access.py]
        tiers: [api]
        pruefung:
          - Mit dem Schlüssel eines Benutzers eine WebSocket-Verbindung für ein fremdes Konto öffnen.
        erwartet: Die Verbindung wird abgelehnt; für das eigene Konto kommen Live-Daten. Erneuert der Admin den Schlüssel, endet die offene Verbindung nach wenigen Sekunden.

      - id: USR-06
        titel: Systemrouten nur für Admin
        beschreibung: GET /system/update/check und POST /system/update (git pull + Neustart) verlangen den Admin-Schlüssel (403 für Benutzer). Verbindungstest (/system/platform) und MT5-Suche (/system/scan-mt5) bleiben für alle offen.
        code: [worker_python/src/api/system.py, worker_python/src/api/auth.py]
        tiers: [api]
        pruefung:
          - Mit dem Schlüssel eines Benutzers POST /api/system/update aufrufen.
        erwartet: 403; es wird kein git pull und kein Neustart ausgelöst.

      - id: USR-07
        titel: Benutzerseite (Admin)
        beschreibung: Die Seite /users (Nav-Eintrag „Benutzer“, nur mit Admin-Schlüssel) listet die Benutzer mit Anzahl ihrer Konten. „Benutzer anlegen“ zeigt den persönlichen Schlüssel und einen fertigen Verbindungs-Link (Worker-Adresse + Schlüssel) genau einmal; „Neuer Schlüssel“ und „Löschen“ fragen vorher nach. Konten eines gelöschten Benutzers bleiben und gehören danach dem Administrator. Doppelte Namen meldet der Worker.
        code: [frontend_nextjs/src/app/users/page.tsx, frontend_nextjs/src/components/users/UsersTable.tsx, frontend_nextjs/src/components/users/CreateUserDialog.tsx, frontend_nextjs/src/components/users/KeyRevealDialog.tsx, frontend_nextjs/src/services/usersApi.ts, frontend_nextjs/src/store/useUsersStore.ts]
        tiers: [e2e]
        pruefung:
          - Mit dem Admin-Schlüssel „Benutzer“ öffnen, einen Benutzer anlegen, Schlüssel/Link kopieren, das Fenster schließen.
          - Schlüssel erneuern und den Benutzer danach löschen.
        erwartet: Der Schlüssel erscheint nur im Fenster direkt nach dem Anlegen bzw. Erneuern; die Liste zeigt Name, Konten und Erstellzeit; nach dem Löschen ist der Benutzer weg und seine Konten sind noch da.

      - id: USR-08
        titel: Ansicht eines Benutzers
        beschreibung: Mit einem persönlichen Schlüssel zeigen Kontoliste und Verbindungsdialog nur die eigenen Konten und die Rolle („Verbunden als …“). Die Navigation hat keine Einträge „VPS“ und „Benutzer“, die Seiten selbst zeigen „Nur für Administratoren“, das Dashboard-Menü hat keine Update-Prüfung und es wird keine Update-Anfrage gestellt. Ein neues Konto bekommt der Benutzer als Besitzer vom Worker (das Formular hat keine Besitzer-Auswahl). Chart-Seiten öffnen ohne gewähltes Konto keinen Stream.
        code: [frontend_nextjs/src/store/useAuthStore.ts, frontend_nextjs/src/components/auth/AdminOnly.tsx, frontend_nextjs/src/components/layout/AppNav.tsx, frontend_nextjs/src/components/layout/ConnectionSync.tsx, frontend_nextjs/src/store/useWebSocketManager.ts, frontend_nextjs/src/app/page.tsx]
        tiers: [e2e]
        pruefung:
          - Im Browser (privates Fenster) mit dem Verbindungs-Link eines Benutzers verbinden.
          - Kontoliste, Navigation, Einstellungsmenü im Dashboard und die Seiten /users und /vps ansehen.
        erwartet: Nur die eigenen Konten erscheinen; „VPS“ und „Benutzer“ fehlen in der Navigation, ihre Seiten zeigen den Administrator-Hinweis; die Update-Prüfung fehlt im Menü.

  # ---------------------------------------------------------------------------
  - id: SET
    titel: Allgemeine Einstellungen
    features:
      - id: SET-01
        titel: Einstellungen laden
        beschreibung: GET /settings/{id} liest configs/settings_{id}*.json (verschachteltes „settings“ wird ausgepackt).
        code: [worker_python/src/api/settings.py, worker_python/src/utils/config.py]
        tiers: [api, e2e, live]
        pruefung:
          - Konto wählen.
        erwartet: Zonen und Kontroll-Intervall entsprechen der Datei auf dem VPS.

      - id: SET-02
        titel: Kontroll-Intervall (LOOP_INTERVAL_SECONDS)
        beschreibung: Stepper „Kontrol Sıklığı“ 1–60 s in 0,1er-Schritten; „Kaydet“ ist nur bei Änderung aktiv.
        code: [frontend_nextjs/src/components/SettingsForm.tsx, worker_python/src/core/loop.py]
        tiers: [e2e]
        pruefung:
          - Mit −/+ den Wert ändern, 0 und 61 eintippen, speichern, neu laden.
        erwartet: Werte außerhalb 1–60 werden begrenzt; gespeicherter Wert bleibt nach Neuladen.

      - id: SET-03
        titel: „Alle speichern“ + Dirty-Tracking
        beschreibung: Bei ungespeicherten Änderungen erscheint die schwebende Leiste „Kaydedilmemiş değişiklikler var“; „Tüm Ayarları Kaydet“ speichert alles (is_active wird beim Vergleich ignoriert). Auch per Cmd+Enter (Mac) / Strg+Enter (Windows); das Kürzel steht als Badge neben „Kaydet“.
        code: [frontend_nextjs/src/components/dashboard/SaveSettingsBar.tsx, frontend_nextjs/src/store/useSettingsStore.ts]
        tiers: [e2e]
        pruefung:
          - Ein Zonenfeld ändern → Leiste prüfen → „Kaydet“ oder Cmd/Strg+Enter.
        erwartet: Leiste erscheint, Button zeigt „Kaydediliyor…“ → „Kaydedildi“, Leiste verschwindet.

      - id: SET-04
        titel: Werte bereinigen (Sanitizing)
        beschreibung: Der Worker rundet Gleitkommazahlen beim Speichern auf 7 Stellen (sanitize_settings); das entfernt nur Rauschen, 5-stellige Forex-Werte (take_profit 0.0008, Preis 1.12299) bleiben unverändert.
        code: [worker_python/src/utils/config.py, worker_python/src/api/settings.py]
        tiers: [unit, api]
        pruefung:
          - Lot 0.0100000001 eingeben und speichern.
        erwartet: Gespeichert wird 0.01.

      - id: SET-05
        titel: Einstellungen zusammenführen (Merge)
        beschreibung: POST /settings/{id} führt die neuen Werte mit der bestehenden Datei zusammen, statt sie zu überschreiben.
        code: [worker_python/src/api/settings.py]
        tiers: [api]
        pruefung:
          - Nur das Intervall speichern.
        erwartet: Zonen bleiben unverändert.

      - id: SET-06
        titel: Standardwerte (neue Datei, fehlende Zonenfelder)
        beschreibung: Eine neue Einstellungsdatei enthält nur LOOP_INTERVAL_SECONDS und ZONES. Fehlt einer Zone ein Feld, nimmt die Engine dieselben Standardwerte wie eine neue Zone im UI (defaultZone). Die früheren GLOBAL_*-Schlüssel wurden nie gelesen und sind entfernt.
        code: [worker_python/src/utils/config.py, worker_python/src/core/grid_execution/config.py, frontend_nextjs/src/utils/zoneHelpers.ts]
        tiers: [unit]
        pruefung:
          - Nicht manuell testbar.
        erwartet: Engine- und UI-Standardwerte stimmen überein; keine ungenutzten Schlüssel in neuen Dateien.

  # ---------------------------------------------------------------------------
  - id: SYM
    titel: Symbole
    features:
      - id: SYM-01
        titel: Symbolliste + Cache
        beschreibung: GET /symbols/{id} liefert Broker-Symbole aus broker_symbols.json; 1-h-Cache, bei Ablauf wird die alte Liste geliefert und im Hintergrund aktualisiert (doppelte Anfragen werden zusammengelegt). Solange /start oder /stop für das Konto läuft, verbindet sich die Abfrage nicht selbst mit MT5 (alte Liste bzw. leer); /start füllt den Cache.
        code: [worker_python/src/api/symbols.py, worker_python/src/utils/mt5_helpers.py]
        tiers: [unit, api, live]
        pruefung:
          - Zone öffnen, ins Symbolfeld klicken.
        erwartet: Symbolliste des Brokers erscheint schnell (auch bei wiederholtem Öffnen).

      - id: SYM-02
        titel: Symbol-Autocomplete
        beschreibung: Feld „Sembol Ara…“ filtert die Symbolliste beim Tippen.
        code: [frontend_nextjs/src/components/SymbolAutoComplete.tsx]
        tiers: [e2e]
        pruefung:
          - "„XAU“ tippen und einen Vorschlag wählen."
        erwartet: Nur passende Symbole erscheinen; Auswahl übernimmt das Symbol.

      - id: SYM-03
        titel: Symboldetails
        beschreibung: Zu einem Symbol werden Details (Digits, Point, Volumen-Grenzen) geladen; daraus leiten die Zonenfelder Schrittweite, Minimum und Rundung ab, und unbekannte Symbole werden als „Geçersiz Sembol!“ markiert.
        code: [frontend_nextjs/src/hooks/useSymbolDetails.ts, frontend_nextjs/src/utils/zoneHelpers.ts, frontend_nextjs/src/services/zoneApi.ts]
        tiers: [e2e]
        pruefung:
          - Symbol wählen, Schrittweite der Preis- und Lotfelder prüfen (Pfeiltasten / DevTools).
          - Ein unbekanntes Symbol eintippen (nicht speichern).
        erwartet: Preisfelder in Schritten von point (z. B. 0,001 bei 3 Digits), Lot mit volume_min/volume_step; liegt der Lot unter dem Minimum des Symbols, wird er darauf angehoben (nie 0); unbekanntes Symbol zeigt „Geçersiz Sembol!“.

      - id: SYM-04
        titel: Symbolfehler sichtbar
        beschreibung: Kann der Worker die Symbole nicht aus MT5 holen (z. B. Terminal nicht eingeloggt), liefert GET /symbols/{id} neben der leeren Liste ein Feld error mit der MT5-Meldung und schreibt sie ins Robot-Log des Kontos; das Symbolfeld zeigt darunter einen Hinweis statt still leer zu bleiben.
        code: [worker_python/src/api/symbols.py, worker_python/src/utils/mt5_helpers.py, frontend_nextjs/src/hooks/useSymbolDetails.ts, frontend_nextjs/src/components/zone/ZoneBasicFields.tsx]
        tiers: [unit, api, e2e]
        pruefung:
          - Konto wählen, dessen MT5-Terminal nicht erreichbar oder nicht eingeloggt ist, und eine Zone öffnen.
        erwartet: Unter dem Symbolfeld steht „Symbole konnten nicht aus MT5 geladen werden“ mit der MT5-Meldung; dieselbe Meldung steht im Robot-Log.

  # ---------------------------------------------------------------------------
  - id: ZON
    titel: Zonen-Konfiguration (UI ↔ Backend)
    features:
      - id: ZON-01
        titel: Zone hinzufügen
        beschreibung: „Setup Ekle“ in einer Symbolkarte fügt eine neue Zone (Setup) mit dem Symbol der Karte und Standardwerten hinzu; Start-Lot ist der kleinste Lot des Symbols. Ein neues Symbol kommt über „Sembol Ekle“ (ZON-20).
        code: [frontend_nextjs/src/components/ZoneSettingsPanel.tsx, frontend_nextjs/src/components/zone/SymbolCard.tsx, frontend_nextjs/src/hooks/useZoneActions.ts, frontend_nextjs/src/utils/zoneHelpers.ts]
        tiers: [e2e]
        pruefung:
          - „Setup Ekle“ klicken, speichern, neu laden.
        erwartet: Neue Zone bleibt nach dem Neuladen erhalten.

      - id: ZON-02
        titel: Zone löschen
        beschreibung: Menü „…“ → „Setup’ı Sil“ → Bestätigung „Setup Sil“; beim letzten Setup eines Symbols „Sembolü Sil“, das Symbol verschwindet mit (ZON-20).
        code: [frontend_nextjs/src/components/zone/ZoneHeader.tsx, frontend_nextjs/src/components/ZoneSettingsPanel.tsx]
        tiers: [e2e]
        pruefung:
          - Test-Zone löschen und bestätigen, speichern.
        erwartet: Zone ist weg, auch nach Neuladen.

      - id: ZON-03
        titel: Basisfelder (Symbol, Emir Tipi, Min/Max Fiyat)
        beschreibung: Symbol, Ordertyp BUY/SELL/BOTH und Preisbereich der Zone.
        code: [frontend_nextjs/src/components/zone/ZoneBasicFields.tsx]
        tiers: [e2e]
        pruefung:
          - Jedes Feld ändern, speichern, neu laden.
        erwartet: Alle Werte bleiben erhalten; Ordertyp-Badge im Kopf passt.

      - id: ZON-04
        titel: Grid-Felder (Grid Adımı, Lot, Kar Al, Zarar Durdur)
        beschreibung: Gridabstand, Lotgröße, Take Profit, Stop Loss der Zone. Der Lot ist nie 0 und nie kleiner als der kleinste Lot des Symbols beim Broker (volume_min) - Symbolwechsel, Laden, neue Zone und Speichern heben ihn auf mindestens dieses Minimum an; ein leeres Feld oder 0 beim Tippen fällt auf den letzten gültigen Lot zurück.
        code: [frontend_nextjs/src/components/zone/ZoneGridFields.tsx, frontend_nextjs/src/utils/zoneHelpers.ts, frontend_nextjs/src/hooks/useZoneFieldHandlers.ts, worker_python/src/core/grid_execution/config.py]
        tiers: [e2e]
        pruefung:
          - Jedes Feld ändern, speichern, neu laden.
          - Lot leeren oder 0 eintragen und das Feld verlassen; danach ein Symbol mit größerem Mindestlot wählen (z. B. 0,1).
        erwartet: Alle Werte bleiben erhalten; der Lot bleibt nie bei 0, sondern zeigt mindestens das Minimum des Symbols.

      - id: ZON-05
        titel: SELL-Felder + BUY/SELL-Sync
        beschreibung: Bei Ordertyp BOTH eigene SELL-Werte (SELL Grid/Lot/KA/ZD) oder Schalter „BUY ve SELL için aynı ayarları uygula“.
        code: [frontend_nextjs/src/components/zone/ZoneSellFields.tsx, frontend_nextjs/src/components/zone/ZoneCard.tsx]
        tiers: [e2e]
        pruefung:
          - Ordertyp BOTH wählen, Sync aus → SELL-Felder ändern; Sync an.
        erwartet: SELL-Felder erscheinen nur bei BOTH und Sync aus; Werte bleiben nach Speichern erhalten.

      - id: ZON-06
        titel: Breakout-Felder
        beschreibung: Schalter „Sadece trend yönünde“, Pullback-Abstände, Alt/Üst Seviyeler (levels_below/above), Maks Pozisyon.
        code: [frontend_nextjs/src/components/zone/ZoneBreakoutFields.tsx]
        tiers: [e2e]
        pruefung:
          - Breakout einschalten, Felder ändern, speichern, neu laden.
        erwartet: Alle Werte bleiben erhalten.

      - id: ZON-07
        titel: Exit-Felder (Bereinigen beim Verlassen)
        beschreibung: Schalter „Fiyat bölgeden çıkınca temizle“; dann Çıkış Yönü, Hedef Taraf, Temizleme Kapsamı, Çıkış Tetikleyici und bei „Mum Kapanışı“ zusätzlich Zaman Dilimi.
        code: [frontend_nextjs/src/components/zone/ZoneExitFields.tsx]
        tiers: [e2e]
        pruefung:
          - Schalter an → Auswahlfelder prüfen; Auslöser „Mum Kapanışı“ wählen.
        erwartet: Die vier Auswahlfelder erscheinen erst mit dem Schalter; Zeitrahmen nur bei Kerzenschluss.

      - id: ZON-08
        titel: Start/Pause pro Zone
        beschreibung: Button im Zonenkopf (Başladı / Başla / Hazır / Kapalı) setzt is_active (POST /settings) und START/PAUSE in ui_state (POST /ui-state); Warnung bei ungültigem Symbol oder ungespeicherter Zone.
        code: [frontend_nextjs/src/components/zone/ZoneHeader.tsx, frontend_nextjs/src/services/zoneApi.ts, worker_python/src/api/ui_state.py]
        tiers: [api, e2e, live]
        pruefung:
          - Test-Zone starten und wieder pausieren.
          - Neue, ungespeicherte Zone starten.
        erwartet: Label wechselt passend; ungespeicherte Zone zeigt eine Warnung.

      - id: ZON-09
        titel: „Kaydedilmedi“-Badge
        beschreibung: Zonen mit ungespeicherten Änderungen tragen den Badge „Kaydedilmedi“.
        code: [frontend_nextjs/src/hooks/useZoneDirtyTracking.ts, frontend_nextjs/src/components/zone/ZoneHeader.tsx]
        tiers: [e2e]
        pruefung:
          - Ein Feld ändern, dann speichern.
        erwartet: Badge erscheint nach der Änderung und verschwindet nach dem Speichern.

      - id: ZON-10
        titel: Zahlenfelder leerbar
        beschreibung: Zahlenfelder der Zone (Preis, Grid, Lot, KA/ZD, Pullback, Seviyeler) halten einen lokalen Text-Entwurf; die letzte Ziffer lässt sich löschen, erst beim Verlassen des Feldes erscheint wieder der echte Wert.
        code: [frontend_nextjs/src/components/ui/NumberInput.tsx, frontend_nextjs/src/hooks/useZoneFieldHandlers.ts]
        tiers: [e2e]
        pruefung:
          - Ein Zahlenfeld mit Rücktaste komplett leeren, dann neu tippen (z. B. 0.05) und das Feld verlassen.
        erwartet: Feld bleibt beim Löschen leer, Zwischenstände wie „0.“ bleiben erhalten, nach dem Verlassen steht der gespeicherte Wert (leer → 0).

      - id: ZON-11
        titel: Einzelne Zone speichern
        beschreibung: Jede Zonenkarte hat einen eigenen „Kaydet“-Button, der nur diese Zone im Worker ersetzt (neue Zone wird angehängt). Andere Zonen und Einstellungen mit ungespeicherten Änderungen bleiben ungespeichert; „Tüm Ayarları Kaydet“ (neben „Bölge Ekle“) speichert weiterhin alles.
        code: [frontend_nextjs/src/hooks/useZoneActions.ts, frontend_nextjs/src/services/zoneApi.ts, frontend_nextjs/src/components/zone/ZoneHeader.tsx, frontend_nextjs/src/app/hooks/useDashboard.ts]
        tiers: [e2e]
        pruefung:
          - Zone 1 ändern, Zone hinzufügen, nur bei der neuen Zone „Kaydet“ klicken.
          - Danach bei Zone 1 „Kaydet“ klicken.
        erwartet: Nach dem ersten Klick liegt die neue Zone im Worker, Zone 1 trägt weiter „Kaydedilmedi“ und „Tüm Ayarları Kaydet“ bleibt aktiv; nach dem zweiten Klick sind Badge und Dirty-Zustand weg.

      - id: ZON-12
        titel: Symbol-Richtwerte in den Hinweisen
        beschreibung: Der (i)-Hinweis von Grid-Abstand und Take Profit (Buy/Sell) nennt für gängige Symbole (Gold, Silber, Forex, BTC/ETH, US-Indizes, Öl) einen Richtwert; bei unbekanntem Symbol bleibt der Text unverändert. Nur Anzeige, keine Validierung.
        code: [frontend_nextjs/src/utils/symbolGuidance.ts, frontend_nextjs/src/components/zone/useGuidedHints.ts, frontend_nextjs/src/components/zone/ZoneGridFields.tsx, frontend_nextjs/src/components/zone/ZoneSellFields.tsx]
        tiers: [e2e]
        pruefung:
          - Symbol auf XAUUSD stellen, mit der Maus über das (i) von Grid-Abstand und Take Profit fahren.
          - Symbol auf ein unbekanntes Symbol stellen.
        erwartet: Bei XAUUSD steht „1–5“ als Richtwert im Hinweis; bei unbekanntem Symbol nur der Standardtext.

      - id: ZON-13
        titel: Abstand nach Verlust ($)
        beschreibung: Schalter „Abstand nach Verlust ($)“ in der Zonenkarte. Wenn an, sind Grid-Abstand (BUY/SELL), Min./BUY-/SELL-Pullback, Take Profit und Stop Loss $-Beträge statt Preisabstände; beim Umschalten werden vorhandene Werte mit Lotgröße und Tick-Wert umgerechnet, unter dem Feld steht der entsprechende Preisabstand. Wird mit der Zone gespeichert (step_by_loss). Der Schalter steht direkt unter dem Grid-Abstand und dessen Preisabstand-Vorschau; der gemeinsame Block bleibt beim Zeilenumbruch zusammen, auch im Backtest-Editor.
        code: [frontend_nextjs/src/components/zone/ZoneCard.tsx, frontend_nextjs/src/components/zone/ZoneGridFields.tsx, frontend_nextjs/src/components/zone/ZoneSellFields.tsx, frontend_nextjs/src/components/zone/ZoneBreakoutFields.tsx, frontend_nextjs/src/components/zone/LossPreview.tsx, frontend_nextjs/src/utils/zoneHelpers.ts]
        tiers: [e2e, manuell]
        pruefung:
          - Zone mit EURUSD, 0,10 Lot anlegen, „Abstand nach Verlust ($)“ einschalten, Grid-Abstand 10 und Take Profit 5 eingeben.
          - Speichern, Bot auf dem DEMO-Konto laufen lassen und die Pending Orders in MT5 ansehen.
        erwartet: Unter dem Feld steht „≈ 0,001 Preisabstand bei 0,1 Lot“; die Orders liegen 0,00100 auseinander (ab der zuletzt eröffneten Position), jede neue Position öffnet, wenn die vorige 10 $ im Minus ist; der TP liegt 0,00050 vom Einstieg.

      - id: ZON-14
        titel: Sofort erste Position
        beschreibung: Schalter „Sofort erste Position“ in der Zonenkarte (instant_entry), unabhängig von „Abstand nach Verlust“. Wird mit der Zone gespeichert.
        code: [frontend_nextjs/src/components/zone/ZoneCard.tsx, frontend_nextjs/src/utils/zoneHelpers.ts]
        tiers: [e2e, manuell]
        pruefung:
          - Zone (BUY und SELL) auf dem DEMO-Konto anlegen, Preis innerhalb des Bereichs, „Sofort erste Position“ einschalten, speichern, Bot starten.
          - Warten, bis eine Seite per Take Profit schließt.
        erwartet: Beim Start öffnen sofort 1 BUY und 1 SELL zum Marktpreis; die Pending Orders liegen einen Grid-Abstand davon entfernt; nach dem TP öffnet der Bot auf dieser Seite sofort wieder eine Position.

      - id: ZON-15
        titel: Einstiegsmodus Fraktal
        beschreibung: Auswahl „Einstiegsmodus“ (Grid/Fraktal, entry_mode) in der Zonenkarte. Im Fraktal-Modus werden Grid-Felder, „Abstand nach Verlust“, „Sofort erste Position“ und Trend/Pullback ausgeblendet; stattdessen Zeitrahmen (M1–D1, Standard H4), Ordertyp (Ausbruch/Abpraller), Lot, Max. Positionen, SL-Methode (ATR/SAR/Gegenfraktal/Fraktal-Kerze) mit passenden Feldern, SL-Puffer und Chance/Risiko (per Switch „TP als Betrag“ stattdessen TP-Betrag in Kontowährung). Wird mit der Zone gespeichert.
        code: [frontend_nextjs/src/components/zone/ZoneCard.tsx, frontend_nextjs/src/components/zone/ZoneFractalFields.tsx, frontend_nextjs/src/utils/zoneHelpers.ts]
        tiers: [e2e, manuell]
        pruefung:
          - Zone auf dem DEMO-Konto auf „Fraktal“ stellen, H4, Ausbruch, SL „Automatisch (ATR)“, speichern, Bot starten.
          - Im MT5-Chart (H4) den Indikator „Fractals“ und ATR(14) einblenden und mit den Pending Orders vergleichen.
          - Eine Fraktal-Order in MT5 von Hand löschen.
        erwartet: Mit Anzahl 1 (Standard, siehe ZON-16) je Seite genau eine Pending Order auf Höhe des jüngsten, noch nicht erreichten Fraktals (Buy Stop am oberen, Sell Stop am unteren); SL = Fraktal-Kerze ± 1,5 × ATR, TP = 2 × SL-Abstand. Die von Hand gelöschte Order wird nicht neu gesetzt, erst beim nächsten Fraktal dieser Seite.

      - id: ZON-17
        titel: Fraktal – Schalter „Mit SL“
        beschreibung: Im Fraktal-Modus blendet der Schalter „Mit SL (Stop Loss)“ (fractal_use_sl, Standard an) die SL-Felder (Methode, ATR, SAR, Puffer) aus; Orders kommen dann ohne SL. Ohne SL ist „TP als Betrag“ fest aktiv (Chance/Risiko braucht einen SL). Wird mit der Zone gespeichert.
        code: [frontend_nextjs/src/components/zone/ZoneFractalFields.tsx, worker_python/src/core/grid_execution/fractal_entry.py]
        tiers: [e2e, unit]
        pruefung:
          - Fraktal-Zone auf dem DEMO-Konto, „Mit SL“ ausschalten, speichern, Bot starten.
        erwartet: Pending Orders ohne SL in MT5; TP nur als Betrag.

      - id: ZON-16
        titel: Fraktal – Anzahl Orders je Richtung
        beschreibung: Im Fraktal-Modus legt „Anzahl Orders“ fest, auf wie vielen der jüngsten Fraktale je Richtung eine Pending Order steht (fractal_order_count, 1–20, Standard 1). Nur BUY oder nur SELL → ein Feld „Anzahl BUY-Orders“ bzw. „Anzahl SELL-Orders“; Beide mit „Buy/Sell gleich“ → ein Feld „Anzahl Orders (BUY & SELL)“; Beide ohne „gleich“ → getrennte Felder (sell_fractal_order_count). Die Infokarte im Diagramm zeigt den Wert. Wird mit der Zone gespeichert.
        code: [frontend_nextjs/src/components/zone/ZoneFractalFields.tsx, frontend_nextjs/src/components/chart/ZoneChartPanel.tsx, frontend_nextjs/src/utils/zoneHelpers.ts]
        tiers: [e2e, manuell]
        pruefung:
          - Fraktal-Zone auf dem DEMO-Konto, Richtung BUY, „Anzahl BUY-Orders“ 3, speichern, Bot starten.
          - Im MT5-Chart den Indikator „Fractals“ einblenden und die letzten drei oberen Fraktale mit den Buy-Stop-Orders vergleichen.
          - Eine der Orders in MT5 von Hand löschen.
        erwartet: Buy Stops nur auf den letzten drei oberen Fraktalen, soweit der Kurs sie noch nicht erreicht hat und sie im Preisbereich liegen (also höchstens drei, oft weniger). Für die gelöschte Order kommt keine neue, auch nicht auf einem älteren Fraktal; die übrigen bleiben stehen.
      - id: ZON-19
        titel: Symbol mit Setups – Speicherformat, Migration und Austausch mit der Oberfläche
        beschreibung: Die Einstellungsdatei speichert die Zonen nach Symbol gruppiert, SYMBOLS = [{symbol, setups}]. Jedes Setup ist eine frühere Zone mit ihren Feldern (ohne symbol), ihrer id und ihrer festen Magic (ENG-27). Bot, Stream, MT5-Sync, Zonenregister und Zeitprüfung lesen eine flache Liste mit einer Zone je Setup (Symbol für Symbol, im Symbol die Setups). Eine alte Datei (ZONES) wird beim ersten Speichern umgestellt; vorher legt der Worker eine Kopie unter configs/backup/<Dateiname>.before-symbols.json an. Lesen (GET, Bot) schreibt nie. GET liefert nur SYMBOLS; jedes Setup trägt seinen Platz in der Engine-Reihenfolge (index, nur lesend, beim Speichern verworfen). zone_states und ui-state-Befehle zählen nach diesem Platz; die Oberfläche zeigt die Setups nach Symbol gruppiert (ZON-20) und speichert nur SYMBOLS. Steht ZONES in der Anfrage oder in der Datei, gilt ZONES (ein alter Browser-Tab schickt ZONES mit veralteten SYMBOLS; eine ältere Worker-Version schreibt nur ZONES), sonst SYMBOLS. Ein kaputtes SYMBOLS ohne ZONES (keine Liste, Eintrag ohne symbol oder ohne setups-Liste) gibt 422, die Datei bleibt. Ändert das Gruppieren oder Löschen die Reihenfolge und läuft der Bot nicht, zieht die API die Zonenbefehle in der ui_state-Datei (PAUSE/AUTO_CLEAR je Listenplatz) über die Magic auf die neuen Plätze um; ein laufender Bot macht das selbst (ENG-27).
        code: [worker_python/src/utils/symbol_setups.py, worker_python/src/api/settings.py, worker_python/src/api/models.py, worker_python/src/core/wrappers.py, worker_python/src/api/ws_server.py, worker_python/src/api/market.py, worker_python/src/utils/state_manager.py, frontend_nextjs/src/lib/symbolSetups.ts, frontend_nextjs/src/services/zoneApi.ts, frontend_nextjs/src/hooks/useAccountSettings.ts, frontend_nextjs/src/store/useSettingsStore.ts]
        tiers: [unit, api, e2e]
        pruefung:
          - DEMO-Konto mit zwei Zonen auf XAUUSD und einer auf EURUSD, alle mit offenen Orders; Bot läuft.
          - Worker auf den neuen Stand bringen, im Dashboard eine Einstellung ändern und speichern.
          - configs/settings_<id>_Auto_Grid.json und configs/backup/ ansehen; MT5-Orders und Bot-Log prüfen.
        erwartet: Die Datei enthält SYMBOLS mit XAUUSD (2 Setups) und EURUSD (1 Setup), alle Magic-Nummern wie vorher; die Kopie der alten Datei liegt in configs/backup/. Der Bot behält alle Orders und Positionen (gleiche Tickets), das Dashboard zeigt alle drei Zonen wie vorher.

      - id: ZON-20
        titel: Symbolkarten – Setups nach Symbol gruppiert
        beschreibung: Der Zonenbereich zeigt je Symbol eine Karte. Ihr Kopf hat das Symbolfeld, die Zahl der Setups, den Preis, Markt offen/geschlossen und „Setup Ekle“; „Sembol Ekle“ steht in der Steuerleiste neben ⋯ (UI-09); darunter steht jedes Setup als eigene Karte mit dem Kopf „Setup n“. Das Symbolfeld gilt für alle Setups des Symbols und übernimmt die Eingabe erst bei Auswahl aus der Liste oder beim Verlassen des Feldes nach einer Eingabe. „Sembol Ekle“ fragt das Symbol ab und legt das erste Setup an (Lot = kleinster Lot des Symbols; hat das Symbol schon eine Karte, kommt das Setup dorthin). „Setup Ekle“ fragt nicht nach dem Symbol und fügt das Setup hinter dem letzten Setup des Symbols ein. Das letzte Setup eines Symbols zu löschen nimmt das Symbol mit (eigene Rückfrage „Sembolü Sil“). zone_states, zone_market_* und ui-state-Befehle zählen nach dem Engine-Platz der zuletzt geladenen oder gespeicherten Reihenfolge (engineOrder, nach id), nicht nach dem Platz in der Karte; ein ungespeichertes Setup verschiebt die Plätze der anderen nicht. Nach jedem Speichern übernimmt die Oberfläche die vom Worker gruppierte Reihenfolge. Start/Pause schickt den Befehl vor dem Speichern an den heutigen Platz (die ui_state-Datei zieht der Worker bei gestopptem Bot, sonst der Bot beim nächsten Einlesen mit um); scheitert das Speichern, geht der alte Zustand zurück. Das Setup ist kompakt. Zahlenfelder haben eine kurze, feste Breite (Preis 128 px, Abstand 112 px, Lot und Faktor 96 px, Ganzzahl 80 px), Auswahlfelder sind so breit wie Inhalt oder Beschriftung, und die Felder stehen in umbrechenden Zeilen. Zusammengehörige Felder und Schalter bleiben beieinander. „Abstand nach Verlust“ steht direkt unter dem Grid-Abstand und dessen Vorschau in einem gemeinsamen Block; die übrigen Schalter stehen in Feldzeilen daneben, „BUY/SELL gleich“ neben dem Ordertyp, „Erste Position sofort“ hinter dem SL, „Nur Trend“ vor dem Pullback, „Bereinigen“ vor seinen Auswahlfeldern, im Fraktal-Modus „SL“ vor der SL-Methode und „TP als Betrag“ vor dem TP-Feld.
        code: [frontend_nextjs/src/app/page.tsx, frontend_nextjs/src/components/ZoneSettingsPanel.tsx, frontend_nextjs/src/components/zone/SymbolCard.tsx, frontend_nextjs/src/components/zone/AddSymbolDialog.tsx, frontend_nextjs/src/components/zone/ZoneCard.tsx, frontend_nextjs/src/components/zone/ZoneHeader.tsx, frontend_nextjs/src/components/zone/ZoneBasicFields.tsx, frontend_nextjs/src/components/zone/ZoneGridFields.tsx, frontend_nextjs/src/components/zone/ZoneSellFields.tsx, frontend_nextjs/src/components/zone/ZoneBreakoutFields.tsx, frontend_nextjs/src/components/zone/ZoneExitFields.tsx, frontend_nextjs/src/components/zone/ZoneFractalFields.tsx, frontend_nextjs/src/components/zone/FieldSwitch.tsx, frontend_nextjs/src/hooks/useZoneActions.ts, frontend_nextjs/src/lib/symbolSetups.ts, frontend_nextjs/src/store/useSettingsStore.ts, frontend_nextjs/src/services/zoneApi.ts]
        tiers: [e2e]
        pruefung:
          - DEMO-Konto mit zwei Symbolen; im Dashboard „Setup Ekle“ in einer Symbolkarte, „Sembol Ekle“ mit einem neuen Symbol, dann das einzige Setup eines Symbols löschen; speichern und neu laden.
          - Bei laufendem Bot prüfen, dass „Otomatik temizlendi“ und das Markt-Badge an der richtigen Karte stehen.
          - In einem Setup Ordertyp BOTH wählen, „BUY/SELL gleich“ aus, „Nur Trend“ und „Bereinigen“ an; ein zweites Setup auf Fraktal stellen.
        erwartet: Je Symbol eine Karte mit „Setup 1…n“; das neue Setup steht in seiner Symbolkarte; das gelöschte Symbol ist weg; nach dem Neuladen dieselben Karten; Motorzustände an den richtigen Setups. Die Setup-Felder sind kurz. „Abstand nach Verlust“ bleibt direkt unter dem Grid-Abstand; die übrigen Schalter bleiben neben ihrem Feld.

      - id: ZON-21
        titel: Fraktal – nächste Order ab Verlust (Betrag/Pips/Ticks)
        beschreibung: "Fraktal-Verlustgrenze: Geld in Kontowährung oder echte Pips bei Forex (3/5 Stellen: 10 × point, sonst point), Broker-Ticks bei anderen Instrumenten (trade_tick_size). Formular, Tooltip und Preisabstand-Vorschau passen zum Symbol. Alte Preisabstände ohne fractal_next_loss_unit_version werden nur lokal umgerechnet; ausdrückliches Speichern schreibt die Anzahl und Version 1, ohne den Preisabstand zu ändern. Fehlende Einheitsgröße sperrt die Abstandseingabe."
        code: [frontend_nextjs/src/components/zone/ZoneFractalFields.tsx, frontend_nextjs/src/utils/zoneHelpers.ts]
        tiers: [e2e, manuell]
        pruefung:
          - Fraktal-Zone auf dem DEMO-Konto, BUY, „Nächste Order ab Verlust“ 1, speichern, Bot starten und warten, bis eine Fraktal-Order auslöst.
          - Pending Orders und Bot-Log beobachten, während die Position ins Minus läuft.
        erwartet: Solange die letzte BUY-Position weniger als 1 $ im Minus ist, liegt keine BUY-Order und das Log meldet „Sonraki emir … zarara geçince konacak“; ab −1 $ kommen die BUY-Orders auf die jüngsten Fraktale zurück.

  # ---------------------------------------------------------------------------
  - id: BOT
    titel: Bot-Steuerung
    features:
      - id: BOT-01
        titel: Bot starten
        beschreibung: POST /start verbindet MT5 (Timeout 120 s), cached die Symbole, startet bot_runner.py als eigenen Prozess und stellt ihn unter Watchdog. UI-Timeout für „Connecting“ 180 s.
        code: [worker_python/src/api/bot_control.py, worker_python/src/utils/bot_manager.py, worker_python/src/core/bot_runner.py, frontend_nextjs/src/components/BotControls.tsx]
        tiers: [live]
        pruefung:
          - DEMO-Konto wählen, „Start Bot“.
        erwartet: Status wechselt über „Connecting“ zu „Running“, Markt offen/geschlossen wird angezeigt.

      - id: BOT-02
        titel: Bot stoppen
        beschreibung: POST /stop nimmt den Bot aus dem Watchdog und beendet den Prozess; Positionen und Orders bleiben unangetastet. Bestätigung „Disconnect MT5“.
        code: [worker_python/src/api/bot_control.py, worker_python/src/utils/bot_manager.py, frontend_nextjs/src/components/BotControls.tsx]
        tiers: [live]
        pruefung:
          - „Stop Bot“ → bestätigen; in MT5 die offenen Positionen prüfen.
        erwartet: Status „Stopped“; Positionen sind noch da.

      - id: BOT-03
        titel: Neustart veralteter/hängender Bot
        beschreibung: Läuft ein Bot mit alter VERSION oder ohne frische Metriken (> 180 s), startet /start ihn neu; beim Worker-Start übernimmt startup_maintenance laufende Bots.
        code: [worker_python/src/api/bot_control.py, worker_python/src/utils/bot_manager.py]
        tiers: [unit]
        pruefung:
          - Nach einem Update „Restart Bot“ klicken.
        erwartet: Bot läuft danach mit der neuen Version (PID-Datei enthält neue VERSION).

      - id: BOT-04
        titel: Statusanzeige + Alarme
        beschreibung: Anzeige Connecting / Running / „process without MT5“ / Stopped, Marktstatus, Kontoname/Server; Alarme für API-Fehler, MT5-Verbindung, abgelehnte Order, Algo Trading aus.
        code: [frontend_nextjs/src/components/BotControls.tsx, frontend_nextjs/src/store/useBotRuntimeStore.ts]
        tiers: [e2e]
        pruefung:
          - In MT5 „Algo Trading“ ausschalten, während der Bot läuft.
        erwartet: Alarm „Algo Trading off“ erscheint; nach Einschalten verschwindet er.

      - id: BOT-05
        titel: Watchdog-Neustart
        beschreibung: Alle 15 s Prüfung; abgestürzter oder hängender Bot (600 s ohne Metriken) wird mit Backoff 15/30/60/120/240 s neu gestartet.
        code: [worker_python/src/utils/bot_watchdog.py]
        tiers: [unit]
        pruefung:
          - Auf dem VPS den bot_runner-Prozess im Task-Manager beenden.
        erwartet: Nach ≤ 30 s läuft der Bot wieder (Robot-Log zeigt Neustart).

      - id: BOT-06
        titel: Watchdog gibt auf
        beschreibung: Nach 5 Neustarts in 30 min hört der Watchdog auf; gelöschte Konten werden nicht mehr beobachtet.
        code: [worker_python/src/utils/bot_watchdog.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: BOT-07
        titel: Bots nach Worker-/VPS-Neustart fortsetzen
        beschreibung: Die Watchdog-Liste (Start ohne Stop) steht zusätzlich in data/watched_bots.json. Beim Worker-Start liest main.py sie ein; startup_maintenance startet jeden dort eingetragenen, nicht laufenden Bot neu (auch LIVE) und stellt ihn unter Watchdog, auch wenn der erste Start scheitert. Gestoppte Bots, gelöschte Konten und Bots, bei denen der Watchdog aufgegeben hat, fehlen in der Liste.
        code: [worker_python/src/utils/bot_watchdog.py, worker_python/src/api/bot_control.py, worker_python/main.py, worker_python/src/utils/paths.py]
        tiers: [unit, manuell]
        pruefung:
          - DEMO-Bot starten, dann auf der Seite „VPS“ → „VPS neu starten“.
        erwartet: Nach dem Reboot läuft der Bot wieder; das Robot-Log zeigt „[AUTO] Bot … devam ettirildi“.

  # ---------------------------------------------------------------------------
  - id: ENG
    titel: Grid-Engine (Handelslogik)
    features:
      - id: ENG-01
        titel: Zonenwahl – alle aktiven Setups handeln gleichzeitig
        beschreibung: "Jede aktive Zone (Setup) läuft für sich mit eigener Magic (ENG-27), eigenem Zustand und eigener Level-Sperre (ENG-05), auch mehrere Setups desselben Symbols gleichzeitig – wie der Backtest, der jedes Setup allein rechnet. Je Setup gilt: tritt der Mittelkurs (oder Schlusskurs der letzten Kerze bei „Mum Kapanışı“, Zeitrahmen exit_timeframe) in [min_price, max_price], wird der Eintritt geloggt; liegt er außerhalb, führt das Setup trotzdem sein Grid (früher nur die erste Zone des Symbols), und der Zonen-Ausstieg (ENG-10) prüft in der nächsten Runde nur dieses Setup. PAUSE/AUTO_CLEAR eines Setups stoppt nur dieses. Mehrere aktive Setups eines Symbols brauchen ein Hedging-Konto: auf Netting/Exchange bricht der Start mit Meldung ab (startup_error), und kommt das zweite Setup während des Laufs dazu, setzt der Bot keine Orders und loggt den Grund einmal. Anlass: Testwoche 2026-10 (docs/journal/2026-10-28-backtest-live-comparison-result.md, D1) – live handelte je Symbol nur Setup A."
        code: [worker_python/src/core/grid_zone_selector.py, worker_python/src/core/grid_orchestrator.py, worker_python/src/core/startup.py, worker_python/src/core/loop.py, frontend_nextjs/src/lib/backtest/engine/orchestrator.ts]
        tiers: [unit]
        pruefung:
          - Hedging-DEMO-Konto, ein Symbol mit zwei aktiven Setups, deren Bereiche den Kurs enthalten; Bot starten.
          - Eine weitere Zone mit anderem Symbol anlegen.
        erwartet: Beide Setups des Symbols haben eigene Pending Orders (Magic je Setup) und füllen unabhängig; die Zone mit anderem Symbol bekommt zusätzlich eigene Orders.

      - id: ENG-02
        titel: Sliding-Grid-Level
        beschreibung: Level werden an round(mid/step)*step verankert, levels_below/levels_above Stufen, auf die Zone begrenzt; acceptable-Sets mit ±2 Stufen Puffer.
        code: [worker_python/src/core/grid_execution/levels.py]
        tiers: [unit]
        pruefung:
          - Bot laufen lassen, Pending Orders in MT5 ansehen.
        erwartet: Orders liegen im Gridabstand um den Preis, nie außerhalb der Zone.

      - id: ENG-03
        titel: Breakout / Pullback
        beschreibung: Im Breakout-Modus nur Orders in Trendrichtung, mit pullback_distance / sell_pullback_distance.
        code: [worker_python/src/core/grid_execution/levels.py]
        tiers: [unit]
        pruefung:
          - Breakout-Zone aktivieren, Orders ansehen.
        erwartet: Orders nur in Trendrichtung und im Pullback-Abstand.

      - id: ENG-04
        titel: Zonen-Config lesen + Lot begrenzen
        beschreibung: extract_zone_config liest order_type, grid_step, lot_size und sell_lot_size (nie 0 - mindestens volume_min des Symbols beim Broker und auf dessen Lot-Schritt gerundet, nach oben auf 5,0 begrenzt; ohne Symbolinfos gilt 0,01 als Minimum), TP/SL, Symbol, sync_buy_sell, sell_*-Overrides, max_positions, is_active.
        code: [worker_python/src/core/grid_execution/config.py, worker_python/src/utils/trade_utils.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-05
        titel: Order-Platzierung LIMIT/STOP + TP/SL
        beschreibung: Fehlende Level bekommen Pending Orders mit TP/SL; LIMIT oder STOP je nach Seite des Marktes; Toleranz 0,45 × Gridabstand; als belegt zählen nur Orders und Positionen dieser Zone (eigene magic) und manuelle Positionen – Orders und Positionen anderer Zonen/Setups desselben Symbols belegen kein Level.
        code: [worker_python/src/core/grid_execution/placement.py, worker_python/src/core/grid_orders.py]
        tiers: [unit, live]
        pruefung:
          - Test-Zone (0,01 Lot) um den aktuellen Preis starten.
        erwartet: BUY LIMIT unter / BUY STOP über dem Preis (bzw. SELL umgekehrt), jeweils mit TP/SL.

      - id: ENG-06
        titel: Validierung + Bereinigung
        beschreibung: Orders außerhalb des Fensters oder mit falschem Lot/TP/SL werden gelöscht (erwartetes Lot berücksichtigt Teilausführungen). Die Toleranz zur Stufe beträgt 0,4 Schritt im festen Raster und im positionsgebundenen Modus (step_by_loss/instant_entry) nur den Rundungsspielraum, damit Orders des alten Ankers nicht stehen bleiben.
        code: [worker_python/src/core/grid_execution/validation.py]
        tiers: [unit]
        pruefung:
          - Bei laufendem Bot TP der Zone ändern und speichern.
        erwartet: Alte Orders werden gelöscht und mit neuem TP neu gesetzt.

      - id: ENG-07
        titel: Maximale Positionen
        beschreibung: Ist max_positions erreicht, werden die Pending Orders der Zone gelöscht; die Warnung erscheint einmal (erneut nur, wenn sich die Zahl ändert), nicht bei jedem Tick. Auch der Restlot-Nachschub (ENG-08) setzt dann nichts.
        code: [worker_python/src/core/grid_execution/handler.py]
        tiers: [unit, live]
        pruefung:
          - Maks Pozisyon = 1 setzen und eine Position füllen lassen.
        erwartet: Danach keine Pending Orders mehr in dieser Zone.

      - id: ENG-08
        titel: Teilausführung + TP/SL-Resync
        beschreibung: Geänderte TP/SL-Werte werden auf offene Positionen übertragen; liegt der neue TP/SL schon auf der falschen Seite des Kurses (MT5 würde mit 10016 ablehnen), wartet der Bot mit einer einmaligen Meldung und setzt ihn, sobald der Kurs es zulässt. Bei Teilausführung wird das Restlot neu gesendet, gemessen am Volumen der eröffnenden Order (history_orders_get), nicht am Lot in den Einstellungen; ein später erhöhtes Lot löst also keinen Nachschub aus. Am Positionslimit (ENG-07) kein Nachschub.
        code: [worker_python/src/core/grid_order_manager.py, worker_python/src/core/grid_orders.py, worker_python/src/core/grid_execution/validation.py]
        tiers: [unit]
        pruefung:
          - Bei offener Position den TP der Zone ändern und speichern.
          - "Nur DEMO: bei offenen 0,01-Positionen das Lot der Zone auf 0,02 erhöhen und speichern."
        erwartet: TP der offenen Position wird angepasst (liegt er schon hinter dem Kurs, steht einmal „TP/SL Bekliyor“ im Log). Nach der Lot-Erhöhung keine „Kısmi Dolum“-Meldungen und keine Orders auf den Leveln der offenen Positionen; neue Grid-Orders haben 0,02.

      - id: ENG-09
        titel: Zombie-Orders entfernen
        beschreibung: Orders pausierter, bereinigter, inaktiver Zonen oder mit falschem Symbol werden gelöscht.
        code: [worker_python/src/core/grid_order_manager.py]
        tiers: [unit]
        pruefung:
          - Zone mit offenen Orders pausieren.
        erwartet: Ihre Pending Orders verschwinden.

      - id: ENG-10
        titel: Bereinigung beim Verlassen der Zone
        beschreibung: "Mit clear_on_exit: Richtung (clear_exit_side), Umfang („Sadece Bekleyen Emirler“ oder „Tüm İşlemler“ = auch Positionen schließen) und Zielseite (BUY/SELL/alle). Danach steht die Zone auf AUTO_CLEAR: keine neuen Orders – auch nicht, wenn der Kurs zurückkommt – bis „Yeniden Başlat“ im Dashboard (oder Bot-Neustart)."
        code: [worker_python/src/core/grid_order_manager.py, worker_python/src/core/grid_orchestrator.py, worker_python/src/core/grid_zone_selector.py, frontend_nextjs/src/components/zone/ZoneHeader.tsx]
        tiers: [unit, live]
        pruefung:
          - Test-Zone knapp um den Preis legen, „temizle“ an, warten bis der Preis sie verlässt.
          - Warten, bis der Preis zurückkommt; dann „Yeniden Başlat“ in der Zone klicken.
        erwartet: Orders (bei „Tüm İşlemler“ auch Positionen) werden entfernt; die Zone zeigt „Otomatik temizlendi“ und setzt keine Orders mehr, bis „Yeniden Başlat“ geklickt wird.
      - id: ENG-11
        titel: Auto-Pause nach 3 Ablehnungen
        beschreibung: Nach 3 abgelehnten Orders in Folge wird die Zone pausiert (ui_state PAUSE) und order_rejected_alarm gesetzt.
        code: [worker_python/src/core/grid_orders.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-12
        titel: Order-Sicherheit (Stops-Level, order_check, 10027)
        beschreibung: safe_send_order normalisiert Volumen (nie unter volume_min - auch 0 wird zum Minimum -, nie über volume_max, Schritt ab volume_min), hält den Broker-Stops-Level ein (vermeidet 10016), prüft vorab mit order_check, erkennt 10027 (Algo Trading aus) und prüft, ob die Order wirklich existiert.
        code: [worker_python/src/utils/trade_utils.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-13
        titel: Fernsteuerung per MT5-Handy-App
        beschreibung: "Manuelle BUY LIMIT 0,01 Lot bei 1 $ = STOP, bei 2 $ = START; alternativ Kommentar GRID:STOP / GRID:START. STOP löscht alle Robot-Orders; die Signal-Order wird danach entfernt."
        code: [worker_python/src/core/grid_remote.py]
        tiers: [unit, manuell]
        pruefung:
          - In der MT5-App eine BUY LIMIT 0,01 bei Preis 1 setzen.
          - Danach BUY LIMIT 0,01 bei Preis 2 setzen.
        erwartet: Erst werden alle Robot-Orders gelöscht (remote_paused), dann läuft der Bot weiter; die Signal-Orders verschwinden.

      - id: ENG-14
        titel: Zustand beim Start wiederherstellen
        beschreibung: Beim Bot-Start sind alle Zonen PAUSE; active_zones_state wird aus den Magic-Numbers der vorhandenen Orders/Positionen aufgebaut (data/state_<id>.json), alte ui_state-Datei gelöscht.
        code: [worker_python/src/core/startup.py, worker_python/src/utils/state_manager.py, worker_python/src/core/bot_runner.py]
        tiers: [unit]
        pruefung:
          - Bot mit offenen Orders stoppen und neu starten.
        erwartet: Vorhandene Orders werden übernommen, nicht doppelt gesetzt.

      - id: ENG-15
        titel: Markt geschlossen + Reconnect
        beschreibung: Bei geschlossenem Markt (trade_mode ≠ 4 oder Tick älter als 180 s) wartet die Schleife 60 s; Verbindungsverlust → Reconnect mit exponentiellem Backoff; nur „Algo Trading aus“ → warten statt neu einloggen.
        code: [worker_python/src/core/loop.py, worker_python/src/core/reconnection.py, worker_python/src/core/grid_helpers.py]
        tiers: [unit]
        pruefung:
          - Am Wochenende Dashboard ansehen.
        erwartet: Markt wird als geschlossen angezeigt, keine neuen Orders.

      - id: ENG-16
        titel: Aufräumen beim Beenden der Schleife
        beschreibung: Beim Verlassen der Hauptschleife werden alle Pending Orders des Robots gelöscht.
        code: [worker_python/src/core/loop.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (/stop beendet den Prozess hart).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-17
        titel: Grid-Abstand nach Verlust ($) umrechnen
        beschreibung: Bei step_by_loss rechnet extract_zone_config grid_step, sell_grid_step, die Pullbacks sowie TP/SL (auch beim Nachziehen offener Positionen) als $-Betrag mit Lotgröße und trade_tick_value/trade_tick_size (Fallback Kontraktgröße) in Preisabstände um, gerundet auf den Point; die neue Position öffnet, wenn die vorige diesen Betrag im Minus ist. Ohne Symbolinfo wird die Zone abgelehnt.
        code: [worker_python/src/core/grid_execution/config.py, worker_python/src/core/grid_order_manager.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (siehe ZON-13).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-18
        titel: Sofort erste Position (Markt-Order)
        beschreibung: Bei instant_entry öffnet die Engine je Seite (BUY/SELL, bei BOTH beide) sofort eine Markt-Position, wenn die Zone dort keine offene Position hat und der Preis im Zonenbereich liegt – beim Start und nach dem Schließen (z. B. TP). Abgelehnte Orders werden erst nach 30 s wiederholt. Bei instant_entry/step_by_loss richtet sich das Raster an der zuletzt eröffneten Position der Seite aus (nicht am festen Preisraster).
        code: [worker_python/src/core/grid_execution/instant_entry.py, worker_python/src/core/grid_execution/levels.py, worker_python/src/core/grid_execution/handler.py, worker_python/src/core/grid_execution/validation.py, worker_python/src/core/grid_orders.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (siehe ZON-14).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-19
        titel: Fraktal-Erkennung, ATR und Parabolic SAR
        beschreibung: Bill-Williams-Fraktale aus 5 geschlossenen Kerzen wie MT5 Fractals.mq5 (Mitte > beide rechten, >= beide linken Nachbarn; erst gültig, wenn die zwei rechten Kerzen geschlossen sind). ATR als einfacher Durchschnitt der True Range wie MT5 ATR.mq5, Parabolic SAR nach Wilder inkl. Wert der laufenden Kerze.
        code: [worker_python/src/core/grid_execution/fractal_signals.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (siehe ZON-15).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-20
        titel: Fraktal-Orders (Ausbruch / Abpraller)
        beschreibung: Bei entry_mode „fractal“ setzt die Engine statt des Grids je Seite eine Pending Order auf das jüngste bestätigte Fraktal des gewählten Zeitrahmens (bzw. auf die letzten N, siehe ENG-26) – Ausbruch oberes → Buy Stop, unteres → Sell Stop; Abpraller oberes → Sell Limit, unteres → Buy Limit. order_type (BUY/SELL/BOTH) und der Preisbereich der Zone filtern; liegt der Kurs näher als stops_level, wird gewartet. Kommentar AutoGrid_Z{n}_F{U|D}{Kerzenzeit} (Orders früherer Setups mit Nummer, siehe ENG-29). Liegt die laufende Kerze mehr als zwei Perioden vor dem letzten Tick (MT5 lädt die Geschichte eines Symbols beim ersten Abruf noch nach), wartet die Engine und setzt keine Order auf ein veraltetes Fraktal.
        code: [worker_python/src/core/grid_execution/fractal_entry.py, worker_python/src/core/grid_execution/handler.py, worker_python/src/core/grid_execution/config.py, worker_python/src/core/grid_orders.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (siehe ZON-15).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-21
        titel: Fraktal-Order verschieben / löschen
        beschreibung: Entsteht ein neueres Fraktal derselben Seite, wird die alte Pending Order gelöscht und auf das neue gesetzt (mit Anzahl 1 immer höchstens eine je Seite, sonst wandert das Fenster der letzten N, siehe ENG-26). Hat eine spätere Kerze oder der aktuelle Kurs das Fraktal-Niveau erreicht, bevor eine Order steht, gilt es als verbraucht – es wird keine Order gesetzt. Eine bereits gesetzte Order bleibt dagegen stehen, ob sie füllt, entscheidet MT5 (Kerzen sind Bid, eine BUY LIMIT füllt erst, wenn der Ask das Niveau erreicht). Beim Umschalten von Grid auf Fraktal verschwinden die Grid-Orders der Zone.
        code: [worker_python/src/core/grid_execution/fractal_entry.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (siehe ZON-15).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-22
        titel: Fraktal-SL-Methoden und TP nach Chance/Risiko
        beschreibung: SL je nach fractal_sl_mode – ATR (Fraktal-Kerze ± Faktor × ATR der Fraktal-Kerze), Parabolic SAR (Wert der laufenden Kerze), Gegenfraktal (letztes Fraktal der Gegenseite ± Puffer) oder Fraktal-Kerze ± Puffer. Nicht berechenbar oder auf der falschen Seite → Fraktal-Kerze ± Puffer; ist auch das ungültig, keine Order. TP = Einstieg ± fractal_rr × SL-Abstand, 0 = kein TP; mit fractal_use_sl=false (Schalter „Mit SL“ aus) kommt die Order ohne SL, dann ist nur TP als Betrag möglich (kein Chance/Risiko-TP, kein SAR-Nachziehen); mit fractal_tp_by_money stattdessen TP = Einstieg ± Preisabstand, der fractal_tp_money (Kontowährung) beim Lot der Seite entspricht (0 oder kein Tick-Wert = kein TP).
        code: [worker_python/src/core/grid_execution/fractal_entry.py, worker_python/src/core/grid_execution/fractal_signals.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (siehe ZON-15).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-23
        titel: Fraktal-Positionen – kein TP/SL-Abgleich, SAR nachziehen
        beschreibung: Für Positionen einer Fraktal-Zone entfallen der TP/SL-Abgleich mit den Grid-Werten und die Teilfüllungs-Nachorder, auch von Hand geänderte SL/TP bleiben stehen. Im SAR-Modus wird der SL offener Positionen mit jeder Kerze auf den neuen SAR gezogen, nur in Gewinnrichtung und außerhalb von stops_level.
        code: [worker_python/src/core/grid_order_manager.py, worker_python/src/core/grid_execution/fractal_entry.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (siehe ZON-15).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-24
        titel: Manuelle Eingriffe in MT5 respektieren
        beschreibung: Verschwindet eine Fraktal-Order, ohne dass der Bot sie gelöscht hat (gefüllt, in MT5 von Hand gelöscht, abgelaufen), oder gibt es eine Position dieses Fraktals, gilt das Fraktal als erledigt – auch nach dem Schließen der Position wird dafür keine neue Order gesetzt. Der Merker (Zone + Seite → Kerzenzeiten der erledigten Fraktale) steht in data/fractal_state_<Konto>.json und übersteht Neustarts; ein neueres Fraktal öffnet wieder eine Order. Vom Bot selbst gelöschte Orders (Zone pausiert, Max. Positionen, Verschieben) zählen nicht.
        code: [worker_python/src/core/grid_execution/fractal_entry.py, worker_python/src/core/grid_orders.py, worker_python/src/utils/paths.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (siehe ZON-15).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-25
        titel: Von außen gelöschte Orders erkennen + Order-Flut-Bremse
        beschreibung: Der Bot merkt sich jede Pending Order, die er setzt. Verschwindet sie, ohne dass er sie gelöscht hat und ohne Füllung (keine Position, Historie nicht FILLED), schreibt er eine Warnung mit dem Status aus der MT5-Historie (CANCELED/EXPIRED/REJECTED …), Ticket, Preis und Lebensdauer. Werden in einer Zone 10 Orders innerhalb von 60 s so entfernt, pausiert die Zone (wie ENG-11) mit Alarm, statt die Level endlos neu zu setzen; Positionen bleiben unberührt. Auch wer selbst 10 Orders in 60 s in MT5 löscht, pausiert so die Zone (Neustart über die Oberfläche). Anlass - am 29.09. verschwanden auf DEMO-Konto B alle Orders 2–5 s nach dem Setzen, ohne Löschung im Journal des eigenen Terminals, und der Bot setzte rund 200 Orders pro Minute.
        code: [worker_python/src/core/grid_execution/vanished.py, worker_python/src/core/grid_orders.py, worker_python/src/core/grid_orchestrator.py, worker_python/src/utils/trade_utils.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (Order-Löschung von außen lässt sich nur mit einem zweiten Terminal nachstellen).
          - Im Ernstfall - Robot-Log nach „MT5'te kayboldu“ bzw. „Emir seli durduruldu“ durchsuchen; der Historien-Status zeigt, wer löscht.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-26
        titel: Fraktal – mehrere Orders je Richtung
        beschreibung: fractal_order_count (BUY) und sell_fractal_order_count (SELL, nur bei BOTH ohne sync_buy_sell, sonst = BUY-Wert) legen fest, auf wie vielen der jüngsten Fraktale je Richtung eine Pending Order steht (1–20, Standard 1). Betrachtet werden nur die letzten N Fraktale der Seite - ist eines erreicht, ausgelöst, von Hand gelöscht oder außerhalb des Preisbereichs, bleibt sein Platz leer, ältere rücken nicht nach. Nur Pending Orders zählen - „Max. Positionen“ wird wie bisher erst in der nächsten Runde geprüft, lösen mehrere Orders zwischen zwei Runden aus, kann es kurz überschritten werden. Ein neues Fraktal schiebt das Fenster weiter, die Order des ältesten wird gelöscht. „Erledigt“ wird je Fraktal gemerkt, damit eine ausgelöste Order die übrigen nicht löscht; alte Zustandsdateien mit nur einer Kerzenzeit je Seite werden weiter gelesen.
        code: [worker_python/src/core/grid_execution/fractal_entry.py, worker_python/src/core/grid_execution/config.py, worker_python/src/core/state.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (siehe ZON-16).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-27
        titel: Feste Magic-Nummer je Zone (Löschen verschiebt nichts)
        beschreibung: Jede Zone bekommt beim Speichern eine feste Magic-Nummer (200001–200999), die nur der Worker vergibt und nie neu vergibt (ZONE_MAGIC_MAX). Bestehende Zonen behalten ihre bisherige Nummer (200000 + Listenplatz + 1), offene Orders und Positionen bleiben also zugeordnet. Die Engine findet die Zone einer Order/Position über die Magic, nicht mehr über den Listenplatz - wird eine Zone gelöscht, behalten die Zonen dahinter ihre Orders, Positionen, TP/SL und ihren Status; Orders der gelöschten Zone werden als Zombies gelöscht, ihre Positionen bekommen nicht mehr den TP/SL einer anderen Zone. Der laufende Bot erkennt das Löschen beim Neuladen der Einstellungen und trägt seinen nach Listenplatz geführten Zustand (aktive Zonen, PAUSE/AUTO_CLEAR auch in der ui_state-Datei, Fraktal-Tracking, Ablehnungs- und Verschwunden-Zähler) über die Magic auf den neuen Platz um; war die gelöschte Zone die aktive, gilt nicht plötzlich ihr Nachbar als aktiv (sonst liefe dort der Zonen-Ausstieg). Ist die Einstellungsdatei beim Neuladen kurz unlesbar (wird gerade geschrieben, Windows-Sperre), läuft der Bot mit den zuletzt gelesenen Zonen weiter, statt „keine Zonen“ anzunehmen und alle Robot-Orders als Zombies zu löschen; die API schreibt die Datei atomar. Order-Kommentare (AutoGrid_Z{n}, Fraktal AutoGrid_Z{n}_F…) nehmen n aus der Magic. Anlass - vorher rutschten beim Löschen von Zone 1 alle Magic-Nummern dahinter um eins.
        code: [worker_python/src/utils/zone_magic.py, worker_python/src/api/settings.py, worker_python/src/core/grid_zone_state.py, worker_python/src/core/wrappers.py, worker_python/src/core/grid_orders.py, worker_python/src/core/grid_order_manager.py, worker_python/src/core/grid_execution/config.py, worker_python/src/core/grid_execution/vanished.py, worker_python/src/core/startup.py]
        tiers: [unit, api]
        pruefung:
          - Demo-Konto mit zwei Zonen auf demselben Symbol, beide mit offenen Orders (und möglichst einer Position).
          - Zone 1 löschen und speichern.
          - Zone 2 behält ihre Orders und Positionen (gleiche Tickets, Magic 200002), ihre TP/SL ändern sich nicht; nur die Orders von Zone 1 verschwinden.
        erwartet: Löschen einer Zone lässt die übrigen Zonen unverändert weiterlaufen.
      - id: ENG-29
        titel: Orders entfernter Fraktal-Setups (Rückfrage vor dem Löschen)
        beschreibung: "Zusätzliche Fraktal-Setups je Zone (früher ZON-18/ENG-28) gibt es nicht mehr; eine Fraktal-Zone hat wieder genau eine Fraktal-Einstellung und der Order-Kommentar ist AutoGrid_Z{n}_F{U|D}{Kerzenzeit}. Pending Orders früherer Setups (gleiche Magic, Kommentar AutoGrid_Z{n}_F{k}{U|D}{zeit} mit k ≥ 2, src/core/legacy_setup_orders.py) behandelt der Bot nicht als Orders der Zone und löscht sie nicht von selbst. Er meldet sie in den Live-Daten (legacy_setup_orders); das Dashboard fragt einmal je Konto in einem Fenster (Konto, Anzahl, Symbole): „Orders löschen“ oder „Orders behalten“. Die Wahl steht als LEGACY_SETUP_ORDERS (delete/keep, sonst 422) in den Einstellungen: bei delete storniert der Bot diese Orders in jeder Runde und loggt jede, bei keep fasst er sie nicht an und das Fenster kommt nicht wieder; Abbrechen speichert nichts und fragt nach dem Neuladen wieder. Offene Positionen früherer Setups bleiben und zählen zur Positionsgrenze der Zone. Zone deaktivieren, löschen, Zonen-Ausstieg mit Löschen und Bot-Stopp löschen wie bisher alle Robot-Orders. Beim Speichern entfernt der Worker fractal_setups, fractal_setup_seq und fractal_kept_sids aus den Zonen. Das Trade-Archiv zählt Trades früherer Setups zur Zone, aber nicht als Fraktal-Trades des Charts."
        code: [worker_python/src/core/legacy_setup_orders.py, worker_python/src/core/grid_orchestrator.py, worker_python/src/core/grid_metrics.py, worker_python/src/core/wrappers.py, worker_python/src/api/settings.py, worker_python/src/core/grid_execution/fractal_entry.py, worker_python/src/core/grid_orders.py, frontend_nextjs/src/components/LegacySetupOrdersDialog.tsx, frontend_nextjs/src/lib/analysis/tradePairing.ts]
        tiers: [unit, api, e2e]
        pruefung:
          - "Keine manuelle Prüfung (2026-10-13, docs/journal/2026-10-13-eng-29-and-update-task-running.md): bei der Prüfung meldete kein laufender Bot Orders früherer Setups (legacy_setup_orders = []), und neue entstehen nicht mehr. Unit-, API- und e2e-Tests decken die Logik ab; das Löschen gegen ein echtes MT5-Terminal ist nicht geprüft."
          - "Meldet ein Bot doch solche Orders (legacy_setup_orders nicht leer, Fenster im Dashboard; MT5-Kommentar …_F2U… oder …_F3D…): Dashboard öffnen, Konto wählen; im Fenster „Orders behalten“ wählen, Seite neu laden."
          - Danach LEGACY_SETUP_ORDERS auf delete setzen (oder auf einem zweiten Konto im Fenster „Orders löschen“ wählen), das Bot-Log ansehen und das Ergebnis ins Journal schreiben.
        erwartet: Das Fenster nennt Konto, Anzahl und Symbol und erscheint nach „Orders behalten“ nicht wieder; die Orders bleiben unverändert in MT5. Nach „Orders löschen“ verschwinden nur die Orders mit Setup-Nummer, je Order steht „Eski fraktal kurgusu emri siliniyor“ im Log; die eigenen Fraktal-Orders der Zone und alle Positionen bleiben.

      - id: ENG-30
        titel: Fraktal – nächste Order erst ab Verlust der letzten Position
        beschreibung: "Je Zone und Richtung gilt die letzte offene Position: money prüft Profit ≤ −X, pips mit Version 1 prüft Preisabstand ≥ Anzahl × symbolabhängige Pip-/Tick-Größe. BUY verwendet Einstieg − Bid, SELL Ask − Einstieg; kleine Einheitstoleranz verhindert Rundungsfehler am Grenzwert. Version 0/fehlend behält den alten direkten Preisabstand. Bei aktiver neuer Abstandssperre und fehlenden/ungültigen Symbolinformationen entstehen keine neuen Orders; ein Warnlog nennt die Ursache. 0 oder keine Position bei gültigen Symbolinformationen: keine Grenze. Worker und Backtest rechnen gleich."
        code: [worker_python/src/core/grid_execution/fractal_entry.py, worker_python/src/core/grid_execution/config.py]
        tiers: [unit, api, e2e]
        pruefung:
          - Manuell über ZON-21.
        erwartet: Unit- und API-Tests sowie Worker-/Backtest-Parität und Formular-Speicherung prüfen die Grenze.
      - id: ENG-31
        titel: Spread-Schutz je Setup
        beschreibung: "Optionaler Spread-Schutz je Setup: fester Ask-Bid-Preisabstand, Vielfaches des normalen Spreads oder Anteil am effektiven Grid-Abstand (nur Grid). Lernen pro Konto und Symbol: höchstens ein Messwert je Minute, 24 Stunden, mindestens 60 Werte, Median; Lernstart abwarten oder manuellen Startwert verwenden. Hohe Spreads frieren die Referenz ein. Über der Grenze, bei fehlender Lernreferenz oder ungültigem/veraltetem Tick löscht der Bot nur die Pending Orders des Setups und sperrt alle Einstiege. TP/SL und Ausstiege offener Positionen laufen weiter. Unter 80 Prozent der Grenze für 30 Sekunden erfolgt die Erholung; manuelle Pause bleibt. Lernwerte und Schutzsperre bleiben nach Neustart erhalten, der Erholungstimer startet neu. UI zeigt Spread, Grenze, Lernfortschritt und Grund in tr/en/de. Browser-Backtest nutzt dieselben Regeln ohne Zukunftsdaten. Alte Setups starten ohne Schutz."
        code: [worker_python/src/core/spread_guard.py, frontend_nextjs/src/components/zone/ZoneSpreadFields.tsx, frontend_nextjs/src/lib/backtest/engine/spreadGuard.ts]
        tiers: [unit, api, e2e, manuell]
        pruefung:
          - Im DEMO-Test nach gesonderter Freigabe Grenze unter den aktuellen Spread setzen; nur Pending Orders dieses Setups verschwinden.
          - Brokerzeit mit bestätigtem Versatz prüfen; 60 Sekunden alte Ticks bleiben erlaubt, ältere und zukünftige bleiben gesperrt.
          - Einzelne unveränderte Ticks dürfen keinen Versatz bestätigen; Kontowechsel und Neustart verwerfen die Zeitmessung.
        erwartet: Alle Einstiegswege sind gesperrt, offene Positionen und manuelle Orders bleiben. Nach Erholung laufen nur vorher aktive Setups weiter.
      - id: ENG-32
        titel: Markt geschlossen (10018) sperrt die Zone nicht
        beschreibung: "Lehnt MT5 eine Pending Order mit Retcode 10018 „Market closed“ ab (order_check oder order_send), zählt das nicht als fehlgeschlagene Order (ENG-11). Der Bot sendet für dieses Symbol 60 Sekunden (MARKET_CLOSED_CHECK_INTERVAL) keine Orders und versucht es danach erneut. Die Zone wird nicht pausiert."
        code: [worker_python/src/core/grid_orders.py, worker_python/src/utils/trade_utils.py, worker_python/src/core/state.py]
        tiers: [unit, manuell]
        pruefung:
          - Im DEMO-Lauf über einen Sessionstart (z. B. Montag 00:00 Brokerzeit) prüfen, dass kein „Bölge güvenliğe alınıyor“ erscheint und die Orders nach Marktöffnung stehen.
        erwartet: Nach 10018 keine Zonensperre; Orders erscheinen nach Marktöffnung.
  # ---------------------------------------------------------------------------
  - id: MET
    titel: Live-Daten & Diagramm
    features:
      - id: MET-01
        titel: Kennzahlenleiste
        beschreibung: Drei einzeilige Kacheln (Icon, Label mit Hinweis, Wert rechts) für Floating P/L, Offene Positionen, Pending Orders mit animierten Ziffern; der Motorstatus steht neben dem Label der P/L-Kachel, statische Erklärungen im Hinweis.
        code: [frontend_nextjs/src/components/dashboard/MetricsStrip.tsx]
        tiers: [e2e, live]
        pruefung:
          - Bot laufen lassen, Werte mit MT5 vergleichen.
        erwartet: Werte stimmen mit MT5 überein und aktualisieren sich.

      - id: MET-02
        titel: Live-Werte am Chart (Preis, RSI, P/L, Positionen)
        beschreibung: Die Analyse-Seite zeigt im Setup-Modus Preis, RSI, P/L und Positionen aus den WebSocket-METRICS über dem Chart.
        code: [frontend_nextjs/src/components/chart/LiveStats.tsx, frontend_nextjs/src/components/chart/ZoneChartPanel.tsx]
        tiers: [e2e]
        pruefung:
          - /chart im Setup-Modus öffnen, während der Bot läuft.
        erwartet: Die Werte erscheinen und aktualisieren sich aus dem Stream.

      - id: MET-03
        titel: WebSocket-Metriken des Workers
        beschreibung: ws_server sendet jeder Verbindung jede Sekunde Preis, RSI, MACD, P/L, Positionen für ihr Konto (?account_id=, ohne Parameter das erste Konto) und dessen Zone 0; jede METRICS-Nachricht trägt account_id (siehe ACC-10). RSI/MACD gibt es nur, wenn das MT5-Terminal des API-Prozesses an diesem Konto angemeldet ist; sonst Preis/P/L aus der Metrikdatei des Bots.
        code: [worker_python/src/api/ws_server.py, worker_python/src/core/indicator_calc.py]
        tiers: [unit, live]
        pruefung:
          - DevTools → WS-Nachrichten ansehen.
        erwartet: Jede Sekunde eine METRICS-Nachricht mit Preis und RSI.

      - id: MET-04
        titel: Bot-Telemetrie
        beschreibung: calculate_live_metrics exportiert P/L, Positions-/Orderzahl, Preis, Alarme (algo_trading_error, order_rejected_alarm, last_error, remote_paused, connection_lost), market_open, den Marktstatus je Zone-Symbol (zone_market_open) samt aus M5-Kerzen abgeleiteter Handelszeit (zone_market_hours) und die Zonen-Zustände der Engine (zone_states) nach met_<id>.json.
        code: [worker_python/src/core/grid_metrics.py, worker_python/src/core/bot_runner.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

