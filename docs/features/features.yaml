# Auto Grid – Funktionskatalog (einzige Quelle der Wahrheit)
#
# Aus dieser Datei wird docs/features/FEATURES.md erzeugt:
#   worker_python/.venv/bin/python scripts/features/update_checklist.py
# FEATURES.md NIE von Hand bearbeiten.
#
# Reihenfolge = Testreihenfolge (Abhängigkeiten zuerst). Kategorien und Features
# werden genau in dieser Reihenfolge getestet und in FEATURES.md angezeigt.
#
# Felder pro Feature:
#   id               eindeutig, Format KAT-NN (wird in Tests als Tag benutzt: @pytest.mark.feature("ENG-05") / tag: '@ENG-05')
#   titel            kurzer Name
#   beschreibung     was die Funktion tut
#   code             wichtigste Dateien (relativ zum Repo-Root)
#   tiers            welche Testebenen das Feature abdecken sollen:
#                      unit    – pytest + FakeMT5 (Mac/CI, ohne MT5)
#                      api     – pytest + FastAPI TestClient (Mac/CI)
#                      e2e     – Playwright gegen gemockten Worker (Mac/CI)
#                      live    – Playwright gegen den echten Worker auf dem VPS (DEMO-Konto)
#                      manuell – braucht eine manuelle Bestätigung (manual_results.yaml)
#   pruefung         Schritte für den manuellen Test
#   erwartet         erwartetes Ergebnis
#   bekannter_fehler (optional) bekannter Defekt; Tests dafür sind als xfail markiert

version: 1

kategorien:

