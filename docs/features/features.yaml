      - id: BKT-04
        titel: Backtest-Rechner mit Kosten (B1 + B4)
        beschreibung: "Web Worker (src/lib/backtest/backtest.worker.ts) lädt die Kerzen selbst über /rates (next_from, missing), baut höhere Zeitrahmen ohne Zukunftsdaten, spielt jede Kerze über ein Pfadmodell (O→L→H→C / O→H→L→C, optional „SL zuerst“, optional beide Wege) ab und rechnet Kosten: Spread je Kerze (steckt in den Füllpreisen, nur Info), Kommission je Lot (Vorschlag aus /history/deals), Swap an jedem Brokertag-Wechsel nach swap_mode und swap_rollover3days, Gewinn über trade_tick_value_profit/loss. Ausführung „Gap-Ausführung“ (Standard) oder „Parität“. Preise in Float64Array. Fortschritt, Abbruch, veraltete runId wird verworfen; über 1 Mio. Kerzen oder 100.000 Ereignisse je Kerze Abbruch mit Meldung. Der Worker liefert dazu in /symbols die Kostenfelder (trade_calc_mode, trade_tick_value_profit/loss, currency_profit, swap_mode, swap_long, swap_short, swap_rollover3days, spread, trade_stops_level); fehlt einer, blockiert der Lauf (kein Ersatzwert). Testende: realisierter Gewinn, offener G/V, End-Equity, offene Positionen; Hinweis „Margin/Stop-out nicht geprüft“ steht immer im Laufprotokoll. Rechenkern ohne Worker-API: runner.ts (Pfad, Auslösungen in Preis-Reihenfolge, Bot-Durchlauf nach jeder), Auftrag runJob.ts, Broker pathBroker.ts (auf simBroker.ts), Kosten broker/costs.ts, Kerzen candles/ (loadRates, bars, pathModel)."
        code: [worker_python/src/utils/mt5_helpers.py, worker_python/src/utils/mt5_market.py, frontend_nextjs/src/lib/backtest/commission.ts, frontend_nextjs/src/lib/backtest/runner.ts, frontend_nextjs/src/lib/backtest/runJob.ts, frontend_nextjs/src/lib/backtest/backtest.worker.ts, frontend_nextjs/src/lib/backtest/protocol.ts, frontend_nextjs/src/lib/backtest/broker/pathBroker.ts, frontend_nextjs/src/lib/backtest/broker/costs.ts, frontend_nextjs/src/lib/backtest/candles/loadRates.ts, frontend_nextjs/src/lib/backtest/candles/bars.ts, frontend_nextjs/src/lib/backtest/candles/pathModel.ts]
        tiers: [unit, api, e2e]
        pruefung:
          - pytest für die Kostenfelder der Symbolliste ausführen.
          - Playwright-Logiktest e2e/mocked/backtest-costs-lib.spec.ts (Kommissions-Vorschlag je Lot, handgerechnet) ausführen.
          - Playwright-Logiktests e2e/mocked/backtest-data-lib.spec.ts (Kerzen laden, höhere Zeitrahmen, Pfad, Gewinn, Kommission, Swap, Schnappschuss) und e2e/mocked/backtest-runner-lib.spec.ts (Kauf, Verkauf im Broker, Kurslücke, Swap mit Dreifach-Tag, offener Verlust am Testende, Zonengrenze im Wegstück, Auftrag im Worker) ausführen.
          - e2e/mocked/backtest-performance-worker.spec.ts mit einer aktiven BUY/SELL-Zone ausführen; Ladezeit, Simulationszeit, Trades, CPU-Profil und CDP-Speicherstichproben getrennt erfassen. Standard 10.000 Kerzen; BKT_PROFILE_CANDLES=1000000 misst die Obergrenze. Abbruch erfolgt während der Simulation.
        erwartet: Alle Kostenfelder sind da (auch im Mock-Worker). Die handgerechneten Fälle stimmen; kein Ereignis wird ohne Meldung übersprungen (mehr als 100.000 Ereignisse in einer Kerze brechen den Lauf ab).

      - id: BKT-05
        titel: CSV-Import von Kursdaten (B9)
        beschreibung: "Kerzen aus einer CSV-Datei als eigene Datenquelle laden, wenn MT5 nicht genug Historie liefert: GET/POST /market/{id}/imports, PUT …/chunk (Teile in Reihenfolge, je höchstens 4 MB, Datei höchstens 150 MB), POST …/commit, DELETE. Der Worker prüft am Commit alles (Format, Zeitraster des Zeitrahmens, strikt steigende Zeit, OHLC, Zeitbereich) und schreibt erst dann nach market.sqlite (source = csv:<import_id>, MT5-Kerzen bleiben unberührt); eine fehlerhafte Datei wird sofort verworfen. Überlappung mit einem vorhandenen Import desselben Kontos, Symbols und Zeitrahmens nur mit „ersetzen“. Fester Modus addiert einen UTC-Versatz von ±14 Stunden zur CSV-Zeit. Zeilenmodus erwartet UTC-Zeit und die Ganzzahlspalte broker_offset_sec (±14 Stunden) pro Zeile; der globale Versatz bleibt null. Eine doppelte Brokerzeit beim Herbstwechsel wird wegen der strikten Reihenfolge abgelehnt. Der Modus wird gespeichert und in der Liste angezeigt. Lesen über GET /market/{id}/rates?source=csv:<id> (nie MT5; Lücken als csv_gap). Unfertige Importe sind nicht wählbar und nach 24 Stunden geräumt. Die Erstellung bleibt abbrechbar; eine verspätete ID wird vor jedem Teilupload gelöscht. Parsing läuft außerhalb des SQLite-Schreiblocks; Kerzen werden in kurzen Batches vorbereitet und erst atomar sichtbar. Dialog und Liste (CsvImportPanel) stehen auf /backtest. Im Lauf ist ein Import als Datenquelle wählbar (B5b, BKT-06); Lücken stehen im Laufprotokoll als „Keine Kerze im CSV-Import“ (Grund csv_gap)."
        code: [worker_python/src/utils/csv_import.py, worker_python/src/api/market.py, worker_python/src/utils/market_db.py, worker_python/tests/api/test_csv_import_api.py, frontend_nextjs/src/components/backtest/CsvImportDialog.tsx, frontend_nextjs/src/components/backtest/CsvImportPanel.tsx, frontend_nextjs/src/services/csvImportApi.ts, frontend_nextjs/e2e/fixtures/data.ts, frontend_nextjs/e2e/fixtures/mock-worker.ts, frontend_nextjs/e2e/mocked/csv-import.spec.ts]
        tiers: [api, e2e]
        pruefung:
          - pytest tests/api/test_csv_import_api.py (Import in Teilen, Offset-Modi und DST, Migration, Prüfungen, Überlappung, Abbruch, fremdes Konto und paralleler Schreibzugriff) ausführen.
          - Auf /backtest (Konto, Setup wählen) eine CSV importieren; der Import steht mit Symbol, Zeitrahmen, Zeitraum und Kerzenzahl in der Liste.
          - Im Zeilenmodus den gesperrten globalen Versatz und die umgerechnete Brokerzeit nach Frühlings- und Herbstwechsel prüfen; danach die Seite neu laden.
          - Bei einem Worker ohne offset_mode-Bestätigung prüfen, dass der Staging-Import gelöscht wird, bevor ein Teil oder Commit gesendet wird.
          - Eine Datei mit falschem Zeitraster oder unsortierter Zeit importieren; die Zeilenfehler erscheinen und nichts steht in der Liste.
        erwartet: Ein abgebrochener oder fehlerhafter Import ist nicht wählbar; eine Überlappung geht nur mit „ersetzen“. Nur der gewählte Modus samt passendem Spaltenlayout wird übernommen. Der Zeilenmodus nutzt jeden broker_offset_sec-Wert, verlangt globalen Versatz null und zeigt seine Provenienz nach dem Neuladen. Ein alter Worker ohne Modusbestätigung erhält keine Dateiteile.

      - id: BKT-06
        titel: Seite /backtest mit einem Lauf (B5a)
        beschreibung: "Eigene Seite /backtest (Menü „Backtest“), Zustand in der URL (?account=&zone=&range=). Karte mit den Einstellungen eines Laufs: Zeitraum (Kalender wie auf /chart), Datenquelle (MT5-Server oder CSV-Import, B5b: nur abgeschlossene Importe mit dem Symbol des Setups und einem Zeitrahmen M1/M5/M15/H1; der Zeitrahmen des Imports ist dann die Datenauflösung; ein gelöschter Import fällt auf den MT5-Server zurück; der Lauf liest nur rates?source=csv:<id>, nie MT5), Datenauflösung M1/M5/M15/H1, Spread (Kerze/fest/Maximum), Kommission je Lot mit Vorschlag aus dem Deal-Archiv, Swap, Startkapital, Füllmodell, SL zuerst, Kerzenweg (auto/Tief zuerst/Hoch zuerst/beide), am Ende schließen, Näherungsrechnung. Gerechnet wird im Web Worker (lib/backtest/backtest.worker.ts, über useBacktestRun); Fortschritt und Abbrechen (terminate), Nachrichten mit alter runId werden verworfen. Ergebnis: Testende (realisiert, offener G/V, End-Equity, offene Positionen, Drawdown, Kommission, Swap, Spread-Kosten), StatsKpis, CurveChart (Equity, Drawdown), Laufprotokoll mit Texten in tr/en/de für jeden Code; bei „beide“ zwei Spalten. Der Test-Knopf eines Setups (ZoneHeader) übergibt eine Kopie mit ungespeicherten Änderungen (useBacktestHandoffStore, einmal gelesen); Neuladen, ein Link oder das Menü nimmt das gespeicherte Setup (die Seite lädt die Einstellungen neu); ein neues, ungespeichertes Setup aus der Übergabe erscheint mit seiner Nummer. Der Zeitraum „Alles“ sperrt den Start (kein Anfang). Ergebnis und Fehler gehören zu Konto und Setup ihres Laufs. Netting-/Exchange-Konten (Margin-Modus aus dem Deal-Archiv) sperren den Start mit Grund; ist der Modus unbekannt, steht eine Warnung da. Ein Kontowechsel bricht einen Lauf ab und leert das Ergebnis. Der Backtest speichert nie eine Zone (kein POST /settings, kein mergeAndSaveSettings in components/backtest/ und lib/backtest/). Der Backtest-Tab auf /chart entfällt; der CSV-Import (BKT-05) steht auf /backtest. Setup-Dialog mit Zonenfeldern und mehrere Setups: B7, BKT-08 (Codex)."
        code: [frontend_nextjs/src/app/backtest/page.tsx, frontend_nextjs/src/components/backtest/BacktestView.tsx, frontend_nextjs/src/components/backtest/RunSettings.tsx, frontend_nextjs/src/components/backtest/RunResultView.tsx, frontend_nextjs/src/hooks/useBacktestRun.ts, frontend_nextjs/src/hooks/useCsvImports.ts, frontend_nextjs/src/store/useBacktestStore.ts, frontend_nextjs/src/components/layout/AppNav.tsx]
        tiers: [e2e]
        pruefung:
          - Im Menü „Backtest“ öffnen (oder in einer Zone „Test“ drücken), Zeitraum „letzte 7 Tage“ wählen und „Test starten“.
          - Bei einem Netting-Konto die Seite öffnen.
          - Im Dashboard ein Feld ändern, nicht speichern und über das Menü „Backtest“ öffnen; danach den Zeitraum „Alles“ wählen.
          - Während des Laufs „Abbrechen“ drücken und das Konto wechseln.
          - Einen CSV-Import (BKT-05) des Setup-Symbols als Datenquelle wählen und testen; danach den Import löschen.
          - Fenster auf 375 px verkleinern.
        erwartet: Der Lauf zeigt Testende, KPIs, Kurven und Laufprotokoll; mit CSV-Quelle lädt er nur den Import (Zeitrahmen des Imports) und zeigt Lücken als „Keine Kerze im CSV-Import“, nach dem Löschen gilt wieder der MT5-Server; während des ganzen Ablaufs geht kein POST /settings an den Worker. Bei Netting ist der Start gesperrt und der Grund steht da. Über das Menü gilt das gespeicherte Setup ohne die ungespeicherte Änderung; bei „Alles“ ist der Start gesperrt. Abbrechen und Kontowechsel hinterlassen kein Ergebnis. Bei 375 px läuft nichts über.

      - id: BKT-07
        titel: Backtest-Chart mit Wiedergabe (B6)
        beschreibung: "Chart auf analysis/chart/ChartCore.tsx: Kerzen, Zonenband, Grid-Stufen, Trade-Pfeile, TP/SL-Marker, Equity-/Balance-Bereich und Trades-Tabelle mit exaktem MFE/MAE. Wiedergabe 1x/5x/10x/Max; Anzeige-Zeitrahmen. Der Rechen-Worker liefert höchstens 50.000 abgeschlossene Anzeige-Kerzen. Während der Wiedergabe bleiben Kerzen, Trades, Kurven, Marker und Tabelle auf den exklusiven Wiedergabe-Zeitpunkt begrenzt, auch beim Zeitrahmenwechsel und während des Nachladens. Wiedergabe beenden zeigt das vollständige Ergebnis wieder. MFE/MAE enthält den Gegenkurs beim Einstieg (Spread). Lücken sind grau."
        code: [frontend_nextjs/src/components/backtest/BacktestChart.tsx, frontend_nextjs/src/components/backtest/RunResultView.tsx, frontend_nextjs/src/components/analysis/chart/ChartCore.tsx, frontend_nextjs/src/components/analysis/TradesTable.tsx, frontend_nextjs/src/lib/backtest/candles/displayBars.ts, frontend_nextjs/src/lib/backtest/protocol.ts, frontend_nextjs/src/lib/backtest/backtest.worker.ts, frontend_nextjs/src/lib/backtest/runJob.ts, frontend_nextjs/src/lib/backtest/runner.ts, frontend_nextjs/src/lib/backtest/broker/pathBroker.ts, frontend_nextjs/src/hooks/useBacktestRun.ts, frontend_nextjs/src/store/useBacktestStore.ts, frontend_nextjs/src/i18n/messages/backtest.ts, frontend_nextjs/src/i18n/messages/hints.ts]
        tiers: [e2e]
        pruefung:
          - Automatisiert synthetische Jahresdaten M1 und einen echten Browser-Web-Worker gegen den Mock prüfen; keine VPS-Jahresprüfung.
          - Anzeige-Zeitrahmen während Replay wechseln; 1x/5x/10x/Max, Pause, Neustart und Wiedergabe beenden prüfen.
          - Exklusive Zeitgrenze für Trades, Marker, Kurven und Tabelle sowie veraltete Lauf-/Chart-Antworten prüfen.
        erwartet: Höchstens 50.000 abgeschlossene Anzeige-Kerzen; bei jeder Wiedergabe-Position zeigen Chart, Kurven, Marker und Trades-Tabelle keine Daten nach diesem Zeitpunkt. End-KPIs, Statistik, Protokoll und andere Kerzenwege sind während der Wiedergabe ausgeblendet. Fehlende Bereiche sind grau markiert und werden nie mit Kerzen gefüllt.

      - id: BKT-08
        titel: Mehrere Setups (B7, Codex)
        beschreibung: "Bis zu 6 Setups auf der Seite, je ein eigener Lauf (runId, Web Worker, Fortschritt), höchstens 2 gleichzeitig. Lokale Kopien aus gespeichertem Setup oder Standardwerten; Badges (Symbol, Auflösung, Modus, Abstand, TP, Spread, Lot, Zeitraum, Status) mit Bearbeiten, Duplizieren und Entfernen. In Zone übernehmen öffnet den B8-Dialog; die Übernahme bleibt ungespeichert. Bearbeiten nutzt ZoneFieldsEditor gemeinsam mit ZoneCard und leert das alte Ergebnis; laufende Setups sind gesperrt. Duplizieren kopiert keine Ergebnisse. Equity-Kurven überlagerbar; „Aggregiert“ nur bei gleichem Zeitraum und gleicher Kontowährung, sonst aus mit Grund. Ein Kontowechsel beendet alle Worker und leert alle Ergebnisse, die Setup-Parameter bleiben; Kommission und CSV-Auswahl werden zurückgesetzt. Bearbeiten und Entfernen geben den eigenen Worker frei. Implementiert durch Codex; automatisierte Abdeckung für lokale Kopien und Preset-/Transfer-Verhalten ergänzt. Abstand, TP und Lot stehen mit bis zu 8 Nachkommastellen auf der Karte (fünfstellige Forex-Werte wie 0,0004 bleiben sichtbar)."
        code: [frontend_nextjs/src/store/useBacktestStore.ts, frontend_nextjs/src/hooks/useBacktestRun.ts, frontend_nextjs/src/components/backtest/SetupCards.tsx, frontend_nextjs/src/components/backtest/SetupEditor.tsx, frontend_nextjs/src/components/zone/ZoneFieldsEditor.tsx]
        tiers: [e2e]
        pruefung:
          - Zwei Setups anlegen (eines dupliziert und geändert) und beide laufen lassen.
          - Das Konto wechseln.
        erwartet: Beide Läufe laufen parallel; ein spät fertiger Lauf überschreibt kein anderes Setup. Nach dem Kontowechsel sind keine alten Ergebnisse sichtbar.

      - id: BKT-10
        titel: Hinweise zu Daten und Modell (B5a)
        beschreibung: "Vor jedem Lauf zeigt /backtest einen nicht abschaltbaren Hinweis zu den Grenzen von Ereigniszeit, simulierter Uhr, Wochenend-Swap und Drawdown-Abtastung in tr/en/de. Über jedem Ergebnis steht ein Hinweisblock: Modellgrenzen (Margin/Stop-out nicht geprüft, Ablehnungen nicht simuliert, Stops Level nicht geprüft), „Kosten geschätzt“, Währung zum heutigen Kurs, Datenlücken (missing), verworfene laufende Kerze, Spread-Ersatz, Hinweis ab Datenauflösung M5 und „unsicher“, wenn der Grid-Abstand (nur Grid-Modus mit festem Abstand) kleiner ist als die mittlere Kerzenspanne (RunResult.avgRange). Die Hinweise aus dem Rechner sind dieselben Meldungen wie im Laufprotokoll. Noch nicht simuliert und noch nicht im Hinweisblock genannt: verschwundene Orders von außen, Auto-Pause, Teilfüllungen, Remote-Befehle, mehrere Zonen zugleich."
        code: [frontend_nextjs/src/components/backtest/BacktestView.tsx, frontend_nextjs/src/components/backtest/RunResultView.tsx, frontend_nextjs/src/lib/backtest/runner.ts]
        tiers: [e2e]
        pruefung:
          - Einen Lauf mit Datenlücke und Auflösung M5 starten.
          - Ein Setup mit Grid-Abstand unter der Kerzenspanne testen.
          - Vor dem Lauf den Modellhinweis in tr/en/de, 375px/1280px und beiden Themes prüfen.
        erwartet: Modell-, Kosten-, Lücken-, M5- und „unsicher“-Hinweis sind sichtbar und lassen sich nicht ausblenden.

      - id: BKT-11
        titel: Backtest-Presets je Benutzer (B8, Codex)
        beschreibung: "Presets (Name, Zone ohne id/magic/is_active, Kosten, Modell, Auflösung, letzter Zeitraum, Symbol, App-Version; keine Ergebnisse) im Worker: Tabelle backtest_presets in market.sqlite mit owner (Principal aus src/api/auth.py); GET/POST /api/backtest/presets, PUT/DELETE /api/backtest/presets/{pid}. Fremde Presets liefern 404. Menü „Presets“: speichern, laden als neues Setup, umbenennen, löschen, In Zone übernehmen. Höchstens 100 Presets je Benutzer; wiederholtes POST mit derselben requestId und gleichem Inhalt erzeugt kein Duplikat. Auch Admins sehen nur eigene Presets. CSV-Verweise und Ergebnisse werden nicht gespeichert; Feld-Whitelist und Payload-Version 1. Implementiert durch Codex; automatisierte Abdeckung für lokale Kopien und Preset-/Transfer-Verhalten ergänzt."
        code: [worker_python/src/utils/market_db.py, worker_python/src/api/backtest_presets.py, frontend_nextjs/src/components/backtest/PresetPanel.tsx]
        tiers: [api, e2e]
        pruefung:
          - pytest für die Preset-Routen mit zwei Benutzern ausführen.
          - Auf /backtest ein Setup als Preset speichern, Seite neu laden, Preset laden.
        erwartet: Das Preset ist nach dem Neuladen da; das Preset eines anderen Benutzers liefert 404.

      - id: BKT-12
        titel: Zone ↔ Backtest, Fehler und Kontowechsel (B5a/B8, Codex)
        beschreibung: "Zone → Backtest: Der Test-Knopf in ZoneHeader.tsx legt eine Kopie der Zone (auch ungespeichert, mit Vermerk) in useBacktestHandoffStore und öffnet /backtest?account=&zone=; die Seite liest die Übergabe einmal beim Öffnen, ohne Übergabe (Neuladen, Link) gelten die gespeicherten Werte. Fehler des Laufs (Netz, HTTP, Daten, Rechner) erscheinen mit Text in tr/en/de statt als Absturz; ein Code ohne Text zeigt sich mit seinen Werten (ein Test prüft, dass jeder Code des Rechners einen Text hat). Ein Kontowechsel leert das Ergebnis. Backtest → Zone: Dialog für zugängliches Zielkonto und neues inaktives oder bestehendes Setup desselben Symbols. Lots werden an die Ziel-Symbolgrenzen angepasst und Änderungen angezeigt. useZoneTransferStore übergibt einmalig via sessionStorage, gebunden an Benutzer und Worker-Adresse, gültig fünf Minuten. Das Dashboard lädt zuerst seinen gespeicherten Vergleichsstand, dann wird der Entwurf geändert. Ersatz behält id, magic und Aktivstatus; neue Zonen erhalten neue IDs. Kein automatisches Speichern; Banner für ungespeicherte Änderungen und Warnung bei laufendem Bot."
        code: [frontend_nextjs/src/components/zone/ZoneHeader.tsx, frontend_nextjs/src/store/useBacktestHandoffStore.ts, frontend_nextjs/src/components/backtest/runText.ts]
        tiers: [e2e]
        pruefung:
          - In einer Zone einen Wert ändern (nicht speichern) und den Test-Knopf drücken.
          - Auf /backtest den Zeitraum so wählen, dass der Worker einen Fehler liefert (z. B. Worker stoppen) und starten.
        erwartet: Die Seite nennt den ungespeicherten Wert mit Vermerk und rechnet damit; ohne Klick auf „Speichern“ geht kein POST /settings an den Worker. Ein Fehler erscheint als Text mit Grund.

      - id: BKT-13
        titel: Setup-Vergleich (B7, Codex)
        beschreibung: "Vergleichstabelle mit den KPIs (computeStats aus src/lib/analysis/stats.ts) aller Setups nebeneinander, Testende (offener G/V, End-Equity) je Setup und Aufteilung je Setup, Wochentag und Stunde über BreakdownTable. Beide Kerzenwege stehen in getrennten Spalten; die Zeit-Aufteilung verwendet einen gewählten Lauf. Datenquelle und Zeitraum stammen aus dem Lauf-Snapshot. Auswählbares Equity-Overlay in gleicher bekannter Kontowährung; Summe nur für mindestens zwei verschiedene Setups mit gleichem Zeitraum und gleicher bekannter Währung, maximal ein Kerzenweg je Setup. Die Summe addiert unabhängige Startkapitalien und verwendet zwischen Equity-Stützstellen den letzten bekannten Wert; keine gemeinsame Margin- oder Portfolio-Simulation. Implementiert durch Codex; TypeScript, ESLint und automatisierte Vergleichsprüfung."
        code: [frontend_nextjs/src/components/backtest/SetupComparison.tsx, frontend_nextjs/src/components/backtest/EquityOverlay.tsx, frontend_nextjs/src/lib/backtest/comparison.ts, frontend_nextjs/src/lib/analysis/stats.ts, frontend_nextjs/src/components/analysis/stats/BreakdownTable.tsx]
        tiers: [e2e]
        pruefung:
          - Drei Setups laufen lassen und die Vergleichstabelle öffnen.
        erwartet: Jede Spalte stimmt mit den KPIs des einzeln gewählten Setups überein.

      - id: BKT-14
        titel: Backtest-Live-Vergleich speichern
        beschreibung: "Bereich „Live-Vergleich“ auf /backtest: Fertige Setup-Läufe (gespeicherte Zone mit Magic, MT5-Kerzen) werden übernommen (auch in zwei Durchgängen für mehr als sechs Zonen), die Live-Deals des Zeitraums kommen aus dem Deal-Archiv (GET /api/history/{id}/deals) und werden über Magic, Seite und Einstiegsreihenfolge (Fenster 1 h) mit den Backtest-Trades gepaart. Tabelle je Symbol: Trades, Netto, Abweichung, Drawdown, offene Positionen, Prüfungen (gleiche Anzahl, Einstieg in derselben M1-Kerze, Preis ±0,5 Spread, Gewinn ±5 %; die Toleranz ist einstellbar und wird im Bericht gespeichert), Paare mit Abweichungsgrund, Trades ohne Paar. Speichern im Worker: Tabelle backtest_reports in market.sqlite, GET/POST /api/backtest/reports, GET/DELETE /api/backtest/reports/{id}; strenge Pydantic-Modelle (extra=forbid, keine NaN/Inf), höchstens 4 MB je Bericht und 50 Berichte je Benutzer; der Bericht speichert die genutzte Kommission je Symbol und die Lücken im Deal-Archiv (Warnung beim Öffnen), wiederholtes POST mit derselben requestId erzeugt kein Duplikat. Ein Benutzer speichert nur für eigene Konten (sonst 404) und sieht nur eigene Berichte (fremde: 404), der Admin sieht und löscht alle; eine negative Kommission (Rabatt) ist gültig; fehlt dem Symbol der Spread, warnt der Vergleich. Gespeicherte Berichte lassen sich öffnen (nur lesen) und löschen. Der Bereich steht auch nach mehreren hinzugefügten Setups genau einmal auf der Seite."
        code: [worker_python/src/api/backtest_reports.py, worker_python/src/utils/market_db.py, frontend_nextjs/src/lib/backtest/liveCompare.ts, frontend_nextjs/src/services/backtestReportApi.ts, frontend_nextjs/src/components/backtest/LiveCompareSection.tsx, frontend_nextjs/src/components/backtest/ReportTable.tsx]
        tiers: [api, e2e]
        pruefung:
          - pytest für die Berichts-Routen mit zwei Benutzern und dem Admin ausführen.
          - Auf /backtest ein Setup rechnen, „Live-Vergleich“ öffnen, „Läufe übernehmen“, einen Namen eingeben und speichern; Seite neu laden und den Bericht öffnen.
        erwartet: Der Bericht ist nach dem Neuladen da und zeigt dieselben Zahlen und die gespeicherte Toleranz; der Bericht eines anderen Benutzers liefert 404, der Admin sieht ihn.

      - id: BKT-15
        titel: Backtest-Zeitraum sekundengenau
        beschreibung: "Im Zeitraum-Panel (Eigener Zeitraum) gibt es zwei optionale Felder „Startzeit“ und „Endzeit“ (HH:MM:SS, Brokerzeit). Leer oder Ende 00:00:00 heißt ganzer Tag, wie bisher. rangeBounds addiert die Zeiten zu den Tagesgrenzen; die Grenzen [Start, Ende) in MT5-Sekunden gehen unverändert an den Lauf. Die Adresse trägt sie als ft= und tt=, gespeicherte Voreinstellungen behalten sie. Ungültige Uhrzeit oder Ende vor Start sperrt „Übernehmen“."
        code: [frontend_nextjs/src/lib/serverTime.ts, frontend_nextjs/src/components/analysis/DateRangePicker.tsx, frontend_nextjs/src/hooks/useAnalysisParams.ts, frontend_nextjs/src/lib/backtest/presets.ts]
        tiers: [e2e]
        pruefung:
          - Auf /backtest „Eigener Zeitraum“ öffnen, Tage und Uhrzeiten eintragen und übernehmen; Seite neu laden.
        erwartet: Die Adresse trägt ft= und tt=, nach dem Neuladen stehen dieselben Zeiten im Panel; der Lauf nimmt genau diese Grenzen.

  # ---------------------------------------------------------------------------
  - id: FRM
    titel: Formationserkennung
    features:
      - id: FRM-01
        titel: Grundgerüst und Indikatoren
        beschreibung: "Reine TypeScript-Bibliothek src/lib/formation/ (ohne React, ohne Netzwerk) als Grundlage der Formationserkennung: Typen für Bedingung, Zeichnung und Kandidat (types.ts), alle Zahlen mit ihrer Bedingungs-ID an einer Stelle (params.ts: RSI 7 mit 80/20, Wave 5/35, volumenstarke Kerze 1,5 × Mittel der letzten 20 Spannen, Zeiteinheiten D1/H4/H1/M15), Indikatoren RSI, Wave (SMA-Differenz des Medianpreises), ATR und volumenstarke Kerze (indicators.ts) und ein Kontext mehrerer Zeiteinheiten (context.ts), der Indikatoren je Zeiteinheit einmal rechnet und zu einem Zeitpunkt t nur geschlossene Kerzen freigibt (kein Blick in die Zukunft). fixture.ts prüft Kerzen-Fixtures; scripts/formation-fixture.mjs holt Kerzen über /rates und schreibt sie nach e2e/fixtures/formation/."
        code: [frontend_nextjs/src/lib/formation/types.ts, frontend_nextjs/src/lib/formation/params.ts, frontend_nextjs/src/lib/formation/indicators.ts, frontend_nextjs/src/lib/formation/context.ts, frontend_nextjs/src/lib/formation/fixture.ts, frontend_nextjs/scripts/formation-fixture.mjs]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-base-lib.spec.ts ausführen (von Hand gerechnete Fälle für RSI, Wave, ATR, volumenstarke Kerze, Kontext und Fixture-Prüfung).
        erwartet: Alle Fälle stimmen mit der Handrechnung überein; eine Kerze zählt erst, wenn ihre Zeiteinheit vorbei ist; Indikatoren auf dem Teilstück sind gleich den Werten des Kontexts.
      - id: FRM-02
        titel: Fraktal-Zone
        beschreibung: "Erkennung der Fraktal-Zone (FRZ) als reine Funktionen über geschlossene Kerzen: Fraktal mit je 2 geschlossenen Nachbarn (Schluss entscheidet), Zonenbreite (Dochtende bis Körperkante, dünne Zone, Zone ohne Docht, Manipulationsdocht in H4), Verletzung durch Schluss, Suchweg nach links, Anzahl je Seite, Zusammenlegen, Tests, Stärke (stark, sehr stark), Rollenwechsel mit volumenstarkem Bruch, Rücktest und Frische (frz.ts, frzChecks.ts, Zahlen in params.ts). analyzeFrz wählt die Zonen aller geladenen Zeiteinheiten, checkFrzCandidate prüft eine beliebige Kerze und liefert je Bedingungs-ID ☑, ☐ oder nicht messbar sowie die Zeichnungen Z-FRZ-01 bis Z-FRZ-06 (auch bei ☐). Bei Ereignis-Bedingungen heißt ☑ „liegt vor“. FRZ-18 ist ohne Wirtschaftskalender nicht messbar; FRZ-12 und FRZ-28 sind Anzeige ohne Prüfung."
        code: [frontend_nextjs/src/lib/formation/frz.ts, frontend_nextjs/src/lib/formation/frzChecks.ts, frontend_nextjs/src/lib/formation/params.ts, frontend_nextjs/src/lib/formation/types.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-frz-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Zeichnungen, Spiegelfall, Ablauf ohne Blick in die Zukunft und eine echte Kerzenreihe).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; die Zonen eines Widerstands und seines Spiegelbilds (Unterstützung) haben dieselben Zustände; bei der echten Reihe besteht jede gewählte Zone FRZ-01 bis FRZ-04 und FRZ-07.
      - id: FRM-03
        titel: Trend
        beschreibung: "Erkennung des Trends (TRD) als reine Funktionen über geschlossene Kerzen: Wendepunkte aus fertigen Fraktalen (nur das äußerste Extrem je Seite), Trendzug nach der Referenzzeichnung mit vier wählbaren Regeln (Standard reine Mindestgröße: ein Schenkel gilt ab 2,5 × ATR(14) nach Wilder; dazu ein Punkt je EWO-Welle, EWO-Gerüst, Mindestgröße mit EWO-Filter), ohne Blick in die Zukunft, Impuls und Korrektur, Trend je Zeiteinheit mit Wechsel durch einen Schluss (einstellbar) jenseits des Punkts, an dem der laufende Impuls begann, gesunder Trend, ähnliche und kürzer werdende Korrekturen, Trend der höheren und tieferen Zeiteinheit, Mit-/Gegentrend mit Zahl der Gründe, Unterstützungs- bzw. Widerstandslinie mit Spike-Ersatz, Berührungen und Schluss jenseits, Phase, Abgleich mit der Wave und Seitwärtsphase (trd.ts, trdZug.ts, trdChecks.ts, Zahlen in params.ts). Die Grundlage der Formationen ist einstellbar (TRD_PARAMS.formationZug, FormationContext-Option zug, trdFormation.ts): Standard `fein` ist der bisherige Zug mit 75-%-Filter und zwei Schlüssen, `trend` nimmt Punkte und Richtung aus dem Trendzug; Zeichnung und TRD-Prüfung nutzen immer Trendzug. analyzeTrd führt den Trendzug jeder geladenen Zeiteinheit, checkTrdCandidate prüft ein beliebiges Fraktal als Wendepunkt; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar sowie die Zeichnungen Z-TRD-01 bis Z-TRD-08 (auch bei ☐). Bei Ereignis-Bedingungen heißt ☑ „liegt vor“. TRD-25 und TRD-29 sind nicht messbar; TRD-14 und TRD-26 sind Anzeige ohne Prüfung."
        code: [frontend_nextjs/src/lib/formation/trd.ts, frontend_nextjs/src/lib/formation/trdZug.ts, frontend_nextjs/src/lib/formation/trdFormation.ts, frontend_nextjs/src/lib/formation/trdChecks.ts, frontend_nextjs/src/lib/formation/params.ts, frontend_nextjs/src/lib/formation/types.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-trd-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall, Ablauf ohne Blick in die Zukunft, Zeichnungen, echte Kerzenreihen, Vergleich mit 66 Punkten aus Referenzcharts und die Einstellung formationZug).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; ein Aufwärtstrend und sein Spiegelbild haben dieselben Zustände; bei den echten Reihen wechseln die Wendepunkte Hoch und Tief ab, und die Reihe mit steigenden Tiefs ergibt einen Aufwärtstrend mit Linie; der Zug trifft 58 von 66 Punkten aus Referenzcharts (gleiche Kerze ±1); im Standard rechnen die Formationen wie bisher, mit `trend` auf dem Trendzug.
      - id: FRM-04
        titel: Fibonacci und Signale
        beschreibung: "Erkennung von Fibonacci (FIB) und Signalen (SIG) als reine Funktionen über geschlossene Kerzen. FIB: Impulse des Trends mit Nachrücken des Endes bei Korrektur unter 0.382, vorläufige und fertige Messung, Levelpreise, Korrekturtiefe, Korrekturzone, Schale, Ende der Messung durch zwei Schlüsse jenseits des Starts, Ausdehnung über das Ende (−0.272 bis −0.618), Konfluenz mit Fraktal- und Engulf-Zonen, zwei Zeiteinheiten, Gegentrend-Voraussetzungen (fib.ts, fibChecks.ts). SIG: RSI-Extrem, Divergenz im Wave zwischen den Rekord-Extrempunkten, Engulf mit Engulf-Zone, Testere, volumenstarke und volumenarme Kerzen, Kerzen zusammenfassen und die Gründe G1 bis G11 mit Mindestzahl (sig.ts, reasons.ts, sigChecks.ts). Die Zahlen stehen in params.ts (FIB_PARAMS, SIG_PARAMS); die Level 0.382 und 0.272 für den gesunden Trend (TRD-21) kommen jetzt aus FIB_PARAMS. analyzeFib und analyzeSig prüfen jede geladene Zeiteinheit, checkFibCandidate prüft eine Messung mit eigenen Ankern, checkSigDivergence zwei beliebige Punkte; alle liefern je Bedingungs-ID ☑, ☐ oder nicht messbar sowie die Zeichnungen Z-FIB-01 bis Z-FIB-08 und Z-SIG-01 bis Z-SIG-05 (auch bei ☐). Bei Ereignis-Bedingungen heißt ☑ „liegt vor“. SIG-08, SIG-29 und SIG-39 sind nicht messbar; FIB-31 und SIG-42 sind Anzeige ohne Prüfung."
        code: [frontend_nextjs/src/lib/formation/fib.ts, frontend_nextjs/src/lib/formation/fibChecks.ts, frontend_nextjs/src/lib/formation/sig.ts, frontend_nextjs/src/lib/formation/sigChecks.ts, frontend_nextjs/src/lib/formation/reasons.ts, frontend_nextjs/src/lib/formation/params.ts, frontend_nextjs/src/lib/formation/indicators.ts, frontend_nextjs/src/lib/formation/context.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktests e2e/mocked/formation-fib-lib.spec.ts und formation-sig-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; ein Aufwärtsimpuls und sein Spiegelbild haben dieselben Zustände; bei den echten Reihen stimmen Levelpreise, RSI-Extrem, Divergenz und Gründe mit den erwarteten Zuständen überein.
      - id: FRM-05
        titel: AB=CD
        beschreibung: "Erkennung von AB=CD (ABCD) als reine Funktion über geschlossene Kerzen. A, B und C kommen aus den Wendepunkten des Trendzugs (jüngstes C, dessen Korrekturtiefe 0.382 bis 0.728 von AB beträgt), D ist der äußerste Docht seit C (abcd.ts). Geprüft werden Form (Dochtspitzen, fertige Fraktale, Schluss jenseits von B, Korrekturtiefe, Mindest-Extension −0.272, Level 1 mit Toleranz 5 %), Ort (Fraktal- und Engulf-Zonen, Konfluenz, doppeltes AB=CD, höhere Zeiteinheit, erster Test, Trend der höheren Zeiteinheit), Signale am D (RSI(7) im Extrem und kurz davor, Wave-Divergenz, Umkehrkerze) und Ausschlüsse (Gegentrend ohne Divergenz, Schluss jenseits der Zone, volumenstarkes D-Bein, Zeiteinheit M1/M5). Die Art von ABCD-19 und ABCD-20 wird mit berechnet (Pflicht gegen den Trend bzw. ohne RSI-Extrem). Die Zahlen stehen in params.ts (ABCD_PARAMS). analyzeAbcd prüft jede geladene Zeiteinheit, checkAbcdCandidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-ABCD-01 bis Z-ABCD-06 (auch bei ☐). Bei Ereignis-Bedingungen heißt ☑ „liegt vor“. ABCD-24 (Abgrenzung zum Doppeltop) nutzt seit FRM-06 die Messung von CDT-05, CDT-06, CDT-12 und CDT-15; ABCD-16 (harmonisches D) ist bis zum Schritt GAR/BAT nicht messbar."
        code: [frontend_nextjs/src/lib/formation/abcd.ts, frontend_nextjs/src/lib/formation/abcdChecks.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-abcd-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall, bedingte Art, Urteil, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; eine Verkaufs-Formation und ihr Spiegelbild haben dieselben Zustände; bei den echten Reihen stimmen Punkte, Korrekturtiefe, RSI-Extrem, Divergenz und Urteil mit den gemessenen Zuständen überein, auch die Negativfälle.
      - id: FRM-06
        titel: Doppeltop / Doppelboden
        beschreibung: "Erkennung von Doppeltop und Doppelboden (CDT) als reine Funktion über geschlossene Kerzen. H1 und N kommen aus den Wendepunkten des Trendzugs (das Paar mit den wenigsten verletzten Form-Bedingungen, bei Gleichstand das jüngste), H2 ist der äußerste Docht seit N (cdt.ts). Geprüft werden Form (H1 und N als fertige Fraktale, H1 schließt über dem vorigen Hoch, Korrekturtiefe 0.382, Berührung der Zone von H1 ohne Toleranz, Trend beim Anlauf), Ort (Trend der höheren Zeiteinheit, schwächerer Anlauf, Divergenz, Fibonacci-Level nahe der Zone, Zeiteinheit H1/H4/D1), Signale (RSI(7) an H1 im Extrem, ersatzweise Umkehrkerze, RSI an H2) und der Ausschluss durch einen Schluss jenseits von H1 mit der Ausnahme für kleine, nicht volumenstarke Schlüsse. Die Art von CDT-13 hängt von CDT-12 ab. Die Zahlen stehen in params.ts (CDT_PARAMS). analyzeCdt prüft jede geladene Zeiteinheit, checkCdtCandidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-CDT-01 bis Z-CDT-06. Bei Ereignis-Bedingungen heißt ☑ „liegt vor“. Ohne RSI-Extrem und ohne Umkehrkerze bleibt die Formation im Aufbau. Dazu macht die Messung ABCD-24 messbar."
        code: [frontend_nextjs/src/lib/formation/cdt.ts, frontend_nextjs/src/lib/formation/cdtChecks.ts, frontend_nextjs/src/lib/formation/abcdChecks.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-cdt-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall, bedingte Art, Urteil, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen) und die ABCD-24-Fälle in formation-abcd-lib.spec.ts.
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; ein Doppeltop und sein Spiegelbild haben dieselben Zustände; bei den echten Reihen stimmen Punkte, Korrekturtiefe, RSI-Extrem, Berührung und Urteil mit den gemessenen Zuständen überein, auch die Negativfälle.
      - id: FRM-07
        titel: Gartley und Bat
        beschreibung: "Erkennung von Gartley (GAR) und Bat (BAT) als reine Funktionen über geschlossene Kerzen, mit einem gemeinsamen XABCD-Kern (xabcd.ts). X, A, B, C sind vier aufeinanderfolgende Wendepunkte des Trendzugs (jüngstes C zuerst, das Kandidaten-Paar mit den wenigsten verletzten Form-Bedingungen gilt), D ist der äußerste Docht seit C. Das AB=CD im Inneren kommt aus abcd.ts (Korrekturtiefe von C und Level 1). Gartley: B an 0.618 der Fib X → A, C an 0.618 der Fib A → B, D an −0.272 der Fib A → B, dazu AB=CD nahe am Gartley-D, Ausschlüsse (B an 0.786, C an 0.886 oder in der Zone von A, H4-Schluss jenseits von X, höhere Zeiteinheit gegen den Trade, Zeiteinheit M15). Bat: B an 0.5, C mindestens an 0.382, D an 0.886 der Fib X → A, dazu BAT-02 als Ersatz für BAT-01 (volumenstarke Kerzen), Ausschlüsse (B an 0.618, C in der Zone von A, M15, H4-Schluss jenseits von X). Pflicht-Level gelten bis 1 Pip davor als berührt, die Verbots-Level ohne Toleranz. Die Zahlen stehen in params.ts (HARMONIC_PARAMS, GAR_PARAMS, BAT_PARAMS). analyzeGar und analyzeBat prüfen jede geladene Zeiteinheit, checkGarCandidate und checkBatCandidate eigene Punkte; alle liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-GAR-01 bis Z-GAR-06 bzw. Z-BAT-01 bis Z-BAT-06 (auch bei ☐). Bei Ereignis-Bedingungen heißt ☑ „liegt vor“. Die Art von BAT-02 hängt von BAT-01 ab. GAR-19 braucht Wochenkerzen und ist deshalb ohne ☑ (☐ oder nicht messbar)."
        code: [frontend_nextjs/src/lib/formation/xabcd.ts, frontend_nextjs/src/lib/formation/garChecks.ts, frontend_nextjs/src/lib/formation/batChecks.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-gar-bat-lib.spec.ts ausführen (je Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall Kauf/Verkauf, Abgrenzung Gartley ↔ Bat, bedingte Art von BAT-02, Urteil, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; eine Kauf-Formation und ihr Spiegelbild haben dieselben Zustände; bei den echten Reihen stimmen Punkte, Berührung der Level, Urteil und der Wechsel von gültig zu ungültig nach einem H4-Schluss jenseits von X, auch bei den Negativfällen.
      - id: FRM-08
        titel: "2618"
        beschreibung: "Erkennung der Formation 2618 (Rücklauf an 0.618 nach Doppeltop/-boden) als reine Funktion über geschlossene Kerzen. Das Doppeltop-Paar H1/N kommt aus cdt.ts (jüngstes Paar mit den wenigsten verletzten Bedingungen), H2 ist das erste fertige Fraktal nach N, das die Zone von H1 erreicht, I das jüngste Impulsende (fertiges Fraktal, laufendes Extrem seit H2), der Fib-Beginn H2 oder das Hoch, an dem der trendwendende Impuls beginnt (f2618.ts). Geprüft werden Form (Doppeltop nach CDT-01 bis CDT-06, Schluss jenseits von N, Fraktal an I, Fib Beginn → I mit I jenseits von N, Berührung von 0.618 ohne Toleranz), Trend der Formations-Zeiteinheit in Trade-Richtung, Verstärkungen (0.618 nahe einem Level 0.382/0.5/0.618 einer größeren Bewegung, Zeiteinheit H4) und Ausschlüsse (Schluss jenseits der Stop-Zone vor der Berührung, volumenstarke Kerze gegen die Richtung an der Berührung). Das Signal am Einstieg hat keine Zeile (ohne RSI, Wave, Umkehrkerze). Die Zahlen stehen in params.ts (F2618_PARAMS). analyze2618 prüft jede geladene Zeiteinheit, check2618Candidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-2618-01 bis Z-2618-05 (auch bei ☐). Bei Ereignis-Bedingungen heißt ☑ „liegt vor“. Ohne Berührung bleibt die Formation im Aufbau."
        code: [frontend_nextjs/src/lib/formation/f2618.ts, frontend_nextjs/src/lib/formation/f2618Checks.ts, frontend_nextjs/src/lib/formation/cdtChecks.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-2618-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall Verkauf/Kauf, Urteil, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; ein Doppeltop mit Verkauf und sein Spiegelbild haben dieselben Zustände; bei den echten Reihen stimmen Punkte, Berührung von 0.618, Urteil und der Befund ohne die späteren Kerzen, auch bei den Negativfällen.
      - id: FRM-09
        titel: "Libra"
        beschreibung: "Erkennung der Formation Libra (Wendebewegung nach zwei Impulsen in alter Trendrichtung, Rücklauf in die Zone oder an Level 0.786) als reine Funktion über geschlossene Kerzen. P1 und P2 sind fertige Fraktale (P2 jenseits P1) mit einem Korrektur-Fraktal C dazwischen, P3 ist das Ende der Wendebewegung (lib.ts); je Seite gilt das Paar mit den wenigsten verletzten Bedingungen. Geprüft werden Form (Schluss jenseits von C und gedrehter Trend, volumenstarke Wendebewegung, Fraktal an P3, Berührung der zuerst erreichten Kante von Zone oder Level 0.786), Verstärkungen (Zeiteinheit H4/D1, 0.786 am D eines inneren AB=CD, Dreierkette mit Gartley/Bat und Divergenz, CRV bis TP1 von mindestens 2 als Anzeige), die H4-Richtung für M15 und die Ausschlüsse (Schluss jenseits der Docht-Spitze von P2, Berührung später als 30 Kerzen, mehr als 2 Schwungpunkte vor der Berührung, Zeiteinheit unter H1). Die Zahlen stehen in params.ts (LIB_PARAMS). analyzeLib prüft jede geladene Zeiteinheit, checkLibCandidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar (LIB-09 misst, ob der Einstieg mit dem Einstieg einer gültigen oder im Aufbau stehenden Cypher derselben Richtung zusammenfällt, Abstand höchstens 0,5 × ATR(14); ohne solche Cypher ist es nicht messbar), das Urteil und die Zeichnungen Z-LIB-01 bis Z-LIB-07. Bei Ereignis-Bedingungen heißt ☑ „liegt vor“. Ohne Berührung bleibt die Formation im Aufbau."
        code: [frontend_nextjs/src/lib/formation/lib.ts, frontend_nextjs/src/lib/formation/libChecks.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-lib-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall Verkauf/Kauf, Abgrenzung Doppeltop/-boden, Urteil, Wechsel gültig → ungültig, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; eine Libra nach Hochs und ihr Spiegelbild nach Tiefs haben dieselben Zustände; bei den echten Reihen stimmen Punkte P2 und P3, Urteil und der Befund ohne die späteren Kerzen, auch bei den Negativfällen.

      - id: FRM-10
        titel: "Kopf-Schulter"
        beschreibung: "Erkennung der Formation Kopf-Schulter (OBO nach Hochs, TOBO nach Tiefs) als reine Funktion über geschlossene Kerzen. LS, K und RS sind fertige Fraktale einer Seite, N1 und N2 die tiefsten fertigen Fraktale der Gegenseite dazwischen; die Nackenlinie läuft durch N1 und N2 (obo.ts). Geprüft werden Form (Vortrend, Fraktale, Kopf über LS, RS unter K, kein Trendwechsel vor dem Nackenbruch), Verstärkungen (Schultern ähnlich groß oder konsolidiert, Wave-Divergenz zwischen LS und K, Zeiteinheit H4/D1, Kopfhöhen-Ziel am D eines AB=CD ab RS), das Signal (Körperschluss unter der Nackenlinie mit volumenstarker Kerze) und die Ausschlüsse (Schluss über dem Hoch von RS, Zeiteinheit unter H1). Die Zahlen stehen in params.ts (OBO_PARAMS). analyzeObo prüft jede geladene Zeiteinheit, checkOboCandidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-OBO-01 bis Z-OBO-08. Bei den Ausschlüssen heißt ☑ „liegt vor“. Ohne fertige rechte Schulter oder ohne Nackenbruch bleibt die Formation im Aufbau."
        code: [frontend_nextjs/src/lib/formation/obo.ts, frontend_nextjs/src/lib/formation/oboChecks.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-obo-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall Verkauf/Kauf, Abgrenzung Doppeltop/-boden und Libra, Urteil, Wechsel gültig → ungültig, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; eine Kopf-Schulter nach Hochs und ihr Spiegelbild nach Tiefs haben dieselben Zustände; bei den echten Reihen stimmen Punkte K, RS und Bruchkerze, Urteil und der Befund ohne die späteren Kerzen, auch bei den Negativfällen.

      - id: FRM-11
        titel: "Trendfortsetzung"
        beschreibung: "Erkennung der Trendfortsetzungsformationen als reine Funktion über geschlossene Kerzen, in beiden Richtungen: Flagge, steigendes (fallendes) Dreieck, Schale mit Henkel und Konsolidierung (Box). H1 ist ein fertiges Fraktal in Trendrichtung, der Mast reicht vom äußersten Fraktal der Gegenseite davor bis H1; die Pause danach wird aktiv mit dem Körperschluss jenseits ihrer Kante (tdf.ts, tdfForms.ts). Geprüft werden der Vortrend, die Pause aus kleinen Kerzen, die volumenstarke Bruchkerze, die Ausschlüsse (Trendwechsel in der Pause, Pause tiefer als 0.618 gehört zur Harmonik, Zeiteinheit unter H1, Schluss gegen den Trend) und je Unterform ihre Form (zwei Wellen mit fallender Linie und Kopie, zweiter Anlauf an die Zone von H1 mit steigenden Tiefs, Wende zwischen 0.236 und 0.382 mit Henkel, je zwei Berührungen oben und unten, abwechselnd gezählt). TDF-19 und TDF-26 sind Einstiegsregeln und bleiben nicht messbar. Die Zahlen stehen in params.ts (TDF_PARAMS). analyzeTdf prüft jede geladene Zeiteinheit und gibt den besten Kandidaten je Unterform aus, checkTdfCandidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-TDF-01a bis Z-TDF-10. Bei den Ausschlüssen heißt ☑ „liegt vor“. Ohne Bruch bleibt die Formation im Aufbau."
        code: [frontend_nextjs/src/lib/formation/tdf.ts, frontend_nextjs/src/lib/formation/tdfForms.ts, frontend_nextjs/src/lib/formation/tdfChecks.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-tdf-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall Kauf/Verkauf, Abgrenzung der Unterformen untereinander und zu Harmonik, Doppeltop und Kopf-Schulter, Urteil, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; eine Trendfortsetzung nach Hochs und ihr Spiegelbild nach Tiefs haben dieselben Zustände; bei den echten Reihen stimmen Punkte, Urteil und der Befund ohne die späteren Kerzen, auch beim Negativfall.

      - id: FRM-12
        titel: "Cypher"
        beschreibung: "Erkennung der Harmonik-Formation Cypher (CYP) in beiden Richtungen als reine Funktion über geschlossene Kerzen, auf dem XABCD-Kern (xabcd.ts, cyp.ts). X, A, B und C sind fertige Fraktale aufeinanderfolgender Wendepunkte, C liegt jenseits von A, D ist der äußerste Docht seit C. Geprüft werden die Struktur (Impuls X → A, neuer Impuls B → C), der Trend der nächsthöheren Zeiteinheit, B an mindestens 0.382 der Fib X → A, C an mindestens 1.272, Divergenz im Wave und RSI(7) im Extrem am C, die Vollendung an 0.786 der Fib X → C, der RSI(7) am D, eine Zone am D, ein Libra-Einstieg am D (Abstand höchstens 0,5 × ATR(14)), der Ausschluss eines Schlusses von C jenseits 1.414 (Annahme), der Ausschluss eines Schlusses von B jenseits 0.618 der Fib X → A (CYP-15, Annahme, Docht erlaubt), die PRZ (Rückprojektion 1.272 der Strecke B → C am D), die Zeiteinheit H4 oder höher und der Ausschluss M15. Die Zahlen stehen in params.ts (CYP_PARAMS). analyzeCyp prüft jede geladene Zeiteinheit, checkCypCandidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-CYP-01 bis Z-CYP-06. Bei Ereignis-Bedingungen heißt ☑ „liegt vor“. Ohne Vollendung an 0.786 bleibt die Formation im Aufbau. Libra ruft analyzeCyp für LIB-09 auf."
        code: [frontend_nextjs/src/lib/formation/cyp.ts, frontend_nextjs/src/lib/formation/cypChecks.ts, frontend_nextjs/src/lib/formation/libChecks.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-cyp-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall Kauf/Verkauf, Abgrenzung zu Gartley, Bat und AB=CD, Urteil, Ablauf ohne Blick in die Zukunft, Zeichnungen, CYP-10 und LIB-09 und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; eine Kauf-Cypher und ihr Spiegelbild haben dieselben Zustände; bei den echten Reihen stimmen Punkte, Urteil und der Befund ohne die späteren Kerzen, auch bei den Negativfällen (keine Divergenz, RSI am C zu niedrig, B zu flach, C-Schluss jenseits 1.414, B-Schluss jenseits 0.618).

      - id: FRM-13
        titel: "Butterfly"
        beschreibung: "Erkennung der Harmonik-Formation Butterfly (BUT) in beiden Richtungen als reine Funktion über geschlossene Kerzen, auf dem XABCD-Kern (xabcd.ts, but.ts). X, A, B und C sind aufeinanderfolgende Wendepunkte (X und A als fertige Fraktale), D ist der äußerste Docht seit C und liegt bei der Butterfly jenseits von X. Der Formkern ist Pflicht oder Ausschluss: Impuls X → A, B an mindestens 0.786 der Fib X → A, aber nicht an 0.886, C an mindestens 0.382 der Fib A → B, aber nicht an 0.886, ein Schluss unter B vor D und D an 1.272 der Fib X → A jenseits von X. Die Filter sind Verstärkung: C an 0.618, die BC-Rückprojektion 2, die AB-Ausdehnung 1.618 und AB=CD am Ziel-D (Abstand höchstens 0,5 bzw. 1 × ATR(14)), eine Zone am Ziel-D, RSI(7) im Extrem und Wave-Divergenz am D, der Trend der nächsthöheren Zeiteinheit und eine Umkehrkerze in der nächsttieferen. Die Zahlen stehen in params.ts (BUT_PARAMS). analyzeBut prüft jede geladene Zeiteinheit, checkButCandidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-BUT-01 bis Z-BUT-06. Bei Ereignis-Bedingungen heißt ☑ „liegt vor“. Fehlen der Schluss unter B oder die Vollendung an 1.272, bleibt die Formation im Aufbau."
        code: [frontend_nextjs/src/lib/formation/but.ts, frontend_nextjs/src/lib/formation/butChecks.ts, frontend_nextjs/src/lib/formation/xabcd.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-but-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall Kauf/Verkauf, Abgrenzung zu Gartley, Bat, Cypher und Crab, Urteil, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; eine Kauf-Butterfly und ihr Spiegelbild haben dieselben Zustände; bei den echten Reihen stimmen Punkte, Urteil und der Befund ohne die späteren Kerzen, auch bei den Negativfällen (B jenseits von X, C zu flach) und beim Fall im Aufbau (D noch vor 1.272).

      - id: FRM-14
        titel: "Crab und Deep Crab"
        beschreibung: "Erkennung der Harmonik-Formation Crab (CRB) mit der Variante Deep Crab in beiden Richtungen als reine Funktion über geschlossene Kerzen, auf dem XABCD-Kern (xabcd.ts, crb.ts). D liegt bei 1.618 der Fib X → A jenseits von X. Gemeinsamer Kern (Pflicht oder Ausschluss): Impuls X → A, C an mindestens 0.382 der Fib A → B, aber nicht an 0.886, D an 1.618, ein Schluss unter B vor D. Die Varianten unterscheiden sich im B: Crab bei mindestens 0.382, aber nicht an 0.786, Deep Crab bei mindestens 0.886, aber nicht an X. Beide Variantenpaare werden immer gemessen; eine gültige Formation braucht eines davon. Die Filter sind Verstärkung: eine der BC-Rückprojektionen (Crab 2.618 oder 3.618, Deep Crab 2 oder 2.618) am Ziel-D, eine Zone am Ziel-D ohne die gebrochene X-Zone, RSI(7) im Extrem und Wave-Divergenz am D, die Zeiteinheit H4 und eine Umkehrkerze in der nächsttieferen. Die Zahlen stehen in params.ts (CRB_PARAMS). analyzeCrb prüft jede geladene Zeiteinheit, checkCrbCandidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-CRB-01 bis Z-CRB-05."
        code: [frontend_nextjs/src/lib/formation/crb.ts, frontend_nextjs/src/lib/formation/crbChecks.ts, frontend_nextjs/src/lib/formation/xabcd.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-crb-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall Kauf/Verkauf, Crab und Deep Crab als Varianten, Abgrenzung zu Gartley, Bat, Cypher und Butterfly, Urteil, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; eine Kauf-Crab und ihr Spiegelbild haben dieselben Zustände; Crab und Deep Crab sind beide gültig, B zwischen den Varianten oder jenseits von X macht die Formation ungültig; bei den echten Reihen stimmen Punkte, Urteil und der Befund ohne die späteren Kerzen, auch bei den Negativfällen und beim Fall im Aufbau.

      - id: FRM-15
        titel: "Trend-618"
        beschreibung: "Erkennung der Formation Trend-618 (T618) in beiden Richtungen als reine Funktion über geschlossene Kerzen, auf dem Trendzug (t618.ts, lineChannel.ts). P ist ein Wendepunkt des Trendzugs, die schräge Linie läuft durch die Tiefs (Verkauf) bzw. Hochs (Kauf) der beiden Wendepunkte davor, I ist das Impulsende seit P (running extreme, jüngstes zuerst). Der Formkern ist Pflicht: zwei Impulse in Folge, jeder kürzer als der vorige; die Linie zeigt mit dem Trend; mindestens 2 Berührungen (die 2 Anker zählen mit, kein Schluss jenseits der Linie vor P); ein Schluss jenseits der Linie nach P; Trendwechsel in Trade-Richtung nach zwei Schlüssen; I mit fertigem Fraktal nach dem Bruch; Docht an 0.618 der Fib P → I ohne Toleranz. Die Filter sind Verstärkung: Wave-Divergenz zwischen den letzten beiden Hochs bzw. Tiefs und eine Berührungskerze, die nicht volumenstark gegen die Trade-Richtung ist. Die Zahlen stehen in params.ts (T618_PARAMS). analyzeT618 prüft jede geladene Zeiteinheit, checkT618Candidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-T618-01 bis Z-T618-04. Ohne Bruch, Trendwechsel, fertiges Fraktal an I oder Berührung bleibt die Formation im Aufbau; eine verletzte Struktur (Kraftverlust, Linie, Berührungen) macht sie ungültig. Sie kann am selben Ort wie 2618 gelten."
        code: [frontend_nextjs/src/lib/formation/t618.ts, frontend_nextjs/src/lib/formation/t618Checks.ts, frontend_nextjs/src/lib/formation/lineChannel.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-t618-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall Kauf/Verkauf, Abgrenzung zu 2618, Urteil, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; ein Verkauf nach Aufwärtstrend und sein Spiegelbild nach Abwärtstrend haben dieselben Zustände; ohne Doppeltop ist 2618 nicht gültig, T618 schon; bei den echten Reihen stimmen Punkte, Urteil und der Befund ohne die späteren Kerzen, auch bei den Negativfällen (kein Kraftverlust, P jenseits der Linie) und beim Fall im Aufbau.

      - id: FRM-16
        titel: "Ending Channel"
        beschreibung: "Erkennung der Formation Ending Channel (ENC) in beiden Richtungen als reine Funktion über geschlossene Kerzen (enc.ts, encChecks.ts, lineChannel.ts). Fünf aufeinanderfolgende Wendepunkte des Trendzugs bilden den Kanal: Tief, Impulsende, Tief, zweites Extrem, zweites Tief (Verkauf nach Aufwärtstrend; Kauf gespiegelt). Die Trendlinie läuft durch die Startpunkte der letzten 2 Impulse, die Gegenlinie ist ihre parallele Kopie am äußersten Extrem. Der Formkern ist Pflicht: Trend in der Formations-Zeiteinheit und, wenn geladen, in der nächsttieferen in dieselbe Richtung (sonst nicht messbar); Kraftverlust; Trendlinie mit dem Trend; 2 Berührungen oben und 2 unten, abwechselnd ab dem Impulsende (die Kopie darf bis 0,5 × ATR(14) verfehlt werden); Schluss jenseits der Trendlinie. Die Filter sind Verstärkung: Trendwechsel in Trade-Richtung und regelmäßige Korrekturen. Die Zahlen stehen in params.ts (ENC_PARAMS, LINE_CHANNEL_PARAMS). analyzeEnc prüft jede geladene Zeiteinheit, checkEncCandidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-ENC-01 bis Z-ENC-03. Ohne Schluss jenseits der Linie bleibt die Formation im Aufbau."
        code: [frontend_nextjs/src/lib/formation/enc.ts, frontend_nextjs/src/lib/formation/encChecks.ts, frontend_nextjs/src/lib/formation/lineChannel.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-enc-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall Kauf/Verkauf, Abgrenzung zum Keil und zur Flagge in der tieferen Zeiteinheit, Urteil, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; ein Verkauf-Kanal und sein Spiegelbild haben dieselben Zustände; ein paralleler Kanal ist ENC (ENC-04 ☑, KEI-04 ☐), zulaufende Linien sind es nicht; ein Trend in der tieferen Zeiteinheit gegen den Kanal macht ENC-01 ☐; bei den echten Reihen stimmen Punkte, Urteil und der Befund ohne die späteren Kerzen, auch bei den Negativfällen und beim Fall im Aufbau.

      - id: FRM-17
        titel: "Wendekeil"
        beschreibung: "Erkennung der Formation Wendekeil (KEI) in beiden Richtungen als reine Funktion über geschlossene Kerzen (keiChecks.ts, enc.ts, lineChannel.ts): steigender Keil im Aufwärtstrend (Verkauf), fallender im Abwärtstrend (Kauf). Fünf aufeinanderfolgende Wendepunkte des Trendzugs bilden den Keil wie beim Ending Channel; die Gegenlinie läuft aber durch die beiden Extreme in Trendrichtung und beide Linien laufen zusammen. Der Formkern ist Pflicht: Trend in derselben Zeiteinheit und Richtung; Kraftverlust; beide Linien mit dem Trend; der senkrechte Abstand an der letzten Berührung ist kleiner als am Beginn der Zählung; 2 Berührungen oben und unten, abwechselnd; Schluss jenseits der Trendlinie. Die Filter sind Verstärkung: erneuter Test der Gegenlinie (mindestens 3 Berührungen oben), Trendwechsel in Trade-Richtung und eine volumenstarke Bruchkerze. Die Zahlen stehen in params.ts (KEI_PARAMS, LINE_CHANNEL_PARAMS). analyzeKei prüft jede geladene Zeiteinheit, checkKeiCandidate eigene Punkte; beide liefern je Bedingungs-ID ☑, ☐ oder nicht messbar, das Urteil und die Zeichnungen Z-KEI-01 bis Z-KEI-03. Ohne Schluss jenseits der Linie bleibt die Formation im Aufbau."
        code: [frontend_nextjs/src/lib/formation/keiChecks.ts, frontend_nextjs/src/lib/formation/enc.ts, frontend_nextjs/src/lib/formation/lineChannel.ts, frontend_nextjs/src/lib/formation/params.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/formation-kei-lib.spec.ts ausführen (je messbarer Bedingung ein Fall mit ☑ und einer mit ☐ auf von Hand gerechneten Kerzenreihen, dazu Abdeckungstest, Spiegelfall Kauf/Verkauf, Abgrenzung zum Kanal und zum Dreieck mit flacher Gegenlinie, Urteil, Ablauf ohne Blick in die Zukunft, Zeichnungen und echte Kerzenreihen).
        erwartet: Jeder Fall stimmt mit der Handrechnung überein; ein steigender Keil im Aufwärtstrend und sein Spiegelbild haben dieselben Zustände; auseinanderlaufende Linien oder eine flache Gegenlinie machen die Formation ungültig; bei den echten Reihen stimmen Punkte, Urteil und der Befund ohne die späteren Kerzen, auch bei den Negativfällen und beim Fall im Aufbau.

      - id: FRM-18
        titel: "Seite Formasyon: Zeiteinheit- und Formationsleiste"
        beschreibung: "Die Seite /formasyon (formasyon/page.tsx) wählt Konto und Setup wie /chart (Adresse ?account=&zone=&tf=&form=, selectAccount, ZoneSelect); das Symbol ist das des Setups. Oben stehen die Zeiteinheiten D1/H4/H1/M15 und die Formationen ABCD, Gartley, Bat, Butterfly, Crab, Cypher, Doppeltop als Schaltflächen mit Treffer-Badge: die Zahl der Treffer, die gültig oder im Aufbau sind (ungültige zählen nicht), bei der Zeiteinheit über alle Formationen, bei der Formation über alle Zeiteinheiten. Klick auf eine Formation springt zur Zeiteinheit ihres Treffers; hat die gewählte Zeiteinheit einen Treffer, bleibt sie (scan.ts, FormationToolbar.tsx). Ohne Treffer auf der gewählten Zeiteinheit steht „Keine Formation gefunden“ statt Chart und Checkliste."
        code: [frontend_nextjs/src/app/formasyon/page.tsx, frontend_nextjs/src/components/formation/FormationToolbar.tsx, frontend_nextjs/src/hooks/useFormationParams.ts, frontend_nextjs/src/lib/formation/scan.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-18) ausführen (Badge-Zahlen auf einer echten H4-Reihe, Sprung zur Zeiteinheit des Treffers, Leerzustand auf M15).
        erwartet: Die Badges zeigen die Treffer der Fixture (Gartley gültig, Bat im Aufbau); ein Klick auf Gartley bei gewählter M15 wechselt auf H4; auf M15 steht der Leerzustand ohne Checkliste.

      - id: FRM-19
        titel: "Seite Formasyon: Kandidaten-Liste und Checkliste"
        beschreibung: "Im einklappbaren Fenster innerhalb des Charts steht oben die Kandidaten-Liste (Name, Zeiteinheit, Urteil gültig/ungültig/im Aufbau) und darunter die Checkliste des gewählten Kandidaten: Kopf mit Titel und Urteil, Pflicht x/y (n nicht messbar), Verstärkungen x/y, Balken; die Gruppen Pflicht, Verstärkung und Ausschluss; je Zeile ein Symbol mit Beschriftung für erfüllt, nicht erfüllt, Ausschluss ausgelöst/nicht eingetreten und nicht messbar (nie nur Farbe), Marken für die Status secondary und assumption, gemessener Wert, Legende. Bei einer Formation im Aufbau nennt ein Hinweis den fehlenden Punkt, bei einer ungültigen die Bedingungen, die sie ungültig machen. Die Kurztexte je Bedingungs-ID stehen in ruleTexts.ts (tr/en/de)."
        code: [frontend_nextjs/src/components/formation/CandidateList.tsx, frontend_nextjs/src/components/formation/FormationChecklist.tsx, frontend_nextjs/src/lib/formation/ruleTexts.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-19) ausführen (Gartley gültig mit drei Gruppen und allen Zeilenzuständen, Bat im Aufbau mit Hinweis auf D).
        erwartet: Die Liste zeigt das Urteil der Bibliothek, die Zähler stehen als x/y, jede Zeile trägt ein beschriftetes Symbol, die Formation im Aufbau nennt D und der Chart führt D als offen.

      - id: FRM-20
        titel: "Seite Formasyon: Chart mit Zeichnungen"
        beschreibung: "Der Chart (lightweight-charts) zeigt die Kerzen der gewählten Zeiteinheit und RSI(7) in eigenem Pane mit den Linien 80 und 20. Die Zeichnungen der Erkennung (Zickzack mit Punktnamen, Verhältnis-Linien mit Beschriftung, Zielpunkt, Zone, Umkehrkerzen-Marke) liegen als SVG-Overlay über den Canvases in einem eigenen Stapelkontext; das Overlay endet vor der Preisachse und folgt Zoom, Verschieben und Größenänderung. Kauf ist grün, Verkauf rot (Farben aus den Theme-Tokens). Eine Formation im Aufbau zeigt die bestätigten Punkte fest, den Weg zum fehlenden Endpunkt gestrichelt, den Endpunkt als offenen Kreis mit Fragezeichen und die Zone als „mögliche Zone“. Hover auf eine Checklisten-Zeile hebt die Zeichnungen ihrer Bedingung hervor, der Rest wird blass; Hover auf eine Zeichnung hebt die zugehörigen Zeilen hervor (drawingLayout.ts, FormationChart.tsx). Der Chart lädt mit allen Kerzen wie nach „Ansicht zurücksetzen“; ein Klick auf eine Formation ändert die Ansicht nicht, ein eigener Zoom bleibt je Produkt gespeichert, bis er zurückgesetzt wird (runtime.ts)."
        code: [frontend_nextjs/src/components/formation/FormationChart.tsx, frontend_nextjs/src/components/analysis/chart/ChartCore.tsx, frontend_nextjs/src/components/chart-workspace/runtime.ts, frontend_nextjs/src/lib/formation/drawingLayout.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-20) ausführen (Zeichnungen vorhanden, Hover auf eine Zeile hebt hervor, Overlay-Breite endet vor der Preisachse, alle Kerzen beim Laden, Formationsklick lässt die Ansicht, Zoom bleibt nach Neuladen, Zurücksetzen).
        erwartet: Das Overlay trägt Zeichnungsgruppen; beim Hover auf die Zeile GAR-03 sind einige Gruppen hervorgehoben und die übrigen blass; ohne Hover ist keine Gruppe hervorgehoben. Der Chart zeigt alle Kerzen; ein Formationsklick im selben Zeitrahmen ändert den sichtbaren Zeitbereich nicht.

      - id: FRM-21
        titel: "Seite Formasyon: Hintergrundsuche"
        beschreibung: "Die Seite lädt D1, H4, H1 und M15 des gewählten Symbols über GET /market/{id}/rates (je Zeiteinheit mit dem 60-s-Nachladen des Endstücks) und sucht damit alle sieben Formationen auf allen vier Zeiteinheiten (useFormationScan.ts, scan.ts). Die Suche läuft nach dem Laden, bei Wechsel von Konto oder Symbol und sobald sich die letzte geschlossene M15-Kerze ändert; zwischen zwei M15-Kerzen ändert sich keine geschlossene Kerze. Sie rechnet nach dem nächsten Anstrich; die Rechenzeit steht als data-scan-ms am Seitenelement. Fehler der Kerzen oder der Rechnung erscheinen als Meldung."
        code: [frontend_nextjs/src/hooks/useFormationScan.ts, frontend_nextjs/src/lib/formation/scan.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-21) ausführen (vier Zeiteinheiten werden mit dem gewählten Symbol geladen, data-scan-ms ist gesetzt).
        erwartet: Der Mock-Worker sieht je Zeiteinheit D1, H4, H1 und M15 eine Kerzen-Anfrage für das gewählte Symbol.

      - id: FRM-22
        titel: "Seite Formasyon: schmale Ansicht, Sprachen und Hinweise"
        beschreibung: "Bei 375 px liegt das einklappbare Fenster mit Liste und Checkliste unten innerhalb des seitenfüllenden Charts rechts neben der 52 px breiten Werkzeugleiste. Es scrollt unabhängig; die Seite hat keinen waagerechten Rand-Überlauf. Alle Texte laufen über i18n (tr/en/de), jede Schaltfläche der Zeiteinheit- und Formationsleiste und jeder Kandidat trägt einen Hinweis-Tooltip (hints.ts)."
        code: [frontend_nextjs/src/app/formasyon/page.tsx, frontend_nextjs/src/i18n/messages/formation.ts, frontend_nextjs/src/i18n/messages/hints.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-22) ausführen; der Abdeckungstest UI-07 prüft die Tooltips.
        erwartet: Bei 375 px bleibt das Fenster innerhalb des Charts, lässt sich per Maus und Tastatur einklappen, und scrollWidth ist nicht größer als clientWidth.

      - id: FRM-23
        titel: "Seite Formasyon: seitenfüllender Chart mit Bedienelementen"
        beschreibung: "Chart und linke 52 px breite Werkzeugleiste füllen dauerhaft den sichtbaren Seitenbereich ohne Minimieren-Funktion. Unter 1024 px schwebt die kompakte Navigation im Chart; ab 1024 px stehen die vollständigen Seitenlinks in der normalen 56 px hohen Kopfzeile und der Chart füllt den Bereich darunter. Oben im Chart liegt ab 1024 px eine durchgehende, 38 px hohe Leiste im TradingView-Stil mit Produktsuche, Konto samt LIVE/DEMO, Zeiteinheiten und rechts den Chart-Werkzeugen; direkt darunter eine 30 px hohe Zeile mit den Formationen. Unter 1024 px stehen diese Zeilen untereinander, die Chart-Werkzeuge bleiben unten. Die Legende schwebt innerhalb der Chart-Fläche. Kandidaten und unveränderte Bedingungen stehen rechts in einem einklappbaren Fenster mit eigener Scrollfläche; unter 900 px steht es unten. Die Navigation bleibt mobil im Menü und am Desktop direkt erreichbar, Preisachse und Attribution bleiben frei."
        code: [frontend_nextjs/src/app/formasyon/page.tsx, frontend_nextjs/src/components/formation/FormationChart.tsx, frontend_nextjs/src/components/formation/FormationToolbar.tsx, frontend_nextjs/src/components/formation/FormationSelectors.tsx, frontend_nextjs/src/components/layout/AppNav.tsx]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-23) ausführen (Viewport-Abmessungen, Position der Bedienelemente, internes Scrollen, Navigation, helles und dunkles Design).
        erwartet: Der Chart füllt mobil den Viewport und ab 1024 px den Bereich unter der Kopfzeile; alle Bedienelemente liegen innerhalb der Fläche; Scrollen der Bedingungen verschiebt den Chart nicht; Navigation bleibt erreichbar.

      - id: FRM-24
        titel: "Seite Formasyon: Bedingungen verschieben"
        beschreibung: "Die Kopfzeile der Bedingungskarte ist ein Griff für Maus und Touch. Die Karte lässt sich frei innerhalb der sichtbaren Chart-Fläche verschieben; Navigation, linke Werkzeugleiste, Preisachse und Attribution bleiben erreichbar. Pfeiltasten verschieben um 10 Pixel, Umschalt mit Pfeil um 50 Pixel. Scrollen und Einklappen bleiben getrennt vom Ziehen. Aufklappen und Größenänderungen halten die Karte innerhalb der Grenzen. Die Position gilt bis zum Verlassen oder Neuladen der Seite."
        code: [frontend_nextjs/src/components/formation/FormationDetailsPanel.tsx, frontend_nextjs/src/app/formasyon/page.tsx]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-24) ausführen (Maus, Touch, Tastatur, Grenzen, Scrollen, Aufklappen am unteren Rand und Wechsel zur Mobilbreite).
        erwartet: Der Kopfgriff verschiebt die Karte; der Inhalt bleibt scrollbar und die gesamte Karte bleibt erreichbar.

      - id: FRM-25
        titel: "Seite Formasyon: freie Produktwahl"
        beschreibung: "Die Kopfleiste zeigt statt der Setup-Auswahl eine Produktsuche über alle Symbole des Kontos (GET /symbols/{id}), nach Name oder Beschreibung. Übernommen wird nur ein Eintrag der Liste; Text ohne Auswahl stellt das bisherige Produkt wieder her. Die Wahl steht als ?symbol= in der Adresse und startet die Suche FRM-21 neu. Ohne ?symbol= gilt das Setup aus ?zone=, sonst das erste Setup des Kontos; ein Konto ohne Setup zeigt einen Hinweis. Ein Kontowechsel löscht das Produkt, weil Symbolnamen je Broker abweichen. Liefert MT5 keine Symbole, erscheint der Fehler als Meldung."
        code: [frontend_nextjs/src/app/formasyon/page.tsx, frontend_nextjs/src/components/formation/FormationSelectors.tsx, frontend_nextjs/src/hooks/useFormationParams.ts]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-25) ausführen (Produkt per Name und Beschreibung wählen, zweiter Wechsel, Konto ohne Setup, Kontowechsel, Abbruch, Fehler der Symbolliste).
        erwartet: Jede Wahl lädt D1, H4, H1 und M15 des neuen Produkts und die Suche läuft ohne Setup bis zum Ende.

      - id: FRM-26
        titel: "Seite Formasyon: Formation als Bild festhalten"
        beschreibung: "In der Kopfleiste steht hinter den Zeiteinheiten ein Kamera-Knopf mit Menü: als PNG herunterladen oder in die Zwischenablage kopieren. Das Bild entsteht im Browser (nichts wird gesendet), ist 1200 CSS-Pixel breit bei doppelter Auflösung und zeigt Kopf (Formation, Symbol, Zeiteinheit, Urteil, Scan-Zeitpunkt), den Chart samt Formationszeichnungen und alle Bedingungen mit Symbol, Wort und Messwert. Kerzen und Achsen kommen aus takeScreenshot(), die Zeichnungen sind ein SVG-Overlay und werden mit aufgelösten Theme-Farben darübergelegt. Ab 640 px Chart-Breite stehen die Bedingungen unter dem Chart, schmaler rechts daneben. Hell oder dunkel folgt dem App-Thema. Kein Kontoname, keine Kontonummer, kein LIVE/DEMO im Bild oder im Dateinamen. Ohne gewählten Kandidaten oder während der Suche ist der Knopf deaktiviert; Kopieren ist deaktiviert, wenn der Browser keine Bilder in die Zwischenablage legen kann."
        code: [frontend_nextjs/src/components/formation/FormationShotMenu.tsx, frontend_nextjs/src/lib/formation/shotImage.ts, frontend_nextjs/src/lib/formation/shotData.ts, frontend_nextjs/src/components/formation/FormationToolbar.tsx, frontend_nextjs/src/components/formation/FormationChart.tsx, frontend_nextjs/src/app/formasyon/page.tsx]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-26) ausführen (PNG mit Zeichnungen und Dateiname, deaktivierter Knopf, Kopieren, 375 px).
        erwartet: Das PNG enthält die Zielzeichnung des Overlays, trägt Formation, Symbol, Zeiteinheit und Zeitpunkt im Dateinamen und nichts vom Konto; bei 375 px bleibt der Knopf sichtbar und die Seite scrollt nicht quer.

      - id: FRM-27
        titel: "Seite Formasyon: Alarm bei gültiger Formation und Zielpunkt"
        beschreibung: "Hinter dem Kamera-Knopf steht eine Glocke mit Menü. Der Schalter „Alarm für <Produkt>“ gilt je Konto und Produkt und meldet, wenn eine Formation des Produkts gültig wird oder ihren Zielpunkt (D, bei CDT H2) erreicht; Ereignisse und Formationen sind wählbar, Meldung im Fenster ist Standard, Systemmeldung und Ton sind optional. Es gibt keine Worker-Änderung und keine Order. Gemeldet wird nur der Übergang zwischen zwei Suchläufen. Der Lauf kommt seit FRM-30 aus dem app-weiten FormationScanRunner (M15-Takt) und gilt auf jeder Seite, solange die App offen ist (Banner im Menü). Ein Produkt ohne gemerkten Stand (gerade eingeschaltet) merkt still; der gemerkte Stand liegt im Browser (höchstens 200 Treffer je Produkt), so kommt nach dem Neuladen nichts doppelt. Mehr als drei Meldungen in einem Durchlauf werden zu einer Sammelmeldung."
        code: [frontend_nextjs/src/lib/formation/alarm.ts, frontend_nextjs/src/lib/formation/alarmStore.ts, frontend_nextjs/src/hooks/useFormationAlarm.ts, frontend_nextjs/src/components/formation/FormationAlarmMenu.tsx, frontend_nextjs/src/app/formasyon/page.tsx]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-alarm-lib.spec.ts (@FRM-27) ausführen (Übergänge, stille Grundlinie, Schlüssel, Symbol der Meldung, abgewählte Ereignisse, Speichergrenze).
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-27) ausführen (Banner, Meldung nach neuer M15-Kerze, keine Doppelmeldung nach Neuladen, Anzeigen-Knopf, Sammelmeldung, Alarm aus, 375 px).
        erwartet: Nach dem Einschalten erscheint zu einer Formation, die danach gültig wird oder ihren Zielpunkt erreicht, genau eine Meldung; derselbe Stand meldet nicht erneut, auch nicht nach dem Neuladen; ohne Alarm kommt nichts.

      - id: FRM-28
        titel: "Seite Formasyon: Produkte als Favoriten markieren"
        beschreibung: "Neben dem gewählten Produkt in der Pille und neben jedem Produktnamen in der Produktsuche steht eine kleine Fahne. Ein Klick setzt den Favoriten (gefüllt), ein zweiter entfernt ihn (nur Umrandung). Der Klick wählt das Produkt nicht und schließt die Liste nicht; Tab erreicht die Fahne, Enter wählt das Produkt; Tab aus der letzten Fahne heraus schließt die Liste und stellt das bisherige Produkt wieder her. Die Liste liegt je Konto auf dem VPS (GET/PUT /favorites/{id}, configs/favorites_<id>.json, atomar geschrieben, wird mit dem Konto gelöscht), damit jedes Gerät dieselbe Liste sieht. Ein Benutzer erreicht nur die Favoriten eigener Konten (sonst 404), ungültiger Inhalt gibt 422, und ein PUT auf eine unbekannte Konto-ID gibt auch für den Admin 404 (keine Datei). Das Umschalten wirkt sofort; bei einem Speicherfehler wird die Fahne zurückgesetzt und eine Meldung gezeigt. Die Seitenleiste und die Suche über Favoriten folgen mit FRM-29."
        code: [worker_python/src/api/favorites.py, worker_python/src/api/models.py, worker_python/src/utils/paths.py, worker_python/src/api/accounts.py, frontend_nextjs/src/components/ui/combobox.tsx, frontend_nextjs/src/hooks/useFavorites.ts, frontend_nextjs/src/store/useFavoritesStore.ts, frontend_nextjs/src/services/favoritesApi.ts, frontend_nextjs/src/components/formation/FormationSelectors.tsx]
        tiers: [api, e2e]
        pruefung:
          - pytest worker_python/tests/api/test_favorites_api.py (@FRM-28) ausführen (lesen, schreiben, fremdes Konto 404, ungültiger Inhalt 422, unbekanntes Konto beim Admin 404 ohne Datei, Datei weg beim Löschen des Kontos).
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-28) ausführen (Fahne in Pille und Liste, Tab und Enter, Tab aus der Fahne, Fehler, 375 px).
        erwartet: Die Fahne setzt und entfernt den Favoriten, die Liste bleibt nach dem Neuladen und auf jedem Gerät gleich, und kein Klick auf die Fahne wählt ein Produkt.

      - id: FRM-29
        titel: "Seite Formasyon: Favoriten-Seitenleiste und Suche über Favoriten"
        beschreibung: "Rechts ganz außen steht eine schmale Leiste mit dem Favoriten-Knopf; er öffnet und schließt die Seitenleiste, die den Chart ab 1280 px schiebt (darunter liegt sie unter der Kopfleiste über dem Chart, damit die Werkzeuge frei bleiben). Oben stehen Zeitraum (15m, 1h, 4h, D), darunter die Formationen, darunter die Tabelle (Symbol mit Beschreibung, Zuletzt, Änderung in Prozent und Betrag). Die Suche läuft app-weit im Layout (FormationScanRunner): Favorit für Favorit nacheinander, D1/H4/H1/M15, nur ein Tab sucht (Web Lock), die anderen erhalten die Ergebnisse per BroadcastChannel; sie läuft bei jeder neuen M15-Kerze neu, bricht beim Kontowechsel ab und ruht ohne Konto oder Favoriten. Gebildet heißt Urteil gültig; im Aufbau und ungültig zählen nicht. Die Formations-Zeile zeigt nur Formationen, die im Zeitraum in mindestens einem Favoriten gebildet sind, die Zahl ist die Zahl der Produkte; ein Zeitraum-Klick filtert ohne neue Anfragen, ein Klick auf eine Formation filtert die Tabelle, ein zweiter hebt auf. Ein Klick auf die Zeile öffnet Produkt, Formation und Zeitraum im Chart. Bei geschlossener Seitenleiste stehen beide Zeilen über dem Chart, nie doppelt; Kamera und Glocke bleiben in der Kopfleiste. Fehlen Kerzen oder scheitert der Abruf eines Produkts, wird nur dieses als unvollständig markiert. Preise liefert GET /market/{id}/quotes (nur lesend, data_query, letzter Preis, Vortagsschluss, Stellen; fremdes Konto 404, kein Terminal-Zugriff 503, nicht lesbares Produkt null) im 60-s-Takt, nur bei offener Seitenleiste. Ohne Favoriten bleibt die Leiste wie bisher. Scheitert das erste Laden der Konten, lädt die Seite im 10-s-Takt neu, bis die Kontoauswahl das Konto aus der Adresse zeigt."
        code: [frontend_nextjs/src/lib/formation/scan.ts, frontend_nextjs/src/lib/formation/requests.ts, frontend_nextjs/src/store/useFavoritesScanStore.ts, frontend_nextjs/src/components/formation/FormationScanRunner.tsx, frontend_nextjs/src/components/formation/FavoritesSidebar.tsx, frontend_nextjs/src/components/formation/FormationFavoritesBar.tsx, frontend_nextjs/src/components/formation/FormationToolbar.tsx, frontend_nextjs/src/hooks/useFavoriteQuotes.ts, frontend_nextjs/src/hooks/useFavorites.ts, frontend_nextjs/src/app/formasyon/page.tsx, worker_python/src/api/market.py, worker_python/src/utils/mt5_market.py]
        tiers: [api, e2e]
        pruefung:
          - pytest worker_python/tests/api/test_quotes_api.py (@FRM-29) ausführen (Preis, Vortagsschluss, Stellen, nicht lesbares Produkt null, fremdes Terminal 503, ungültige Liste 400, fremdes Konto 404).
          - Playwright-Test e2e/mocked/formation-favorites-lib.spec.ts (@FRM-29) ausführen (isFormed, Filter je Zeitraum, ein Produkt je Formation einmal).
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-29) ausführen (nur gebildete Formationen, Zeitraum-Klick ohne neue Anfragen, Formations-Filter, Klick auf die Zeile, Fehler je Produkt und Wiederholung, Preise und Konto-Hinweis, Neuladen der Favoriten und der Konten, Werkzeuge frei, nie doppelt, 375 px).
          - "Auf dem DEMO-Konto mit ca. 10 Favoriten die Dauer eines Durchlaufs (data-favorites-scan-ms und Netzdauer) messen, gezeigte Formationen mit dem Chart vergleichen, auf alte gültige Muster ohne Aktualität achten und prüfen, ob Kurse und Vortagsschluss stimmen."
        erwartet: Die Seitenleiste zeigt je Zeitraum nur gebildete Formationen der Favoriten mit der Zahl der Produkte, der Filter und der Zeilenklick öffnen das richtige Produkt im Chart, und der Fehler eines Produkts verfälscht die anderen nicht.

      - id: FRM-30
        titel: "Alarm für alle Favoriten und Alarm-Produkte auf jeder Seite"
        beschreibung: "Solange die App auf einer beliebigen Seite offen ist, meldet der app-weite FormationScanRunner neue Formationen (wird gültig, Zielpunkt erreicht; FRM-27) für alle Favoriten des gewählten Kontos, sobald „Alle Favoriten“ im Glocken-Menü an ist, und für jedes Produkt mit eingeschalteter Glocke. Die Meldung kommt als Karte in der App und, wenn die Systemmeldung an ist, über registration.showNotification (tag = Trefferschlüssel, data.url = Adresse); „Anzeigen“ und der Klick auf die Systemmeldung (notificationclick im Service Worker) öffnen Produkt, Formation und Zeiteinheit auf /formasyon. Es meldet nur der Tab mit dem Web Lock. Der erste vollständige Durchlauf nach dem Öffnen fasst Verpasstes zu einer Sammelmeldung „Seit dem letzten Öffnen: N Formationen“ zusammen; ein Produkt ohne gemerkten Stand merkt still. Ein Produkt mit fehlenden Kerzen oder Fehler wird nicht verglichen (sein Stand bleibt) und steht im Menü unter „Unvollständig“. Glocken-Produkte, die keine Favoriten sind, ändern die Zahlen der Favoriten nicht. Das Menü zeigt Stand (letzter Durchlauf, x/y Produkte), „Alle Favoriten“, weitere Alarm-Produkte und das Banner (läuft nur bei offener App). Ist nach dem Neuladen kein Konto gewählt, sucht der Alarm mit dem zuletzt gewählten Konto, das er im Browser gemerkt hat (Feld account im Alarm-Speicher); die Kontowahl der Seiten setzt er nie, das Dashboard bleibt ohne Konto. Ist kein Konto gemerkt oder steht das gemerkte nicht in der Kontoliste (gelöscht oder fremd), ruht die Suche und das Menü sagt den Grund; solange die Kontoliste lädt, steht „Konto wird geprüft“. Telegram ist nicht Teil dieser Funktion."
        code: [frontend_nextjs/src/components/formation/FormationScanRunner.tsx, frontend_nextjs/src/hooks/useAlarmAccount.ts, frontend_nextjs/src/lib/formation/alarmAccount.ts, frontend_nextjs/src/lib/formation/alarmNotify.ts, frontend_nextjs/src/lib/formation/alarmStore.ts, frontend_nextjs/src/lib/formation/alarm.ts, frontend_nextjs/src/hooks/useFormationAlarm.ts, frontend_nextjs/src/components/formation/FormationAlarmMenu.tsx, frontend_nextjs/src/store/useFavoritesScanStore.ts, frontend_nextjs/public/service-worker.js]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-30) ausführen (Meldung während /chart offen ist, Systemmeldung mit tag und url, Anzeigen führt zu Produkt, Formation und Zeiteinheit, Glocken-Produkt ohne Einfluss auf Favoriten-Zahlen, unvollständiges Produkt, zwei Tabs eine Suche, Sammelmeldung beim Öffnen, Menü bei 375 px, Schalter speichern sofort bei offener Browser-Abfrage, Neuladen ohne ?account= meldet mit dem gemerkten Konto, Kontowahl wird gemerkt, Dashboard wählt kein Konto vor, kein Konto und gelöschtes Konto ruhen mit Hinweis im Menü).
          - "Im echten Browser auf dem DEMO-Konto mit rund 10 Favoriten prüfen: Systemmeldung erscheint, Klick darauf öffnet Produkt und Formation, verstecktes Tab meldet weiter, Dauer eines Durchlaufs und ob die Rechnung die Seite spürbar blockiert; auf dem iPhone nur mit installierter App."
        erwartet: Eine neue Formation eines Favoriten oder Alarm-Produkts wird auf jeder Seite als Karte und Systemmeldung gemeldet, ein Klick öffnet sie auf /formasyon, Verpasstes kommt einmal als Sammelmeldung, nichts kommt doppelt, und ein unvollständiges Produkt meldet nichts. Nach dem Neuladen ohne gewähltes Konto sucht der Alarm mit dem gemerkten Konto weiter oder sagt im Menü, warum er ruht.

      - id: FRM-31
        titel: "Laufende Kerze auf dem Formasyon-Chart"
        beschreibung: "Der Chart auf /formasyon zeigt rechts zusätzlich die laufende Kerze in der normalen Kerzenfarbe. Der Preis ist der Schluss der laufenden M15-Kerze (Nachladen alle 60 s), darum zeigen alle Zeitintervalle denselben aktuellen Preis. Suche, Alarm, RSI und Zeichnungen enden weiter an der letzten geschlossenen Kerze (kein Blick in die Zukunft); die laufende Kerze wird nie vor oder auf der letzten geschlossenen Kerze geschrieben. Der Bild-Export zeigt sie mit."
        code: [frontend_nextjs/src/lib/analysis/candles.ts, frontend_nextjs/src/hooks/useFormationScan.ts, frontend_nextjs/src/components/formation/FormationChart.tsx, frontend_nextjs/src/app/formasyon/page.tsx]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-page-lib.spec.ts (@FRM-31) ausführen (runningBar mit Preis in der Kerze, über High, unter Low, ohne laufende Kerze oder Preis).
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-31) ausführen (Chart endet auf dem M15-Preis, Trefferzahlen unverändert).
          - "Im echten Browser auf dem DEMO-Konto prüfen (nur lesen): 15m und D zeigen denselben aktuellen Preis."
        erwartet: Alle Zeitintervalle zeigen denselben aktuellen Preis, die laufende Kerze steht rechts, und die Trefferliste ändert sich dadurch nicht.

      - id: FRM-32
        titel: "Meldungsverlauf des Formationsalarms im Glocken-Menü"
        beschreibung: "Das Glocken-Menü hat zwei Reiter: Einstellungen und Verlauf. Der Verlauf hält jeden Treffer fest, den der Alarm meldet (neueste zuerst): Zeit, Produkt, Formation, Zeiteinheit, Seite und Ereignis (gültig, Zielpunkt oder beides). Eine Sammelmeldung (mehr als drei Treffer in einem Durchlauf oder „Seit dem letzten Öffnen“) steht als einzelne Treffer unter einem Gruppenkopf. Ein Eintrag entsteht auch bei ausgeschalteter Systemmeldung und ohne Ton; er entsteht nur im Tab mit dem Web Lock, die anderen Tabs lesen ihn über das storage-Ereignis. Ein Klick auf einen Eintrag öffnet Produkt, Formation und Zeiteinheit auf /formasyon. Der Verlauf liegt je Konto im Browser (grid-robot-formation-alarm, Feld history, höchstens 100 Einträge, die ältesten fallen heraus); ältere Speicherstände ohne dieses Feld bleiben lesbar. „Verlauf löschen“ leert nur die Liste des Kontos, der gemerkte Stand (memory) bleibt, so kommt nichts doppelt. Die Glocke steht nur auf /formasyon; der Verlauf ist darum nur dort sichtbar. Keine Worker-Änderung, keine Order."
        code: [frontend_nextjs/src/lib/formation/alarmHistory.ts, frontend_nextjs/src/lib/formation/alarmStore.ts, frontend_nextjs/src/lib/formation/alarmNotify.ts, frontend_nextjs/src/components/formation/FormationScanRunner.tsx, frontend_nextjs/src/hooks/useFormationAlarm.ts, frontend_nextjs/src/components/formation/FormationAlarmMenu.tsx]
        tiers: [e2e]
        pruefung:
          - Playwright-Test e2e/mocked/formation-alarm-history-lib.spec.ts (@FRM-32) ausführen (ein Eintrag je Treffer, Obergrenze, alte Speicherstände, ungültige Einträge, Löschen lässt den Stand).
          - Playwright-Test e2e/mocked/formation-page.spec.ts (@FRM-32) ausführen (Eintrag ohne Systemmeldung und Ton, Sammelmeldung als einzelne Treffer, Löschen, zweiter Tab, Klick auf Eintrag, leerer Verlauf, 375 px).
          - "Im echten Browser prüfen: nach einer echten Meldung steht sie im Verlauf; zweiter Tab zeigt sie; Verlauf löschen und Neuladen meldet nichts doppelt."
        erwartet: Jede gemeldete Formation steht im Verlauf des Kontos mit Zeit, Produkt, Formation, Zeiteinheit, Seite und Ereignis; Sammelmeldungen zeigen jeden Treffer; Löschen meldet nichts erneut.
