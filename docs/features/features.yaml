  - id: MET
    titel: Live-Daten & Diagramm
    features:
      - id: MET-01
        titel: Kennzahlenleiste
        beschreibung: Vier Kacheln Preis, Floating P/L, Offene Positionen, Pending Orders mit animierten Ziffern.
        code: [frontend_nextjs/src/components/dashboard/MetricsStrip.tsx]
        tiers: [e2e, live]
        pruefung:
          - Bot laufen lassen, Werte mit MT5 vergleichen.
        erwartet: Werte stimmen mit MT5 überein und aktualisieren sich.

      - id: MET-02
        titel: Chart (10-s-Kerzen + RSI)
        beschreibung: lightweight-charts baut 10-s-Kerzen aus WebSocket-METRICS, RSI auf eigener Skala; Farben folgen dem Theme.
        code: [frontend_nextjs/src/components/ChartViewer.tsx]
        tiers: [e2e]
        pruefung:
          - /formasyon öffnen und 1 Minute warten.
        erwartet: Kerzen und RSI-Linie entstehen.

      - id: MET-03
        titel: WebSocket-Metriken des Workers
        beschreibung: ws_server sendet jeder Verbindung jede Sekunde Preis, RSI, MACD, P/L, Positionen für ihr Konto (?account_id=, ohne Parameter das erste Konto) und dessen Zone 0; jede METRICS-Nachricht trägt account_id (siehe ACC-10). RSI/MACD gibt es nur, wenn das MT5-Terminal des API-Prozesses an diesem Konto angemeldet ist; sonst Preis/P/L aus der Metrikdatei des Bots.
        code: [worker_python/src/api/ws_server.py, worker_python/src/core/indicator_calc.py]
        tiers: [unit, live]
        pruefung:
          - DevTools → WS-Nachrichten ansehen.
        erwartet: Jede Sekunde eine METRICS-Nachricht mit Preis und RSI.

      - id: MET-04
        titel: Bot-Telemetrie
        beschreibung: calculate_live_metrics exportiert P/L, Positions-/Orderzahl, Preis, Alarme (algo_trading_error, order_rejected_alarm, last_error, remote_paused, connection_lost), market_open, den Marktstatus je Zone-Symbol (zone_market_open) samt aus M5-Kerzen abgeleiteter Handelszeit (zone_market_hours) und die Zonen-Zustände der Engine (zone_states) nach met_<id>.json.
        code: [worker_python/src/core/grid_metrics.py, worker_python/src/core/bot_runner.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

  # ---------------------------------------------------------------------------
  - id: LOG
    titel: Logs
    features:
      - id: LOG-01
        titel: Log-Tabs laden
        beschreibung: Tabs Activity, Robot Logs, MT5 Terminal; GET /logs/{id}?log_type=all&lines=200; ohne laufenden Bot wird mt5_connected=false erzwungen.
        code: [frontend_nextjs/src/components/LogViewer.tsx, worker_python/src/api/logs.py]
        tiers: [api, e2e, live]
        pruefung:
          - Alle drei Tabs öffnen, „Refresh“.
        erwartet: Jeder Tab zeigt seine Logs.

      - id: LOG-02
        titel: Logs löschen
        beschreibung: Activity wird nur lokal geleert; Robot/MT5 nach Rückfrage per DELETE /logs/{id}.
        code: [frontend_nextjs/src/components/LogViewer.tsx, worker_python/src/api/logs.py]
        tiers: [api, e2e]
        pruefung:
          - Im Tab Robot Logs „Clear“ → bestätigen.
        erwartet: Log ist leer, auch nach Refresh.

      - id: LOG-03
        titel: Logs als ZIP herunterladen
        beschreibung: GET /logs/download/{id} liefert ein ZIP mit Logs, State- und Settings-Datei.
        code: [frontend_nextjs/src/lib/downloadLogs.ts, worker_python/src/api/logs.py]
        tiers: [api, e2e]
        pruefung:
          - „Download log file“ klicken, ZIP öffnen.
        erwartet: ZIP enthält Logs, state_<id>.json und settings-Datei.

      - id: LOG-04
        titel: Worker-Status + Polling
        beschreibung: Anzeige Worker online/offline; Abfrage alle 10 s (beim Verbinden alle 2 s).
        code: [frontend_nextjs/src/components/LogViewer.tsx, frontend_nextjs/src/store/useLogsStore.ts]
        tiers: [e2e]
        pruefung:
          - Worker auf dem VPS stoppen.
        erwartet: Status wechselt nach ≤ 10 s auf offline.

      - id: LOG-05
        titel: Robot-Log schreiben
        beschreibung: Der Bot-Prozess schreibt seine Meldungen (log_message) nach logs/<id>/err_<id>.log.
        code: [worker_python/src/core/grid_helpers.py, worker_python/src/utils/bot_manager.py]
        tiers: [unit, manuell]
        pruefung:
          - Tab „Robot Logs“ öffnen und die letzten Zeilen ansehen.
        erwartet: Jede Meldung genau einmal, keine abgeschnittenen Zeilen.

      - id: LOG-06
        titel: MT5-Terminal-Log anzeigen
        beschreibung: Der Tab „MT5 Terminal“ zeigt das Tages-Log des MT5-Terminals, das beim Verbinden nach logs/<id>/mt5_terminal/ kopiert wird.
        code: [worker_python/src/api/logs.py, worker_python/src/utils/mt5_helpers.py]
        tiers: [api, manuell]
        pruefung:
          - Tab „MT5 Terminal“ öffnen.
        erwartet: Zeilen aus MT5_Terminal_<Datum>.log erscheinen.

      - id: LOG-07
        titel: Symbol-Logs
        beschreibung: Jede Robot-Log-Zeile, die zu einer Zone (Setup) gehört, trägt das Tag [Z:<zone_id>]. GET /logs/{id}?zone_id=… filtert darauf; zone_id ist wiederholbar (?zone_id=a&zone_id=b) und liefert die Zeilen aller genannten Setups in Dateireihenfolge, `lines` gilt für die gemeinsame Liste. Eine einzelne zone_id (ältere Oberfläche) wirkt wie bisher. Jede Symbolkarte zeigt unter ihren Setups „Sembol logları“ aufklappbar mit den Zeilen aller Setups des Symbols; bei mehr als einem Setup beginnt jede Zeile mit „Setup n“ (Platz in der Symbolkarte). Im Robot-Log-Tab steht vor jeder Zeile mit Tag das Badge „<Symbol> · Setup n“.
        code: [worker_python/src/core/grid_helpers.py, worker_python/src/api/logs.py, frontend_nextjs/src/components/zone/SymbolLogs.tsx, frontend_nextjs/src/components/LogViewer.tsx]
        tiers: [unit, api, e2e, manuell]
        pruefung:
          - Bot mit einem Symbol mit zwei Setups und einem zweiten Symbol laufen lassen, in der Symbolkarte „Sembol logları“ aufklappen.
        erwartet: Zeilen beider Setups des Symbols erscheinen (ohne Tag, mit „Setup 1“/„Setup 2“), keine Zeilen des anderen Symbols; im Robot-Log-Tab steht „<Symbol> · Setup n“ vor der Zeile.

  # ---------------------------------------------------------------------------
  - id: UPD
    titel: System & Updates
    features:
      - id: UPD-01
        titel: Update-Prüfung
        beschreibung: „System Info“ → „Check for Updates“; GET /system/update/check vergleicht Git-Hash und VERSION mit origin/main.
        code: [worker_python/src/api/system.py, worker_python/src/utils/self_updater.py, frontend_nextjs/src/components/dashboard/UpdateModal.tsx]
        tiers: [api, e2e]
        pruefung:
          - „Check for Updates“ klicken.
        erwartet: „You are up to date“ oder alte → neue Version.

      - id: UPD-02
        titel: Update anwenden
        beschreibung: „Apply Update (git pull)“ → POST /system/update (stash nur bei lokalen Änderungen, pull, stash pop), danach Seiten-Reload. Scheitert der Pull (z. B. Datei gesperrt oder ohne Schreibrecht), wird der Stand davor wiederhergestellt – keine halb aktualisierten Dateien, der Stash wird zurückgespielt.
        code: [worker_python/src/api/system.py, worker_python/src/utils/self_updater.py]
        tiers: [unit, e2e, manuell]
        pruefung:
          - Nach einem Merge auf main das Update im Dashboard anwenden (Zahnrad → Check for Updates → Apply Update).
        erwartet: VERSION auf dem VPS entspricht main; nach einem Fehler zeigt git status keine geänderten Dateien und git stash list keinen neuen Eintrag.

      - id: UPD-03
        titel: System herunterfahren
        beschreibung: Power-Button → Bestätigung → /stop, danach window.close().
        code: [frontend_nextjs/src/app/hooks/useDashboard.ts, frontend_nextjs/src/components/ConfirmModal.tsx]
        tiers: [e2e]
        pruefung:
          - Power-Button → bestätigen.
        erwartet: Bot wird gestoppt, Fenster schließt (falls vom Browser erlaubt).

      - id: UPD-05
        titel: Server-Neustart nach Update
        beschreibung: Nach einem erfolgreichen POST /system/update beendet sich der Worker nach 1,5 s (schedule_restart); run_uvicorn_watchdog.bat (setzt WORKER_SUPERVISED=1) startet ihn mit dem neuen Code neu. Ohne Watchdog kein Neustart. Das Dashboard wartet 8 s und lädt dann neu; veraltete Bots startet der neue Worker selbst neu (BOT-03).
        code: [worker_python/src/utils/self_updater.py, worker_python/src/api/system.py, worker_python/run_uvicorn_watchdog.bat, frontend_nextjs/src/app/hooks/useDashboard.ts]
        tiers: [unit, api, manuell]
        pruefung:
          - Update im Dashboard anwenden (System Info → Check for Updates → Apply Update).
          - Im Fenster „Uvicorn API“ auf dem VPS den Neustart beobachten.
        erwartet: Worker startet nach wenigen Sekunden mit der neuen Version; das Dashboard lädt neu und ist wieder online.

      - id: UPD-06
        titel: Abhängigkeiten nach Update installieren
        beschreibung: Ändert ein Pull worker_python/requirements.txt, führt execute_git_pull danach pip install -r mit dem Python des Workers (.venv) aus. Schlägt pip fehl, meldet das Update einen Fehler und der Worker startet nicht neu (neuer Code würde ohne Paket abstürzen).
        code: [worker_python/src/utils/self_updater.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: UPD-07
        titel: Automatisches Update
        beschreibung: Unter dem Watchdog (WORKER_SUPERVISED=1) prüft der Worker alle AUTO_UPDATE_MINUTES (Standard 5, 0 = aus) origin/main. Liegt der lokale Stand auf Branch main nur zurück, zieht er das Update (inkl. pip) und startet neu. Ein anderer Branch oder lokale Commits werden nicht angefasst. git läuft dabei mit den normalen Rechten des Workers.
        code: [worker_python/src/utils/auto_updater.py, worker_python/main.py]
        tiers: [unit, manuell]
        pruefung:
          - Einen PR nach main mergen und 5–10 Minuten warten.
        erwartet: Die VPS-Seite zeigt die neue Version, ohne dass etwas geklickt wurde.

  # ---------------------------------------------------------------------------
  - id: VPS
    titel: VPS-Fernsteuerung vom Mac
    features:
      - id: VPS-01
        titel: VPS-Status
        beschreibung: Die Seite /vps zeigt per SSH (Route /api/vps/status → ops/windows/vps.ps1 status) Worker, ngrok samt öffentlicher URL, laufende Bots, Version/Branch samt Zeitpunkt der letzten Aktualisierung (Reflog .git/logs/HEAD), Autostart und Uptime. Ohne VPS_SSH_HOST (z. B. Vercel) erscheint nur ein Hinweis.
        code: [frontend_nextjs/src/app/vps/page.tsx, frontend_nextjs/src/components/vps/VpsStatusPanel.tsx, frontend_nextjs/src/components/vps/useVps.ts, worker_python/ops/windows/vps.ps1]
        tiers: [e2e, manuell]
        pruefung:
          - Lokal npm run dev:frontend, Seite „VPS“ öffnen.
        erwartet: Alle Kacheln grün; ist der Worker gestoppt, steht „Gestoppt“.

      - id: VPS-02
        titel: Aktionen (Update, Neustart, Reboot)
        beschreibung: Update-Prüfung über den Worker; „Update & Neustart“ läuft über den Worker (POST /system/update) oder, wenn er nicht läuft, über die Aufgabe AutoGrid-Update; „Worker neu starten“ über die Aufgabe AutoGrid-Start (start.bat); „ngrok neu starten“ beendet ngrok, run_ngrok_watchdog.bat startet ihn neu; „VPS neu starten“ per shutdown /r. Jede Aktion mit Bestätigung. git läuft nie per SSH als Administrator.
        code: [frontend_nextjs/src/components/vps/VpsActions.tsx, "frontend_nextjs/src/app/api/vps/[action]/route.ts", frontend_nextjs/src/lib/server/vpsSsh.ts, worker_python/ops/windows/vps.ps1]
        tiers: [e2e, manuell]
        pruefung:
          - „Worker neu starten“ → bestätigen.
          - „Update & Neustart“ nach einem Merge auf main.
        erwartet: Worker ist nach ~20 s wieder erreichbar bzw. die Version steigt.

      - id: VPS-03
        titel: Logs vom VPS
        beschreibung: Tabs Worker (logs/worker_console.log), ngrok (logs/ngrok.log) und Update (logs/vps_update.log), jeweils die letzten 300 Zeilen per SSH. Das Log lädt mit dem Status-Poll neu, Farbcodes von uvicorn werden entfernt; fehlt die Neustart-Schleife (dann gibt es kein Log), erklärt ein Hinweis den Klick auf „Worker neu starten“.
        code: [frontend_nextjs/src/components/vps/VpsLogViewer.tsx, frontend_nextjs/src/components/vps/useVps.ts, worker_python/ops/windows/vps.ps1]
        tiers: [e2e]
        pruefung:
          - Tabs wechseln.
          - Seite offen lassen, nachdem der VPS aktualisiert oder neu gestartet wurde.
        erwartet: Konsolenausgabe des Workers bzw. ngrok erscheint ohne Farbcodes und aktualisiert sich von selbst; ein alter Fehler bleibt nicht stehen.

      - id: VPS-04
        titel: Schutz der VPS-Route
        beschreibung: /api/vps/* antwortet nur auf localhost; POST nur mit eigener Origin; ohne VPS_SSH_HOST 404. Nur geprüfte Aktionen/Argumente gelangen in den SSH-Befehl, SSH-Daten stehen nur server-seitig in .env.local (kein NEXT_PUBLIC_). Auf der öffentlichen (Vercel-)Version antwortet ein fremder Host mit 403 localOnly; die Seite /vps zeigt dafür einen Hinweis statt eines roten Fehlerpanels und bleibt ohne Worker-Verbindung nutzbar (ConnectionGate lässt /vps offen).
        code: ["frontend_nextjs/src/app/api/vps/[action]/route.ts", frontend_nextjs/src/lib/server/vpsSsh.ts]
        tiers: [e2e]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch e2e-Tests.

      - id: VPS-05
        titel: Konsolen-Log und ngrok-Watchdog
        beschreibung: Unter dem Watchdog schreibt der Worker seine Konsolenausgabe zusätzlich nach logs/worker_console.log (rotiert ab 5 MB). run_ngrok_watchdog.bat startet ngrok bei Absturz neu und loggt nach logs/ngrok.log; start.bat und cleanup_old_instances.ps1 kennen ihn. Die PowerShell-Skripte sind reines ASCII (PowerShell 5.1).
        code: [worker_python/src/utils/console_tee.py, worker_python/main.py, worker_python/run_ngrok_watchdog.bat, worker_python/start.bat, worker_python/cleanup_old_instances.ps1]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: VPS-06
        titel: Einmalige Einrichtung und Autostart
        beschreibung: ops/windows/setup_vps.ps1 (einmal als Administrator) installiert OpenSSH (nur Schlüssel), trägt den Mac-Schlüssel ein, setzt den Besitzer des Repos auf den normalen Benutzer, richtet Auto-Login ein (Passwort als LSA-Secret), entfernt bei MT5-Terminals den Haken „Als Administrator ausführen“ (RUNASADMIN, samt Leeren des Kompatibilitäts-Caches) und legt die Aufgaben AutoGrid-Start (bei Anmeldung) und AutoGrid-Update an, beide ohne höchste Rechte.
        code: [worker_python/ops/windows/setup_vps.ps1, docs/windows_start_guide.md]
        tiers: [manuell]
        pruefung:
          - Einrichtung nach docs/windows_start_guide.md, danach VPS über die Seite „VPS“ neu starten.
        erwartet: Nach dem Reboot sind Auto-Login, Worker, ngrok und die vorher laufenden Bots von selbst wieder da.

      - id: VPS-07
        titel: Prozesse mit Adminrechten erkennen und beenden
        beschreibung: Laufen Neustart-Schleife, Worker, Bots, ngrok oder MT5 mit Adminrechten (alte Aufgabe mit höchsten Rechten, start.bat „Als Administrator“), kann der normale Worker sie weder sehen noch beenden. vps.ps1 status meldet sie (höhere Integritätsstufe als explorer.exe), die Seite „VPS“ zeigt eine rote Warnung mit „Admin-Prozesse beenden“ (fix-elevated, danach Neustart ohne Adminrechte, der Worker setzt die Bots fort); „Worker neu starten“ beendet Admin-Schleifen/-Worker/-ngrok vorher selbst. cleanup_old_instances.ps1 schreibt nicht beendbare Reste ins Worker-Log. Ein Worker mit Adminrechten warnt beim Start und macht kein git pull.
        code: [worker_python/ops/windows/vps.ps1, worker_python/cleanup_old_instances.ps1, worker_python/src/utils/elevation.py, worker_python/src/utils/self_updater.py, frontend_nextjs/src/components/vps/VpsElevatedWarning.tsx]
        tiers: [unit, e2e, manuell]
        pruefung:
          - Seite „VPS“ öffnen, wenn nichts mit Adminrechten läuft.
          - "Nur mit Absprache: auf dem VPS start.bat per Rechtsklick „Als Administrator ausführen“, danach Seite „VPS“ neu laden und „Admin-Prozesse beenden“."
        erwartet: Ohne Admin-Prozesse keine Warnung. Mit Admin-Start nennt die Warnung Neustart-Schleifen und Worker mit PID; nach „Admin-Prozesse beenden“ verschwindet sie, Worker und ngrok laufen wieder ohne Adminrechte und das Worker-Log zeigt keine neue Admin-Warnung.

      - id: VPS-08
        titel: Bootstrap eines frischen VPS
        beschreibung: Ein PowerShell-Einzeiler (irm .../bootstrap.ps1 | iex, Administrator-PowerShell) installiert fehlendes Git/Python 3.11/VC++-Redistributable, klont das Repo (nur wenn es fehlt, kein git pull), legt die venv an, installiert requirements.txt, erzeugt bei Bedarf WORKER_API_KEY und richtet ngrok (Authtoken + feste Domain als Benutzer-Variable NGROK_DOMAIN; run_ngrok_watchdog.bat hat keine Vorgabe-Domain, ohne Variable startet ngrok nicht und schreibt „NGROK_DOMAIN fehlt“ in logs/ngrok.log) ein – Repo-Klon/venv/pip/ngrok laufen dafür in einer eigenen geplanten Aufgabe mit RunLevel Limited (bootstrap-user.ps1), nie erhöht. Danach ruft es setup_vps.ps1 auf (jetzt ohne Pflicht-Parameter -PublicKey; ohne ihn entfallen nur OpenSSH/Mac-Schlüssel), startet den Worker über die Aufgabe AutoGrid-Start und gibt zum Schluss über connect-link.ps1 einen Verbindungs-Link (#connect=…, dasselbe Format wie frontend_nextjs/src/lib/connectionCode.ts) aus, den man im Frontend öffnet oder einfügt (SYS-07/SYS-08).
        code: [worker_python/ops/windows/bootstrap.ps1, worker_python/ops/windows/bootstrap-user.ps1, worker_python/ops/windows/connect-link.ps1, worker_python/ops/windows/setup_vps.ps1, worker_python/run_ngrok_watchdog.bat]
        tiers: [unit, manuell]
        pruefung:
          - Auf einem frischen Windows-VPS (oder einem, auf dem Git/Python/Repo noch fehlen), in einer Administrator-PowerShell den Einzeiler ausführen.
          - ngrok-Authtoken und eine feste Domain eingeben, danach das Windows-Passwort (Auto-Login) oder -SkipAutoLogon verwenden.
        erwartet: Git/Python/VC++-Redistributable werden installiert (oder als vorhanden erkannt), das Repo liegt unter C:\dev\auto-grid-nextJs, der Worker antwortet auf Port 8000, ngrok zeigt eine öffentliche URL, und am Ende erscheint ein Verbindungs-Link, der im Frontend („VPS verbinden“) sofort einen erfolgreichen Test ergibt. Ein zweiter Lauf des Einzeilers ändert nichts Bestehendes (idempotent).

      - id: VPS-09
        titel: Worker online steuern (ohne SSH)
        beschreibung: Wo die SSH-Route zu ist (öffentliche Vercel-Version), zeigt /vps unter dem Hinweis ein Panel „Worker (online)“, das direkt die Worker-API mit dem Admin-Schlüssel nutzt (alles admin-only) – GET /system/worker/status (Version, Laufzeit, unter Neustart-Schleife?, laufende Bots), GET /system/worker/log (letzte Zeilen von logs/worker_console.log, Farbcodes entfernt) und POST /system/restart (Worker beendet sich, run_uvicorn_watchdog.bat startet ihn in ~3 s neu; ohne Watchdog 409 und deaktivierter Knopf). Update-Prüfung/Update bleiben im Systemmenü des Dashboards. ngrok-/VPS-Neustart geht bewusst nur per SSH, denn ist der Tunnel weg, ist auch die API nicht erreichbar.
        code: [frontend_nextjs/src/components/vps/VpsOnlinePanel.tsx, frontend_nextjs/src/app/vps/page.tsx, worker_python/src/api/system.py]
        tiers: [api, e2e, manuell]
        pruefung:
          - Auf der Vercel-Version mit Admin-Schlüssel verbinden, Seite „VPS“ öffnen.
          - „Worker neu starten“ → bestätigen.
        erwartet: Version, Laufzeit und Log erscheinen; nach ~20 s ist der Worker wieder erreichbar und die Laufzeit beginnt von vorn.

      - id: VPS-10
        titel: Selbstheilung (Tunnel-Watchdog)
        beschreibung: Die geplante Aufgabe AutoGrid-Tunnel (setup_vps.ps1, alle 5 min) führt ops/windows/tunnel_watchdog.ps1 aus und prüft, ob die öffentliche ngrok-URL (NGROK_DOMAIN) /api/system/platform beantwortet (401/403 zählt als erreichbar). Wenn nicht und der Worker lokal antwortet, beendet sie ngrok (run_ngrok_watchdog.bat startet ihn neu); antwortet auch der Worker nicht, erst abwarten (Neustart-Schleife), dann Worker + ngrok über AutoGrid-Start. Nach 3 Fehlschlägen in Folge Reboot per shutdown /r – höchstens einmal pro Stunde und 3-mal in 24 h, nicht ohne Internet und nicht bei ERR_NGROK_334 (Domain woanders online); nichts in den ersten 10 min nach dem Start und während eines Updates. Der Fehlschlag wird vor der Aktion gespeichert (Zeiten in UTC, Datei atomar ersetzt). Kein Fernzugriff nötig; die Aufgabe hat höchste Rechte nur für den Reboot, ruft nie git auf und startet Worker/ngrok nie selbst. Zustand in data/tunnel_watchdog.json, Log logs/tunnel_watchdog.log; die Seite „VPS“ zeigt „Selbstheilung“ in der ngrok-Kachel (Warnung bei Tunnel-Fehlschlägen, „keine Prüfung seit n min“ wenn die Aufgabe nicht mehr läuft, letzter Auto-Reboot) und den Log-Tab „Tunnel“.
        code: [worker_python/ops/windows/tunnel_watchdog.ps1, worker_python/ops/windows/setup_vps.ps1, worker_python/ops/windows/vps.ps1, frontend_nextjs/src/components/vps/VpsStatusPanel.tsx, frontend_nextjs/src/components/vps/VpsLogViewer.tsx]
        tiers: [unit, e2e, manuell]
        pruefung:
          - Auf dem VPS in einer Administrator-PowerShell setup_vps.ps1 -SkipAutoLogon -SkipRepoOwnership erneut ausführen, dann tunnel_watchdog.ps1 -DryRun.
          - "Nur mit Absprache: ngrok.exe im Task-Manager beenden und das ngrok-Fenster schließen (keine Neustart-Schleife mehr), ~5-10 min warten."
        erwartet: "DryRun meldet keinen Fehler bzw. „AKTION: ngrok neu starten.“, wenn der Tunnel weg ist. Nach dem Schließen startet der Watchdog Worker + ngrok über AutoGrid-Start, die URL antwortet wieder, und die Seite „VPS“ zeigt „Selbstheilung: URL erreichbar“ sowie die Einträge im Log-Tab „Tunnel“."

  # ---------------------------------------------------------------------------
  - id: UI
    titel: Oberfläche
    features:
      - id: UI-01
        titel: Navigation
        beschreibung: Logo, Version, Links Dashboard, Formasyon und VPS mit animierter Markierung. Auf Mobil (375px) kompakter, ohne horizontales Scrollen.
        code: [frontend_nextjs/src/components/layout/AppNav.tsx]
        tiers: [e2e]
        pruefung:
          - Zwischen Dashboard und Formasyon wechseln.
          - Bei 375px Breite öffnen.
        erwartet: Aktiver Link ist markiert, Version entspricht VERSION. Bei 375px kein horizontales Scrollen, „Grid Robot“ bricht nicht um.

      - id: UI-02
        titel: Theme hell / dunkel / System
        beschreibung: Umschalter „Açık / Koyu / Sistem“ (auf Mobil ein einzelner Button, der der Reihe nach durchschaltet), gespeichert in localStorage grid-robot-theme, ohne Aufblitzen beim Laden.
        code: [frontend_nextjs/src/components/layout/ThemeToggle.tsx, frontend_nextjs/src/components/layout/ThemeSync.tsx, frontend_nextjs/src/app/layout.tsx]
        tiers: [e2e]
        pruefung:
          - Alle drei Varianten wählen und die Seite neu laden.
        erwartet: Theme bleibt erhalten, kein helles Aufblitzen im Dunkelmodus.

      - id: UI-03
        titel: PWA / Service Worker
        beschreibung: Manifest und Registrierung von /service-worker.js im Layout.
        code: [frontend_nextjs/src/app/layout.tsx, frontend_nextjs/public/manifest.json]
        tiers: [e2e]
        pruefung:
          - DevTools → Application → Service Workers.
        erwartet: Service Worker ist registriert, keine 404 in der Konsole.

      - id: UI-04
        titel: Zonen-Test-Link (/chart?account=&zone=)
        beschreibung: Link „Test“ im Zonenkopf öffnet die Analyse-Seite /chart?account=<Konto>&zone=<id> mit dieser Zone. Eine Zone, die es im Konto nicht gibt, meldet „Bölge bulunamadı“.
        code: [frontend_nextjs/src/app/chart/page.tsx, frontend_nextjs/src/components/zone/ZoneHeader.tsx]
        tiers: [e2e]
        pruefung:
          - In einer Zone auf „Test“ klicken.
        erwartet: Die Analyse-Seite zeigt das Konto und die gewählte Zone mit ihren Einstellungen.

      - id: UI-05
        titel: Sprache Türkisch / Englisch / Deutsch
        beschreibung: Umschalter TR · EN · DE in der Navigation (auf Mobil ein einzelner Button, der durchschaltet). Die Wahl liegt in localStorage grid-robot-locale, setzt <html lang> schon vor dem ersten Paint und gilt für alle Seiten, Dialoge, Toasts und Fehlermeldungen des Frontends. Texte stehen in frontend_nextjs/src/i18n/messages/*.ts (je Bereich tr, en, de nebeneinander, tsc erzwingt gleiche Schlüssel). Meldungen des Workers (detail-Texte, Logzeilen) bleiben unübersetzt.
        code: [frontend_nextjs/src/i18n/index.ts, frontend_nextjs/src/i18n/messages/index.ts, frontend_nextjs/src/store/useLocaleStore.ts, frontend_nextjs/src/components/layout/LanguageSwitcher.tsx, frontend_nextjs/src/components/layout/LocaleSync.tsx]
        tiers: [e2e]
        pruefung:
          - Im Umschalter EN, dann DE, dann TR wählen und dabei Dashboard, /vps und /chart ansehen.
          - Seite neu laden.
        erwartet: Alle Texte wechseln sofort, die Sprache bleibt nach dem Reload erhalten, <html lang> stimmt. Keine hartcodierten Reste, keine überlaufenden Buttons (Deutsch ist am längsten).

      - id: UI-06
        titel: Zahlen- und Zeitformat folgt der Sprache
        beschreibung: Preise und Gewinne ($97,25 in tr/de, $97.25 in en), Uhrzeiten in Logs und VPS-Seite sowie das Dezimalmuster im Symbol-Label („Sembol (0,00)“) richten sich nach der gewählten Sprache.
        code: [frontend_nextjs/src/i18n/format.ts, frontend_nextjs/src/components/dashboard/MetricsStrip.tsx, frontend_nextjs/src/components/ChartViewer.tsx, frontend_nextjs/src/components/zone/ZoneBasicFields.tsx]
        tiers: [e2e]
        pruefung:
          - Bot mit MT5 verbinden, dann die Sprache zwischen EN und DE wechseln.
        erwartet: Der Preis in der Kennzahlenleiste wechselt zwischen Punkt und Komma als Dezimaltrenner.

      - id: UI-07
        titel: Hinweise (Tooltips) zu jedem Feld und Button
        beschreibung: Jede Einstellung, jedes Feld, jeder Schalter, Button, Tab und Menüpunkt erklärt sich. Felder und Schalter tragen ein (i) hinter dem Label (Hover, Tastaturfokus oder Antippen), Buttons und Links zeigen den Tooltip bei Hover/Fokus, deaktivierte Buttons nennen den Grund. Der Tooltip ist ein Popover im Top-Layer (nicht von overflow-hidden abgeschnitten, über den Dialogen), Escape schließt zuerst nur ihn. Texte stehen als i18n-Schlüssel `<label-key>.hint` in src/i18n/messages/hints.ts (tr, en, de). `hint` ist Pflicht-Prop von InputField, Switch, Button, Tabs und ConfirmModal; der Abdeckungstest meldet jedes Bedienelement ohne Hinweis (hooks/RULES.md §5).
        code: [frontend_nextjs/src/components/ui/tooltip.tsx, frontend_nextjs/src/components/ui/InputField.tsx, frontend_nextjs/src/components/ui/button.tsx, frontend_nextjs/src/components/ui/switch.tsx, frontend_nextjs/src/i18n/messages/hints.ts]
        tiers: [e2e]
        pruefung:
          - Im Dashboard mit der Maus über das (i) hinter „Alt Seviyeler“, „Maks Pozisyon“ und „Çıkış Tetikleyici“ fahren.
          - Mit Tab durch die Felder gehen; Escape drücken.
          - Bei laufendem Bot über „Edit“ fahren; im Konto-Dialog über ein (i) fahren.
          - Sprache auf EN und DE stellen.
        erwartet: Zu jedem Element erscheint ein verständlicher Text in der gewählten Sprache. Er wird nicht abgeschnitten, liegt im Dialog über dem Dialog, Escape schließt erst den Tooltip. Ein deaktivierter Button nennt den Grund. Der Abdeckungstest findet kein Bedienelement ohne Hinweis.

      - id: UI-08
        titel: Mobil (375 px) ohne horizontalen Überlauf
        beschreibung: Bei 375 px Breite läuft keine Seite horizontal über. Im Zonenbereich brechen die Kopfzeile des Panels („Kaydedildi“ und „Bölge Ekle“) und der Zonenkopf (Status, Kaydet, Test und ⋯-Menü) in eine zweite Zeile um, statt die Karte zu sprengen. Das gilt für alle drei Sprachen (Deutsch ist am längsten), auch mit dem Abzeichen „Kaydedilmedi“ und einer vom Motor gestoppten Zone. Die Tab-Leiste des Log-Viewers im Dashboard ist bei 375 px breiter als ihre Karte; sie scrollt deshalb selbst horizontal (ohne sichtbaren Scrollbalken) statt vom overflow-hidden der Karte abgeschnitten zu werden, und ein gewählter Tab wird in Sicht geholt. Auch das gilt für alle drei Sprachen; die Tabs des VPS-Logs auf /vps passen ohne Scrollen. Ab Tablet-Breite bleibt das Layout unverändert. Die Felder eines Setups sind auch bei 375 px kurz und brechen um; Grid-Schritt und Lot stehen nebeneinander, auch mit allen Schaltern an, getrenntem BUY/SELL und Fraktal-Setup, ohne dass etwas über die Setup-Karte hinausragt.
        code: [frontend_nextjs/src/components/ZoneSettingsPanel.tsx, frontend_nextjs/src/components/zone/ZoneHeader.tsx, frontend_nextjs/src/components/zone/ZoneCard.tsx, frontend_nextjs/src/components/zone/FieldSwitch.tsx, frontend_nextjs/src/components/LogViewer.tsx, frontend_nextjs/src/components/ui/animated-tabs.tsx]
        tiers: [e2e]
        pruefung:
          - Dashboard bei 375 px Breite öffnen (Entwicklertools, Geräteleiste) und ein Konto mit Zone wählen.
          - Sprache auf DE stellen und in der Zone einen Wert ändern.
          - /formasyon, /vps und /chart bei 375 px ansehen.
          - Im Log-Viewer unter dem Zonenbereich die Tab-Leiste nach links wischen und den dritten Tab („MT5 Terminal“) antippen.
        erwartet: Kein horizontaler Scrollbalken auf keiner Seite. „Bölge Ekle“, „Kaydet“, „Test“ und das ⋯-Menü der Zone sind vollständig sichtbar, notfalls in einer zweiten Zeile. Die Tab-Leiste des Log-Viewers lässt sich wischen, jeder Tab ist erreichbar und nach dem Antippen ganz sichtbar.

      - id: UI-09
        titel: Kompakte Steuerleiste (Konto, Bot, Intervall)
        beschreibung: Über den Kennzahlen liegt eine einzige Leiste mit LIVE/TEST-Badge, Kontoauswahl, Kontomenü (⋯ mit Bot-Log herunterladen, Bearbeiten, Löschen, Neues Konto), Bot-Status mit Start/Neustart/Stopp, Prüfintervall mit Speichern und Systemmenü (Zahnrad mit Systeminfo, Update-Prüfung, Herunterfahren). Ab etwa 1280 px ist das eine Zeile; schmaler brechen die Gruppen um, bei 375 px ohne horizontalen Überlauf. Alarme der Bot-Steuerung erscheinen in voller Breite unter der Leiste. Zonen und Log nutzen darunter die volle Breite.
        code: [frontend_nextjs/src/app/page.tsx, frontend_nextjs/src/components/BotControls.tsx, frontend_nextjs/src/components/SettingsForm.tsx, frontend_nextjs/src/components/account/components/AccountActions.tsx, frontend_nextjs/src/components/ui/dropdown-menu.tsx]
        tiers: [e2e]
        pruefung:
          - Dashboard auf dem Desktop öffnen und ein Konto wählen.
          - Auf ⋯ neben der Kontoauswahl klicken, dann Escape drücken.
          - Fenster auf 375 px Breite verkleinern.
        erwartet: Konto, Bot-Steuerung und Prüfintervall stehen in einer Zeile. Das ⋯-Menü zeigt Log, Bearbeiten, Löschen und Neues Konto und schließt mit Escape. Bei 375 px stehen die Gruppen untereinander, nichts läuft über.

  # ---------------------------------------------------------------------------
  - id: ANA
    titel: Analyse (Chart, Statistik, Backtest)
    features:
      - id: ANA-01
        titel: Analyse-Seite mit Tabs
        beschreibung: "Menüpunkt „Analyse“ (/chart) mit den Tabs Chart, Statistik und Backtest (Statistik und Backtest noch Platzhalter). Konto, Zone, Tab und Zeitraum stehen in der URL (?account=&zone=&tab=&range= bzw. &from=&to=); Neuladen und geteilte Links zeigen dieselbe Ansicht, ohne ?account= wird das im Dashboard gewählte Konto übernommen. Der Chart-Tab zeigt die Einstellungen der Zone und ihren Kursverlauf (ANA-05). Ein Info-Symbol zeigt den Lizenzhinweis von TradingView Lightweight Charts™ mit Link zu tradingview.com. Bei 375 px stehen Konto, Zone und Zeitraum untereinander; Panels bleiben im Bildschirm."
        code: [frontend_nextjs/src/app/chart/page.tsx, frontend_nextjs/src/hooks/useAnalysisParams.ts, frontend_nextjs/src/components/analysis/LicenseInfo.tsx, frontend_nextjs/src/components/chart/ZoneChartPanel.tsx, frontend_nextjs/src/components/layout/AppNav.tsx]
        tiers: [e2e]
        pruefung:
          - Im Menü „Analyse“ öffnen, ein Konto wählen.
          - Tab „Statistik“ wählen und die Seite neu laden.
          - Auf das Info-Symbol neben dem Zahnrad klicken.
          - Fenster auf 375 px Breite verkleinern.
        erwartet: Die erste Zone des Kontos ist gewählt und steht mit dem Konto in der Adresse; nach dem Neuladen ist derselbe Tab offen. Der Lizenzhinweis nennt TradingView und verlinkt tradingview.com. Bei 375 px läuft nichts über.

      - id: ANA-02
        titel: Konto- und Zonenwahl ohne fremde Daten
        beschreibung: "Die Analyse-Seite wählt das Konto für die ganze App (Dashboard und Live-Stream folgen, gemeinsame Funktion selectAccount). Beim Kontowechsel werden Zonen, Status und Preise des alten Kontos sofort geleert; die Zonenwahl zeigt nur Zonen, die für genau dieses Konto geladen wurden (useSettingsStore.loadedAccount). Eine verspätete Antwort für ein vorher gewähltes Konto wird verworfen. Sind die Zonen dieses Kontos schon geladen, lädt die Seite sie nicht neu (ungespeicherte Zonen-Änderungen bleiben erhalten). Wird das Konto direkt beim Laden über die Adresse gewählt, verbindet sich der Live-Stream mit diesem Konto (vorher schloss ein verzögertes Trennen im WebSocket-Manager den gerade geöffneten Stream)."
        code: [frontend_nextjs/src/app/chart/page.tsx, frontend_nextjs/src/hooks/useAccountSettings.ts, frontend_nextjs/src/store/utils/selectAccount.ts, frontend_nextjs/src/store/useSettingsStore.ts, frontend_nextjs/src/components/analysis/ZoneSelect.tsx, frontend_nextjs/src/store/useWebSocketManager.ts]
        tiers: [e2e]
        pruefung:
          - Auf der Analyse-Seite ein Konto mit Zonen wählen, dann ein Konto ohne Zonen.
          - Danach zum Dashboard wechseln.
        erwartet: Nach dem Wechsel ist keine Zone des alten Kontos mehr zu sehen, die Zonenwahl ist leer. Das Dashboard zeigt das zuletzt gewählte Konto.

      - id: ANA-03
        titel: Anzeige-Schalter (Zahnrad)
        beschreibung: "Das Zahnrad schaltet Zonenband, Grid-Stufen, Positionen/Orders, Marktpausen, RSI und die Karte mit den Zonen-Einstellungen ein und aus; die Wahl bleibt in diesem Browser gespeichert (localStorage grid-robot-analysis-prefs). Datenqualitäts-Warnungen, Datenquelle und Modellgrenzen haben bewusst keinen Schalter; das Panel sagt das."
        code: [frontend_nextjs/src/components/analysis/AnalysisSettingsPanel.tsx, frontend_nextjs/src/store/useAnalysisPrefsStore.ts]
        tiers: [e2e]
        pruefung:
          - Zahnrad öffnen, „Karte mit Zonen-Einstellungen“ ausschalten, Seite neu laden.
        erwartet: Die Karte bleibt nach dem Neuladen ausgeblendet; das Panel nennt die nicht abschaltbaren Hinweise.

      - id: ANA-04
        titel: Kursdatenbank mit Abdeckung
        beschreibung: "SQLite auf dem VPS (worker_python/data/market.sqlite, gitignored). GET /market/{id}/rates?symbol&timeframe=M1…D1&from&to (MT5-Zeit, halb offen, nur eigene Konten) holt nur die Teile, die noch nicht in der Datenbank sind, aus MT5 und liefert spaltenweise (t,o,h,l,c,v,s; höchstens 50.000 Kerzen, Rest über next_from). Jeder Bereich hat einen Zustand: vollständig (zwischen erster und letzter gelieferter Kerze), bestätigte Pause (keine Kerzen, aber davor und danach welche, höchstens 4 Tage: Wochenende, Feiertag) oder nicht verfügbar (vor der ersten Kerze, die MT5 hat; nach 24 h neu versucht). Die neueste MT5-Kerze wird nie gespeichert, nur mitgeliefert (live_from). Fehler werden nicht gespeichert; was fehlt, steht mit Grund in missing (unavailable, error, busy). Schutz des Live-Bots: Abruf in Stücken (höchstens 31 Tage M1), immer nur einer gleichzeitig, 0,5 s Pause, ohne Login und ohne Terminal-Neustart; ist das Konto in /start oder /stop, kommt nur der Datenbank-Bestand. GET /market/{id}/coverage zeigt den Bestand und die Größe. Bei jedem Abruf wird ein verlässlicher Broker-Abstand protokolliert. Ab MARKET_DB_MAX_MB (Standard 5000) werden keine Kerzen mehr gespeichert. Täglich und vor jeder Migration ein Backup (data/backups, 7 Stück); eine fehlgeschlagene Migration lässt die alte Version und die Daten-Endpunkte antworten 503, der Handel läuft weiter."
        code: [worker_python/src/utils/market_db.py, worker_python/src/utils/market_sync.py, worker_python/src/api/market.py]
        tiers: [api, manuell]
        pruefung:
          - Worker auf dem VPS mit diesem Stand neu starten.
          - Im Browser (angemeldet als Admin) /api/market/<Konto>/rates?symbol=<Symbol>&timeframe=M1&from=<Montag 00:00 als Unix-Sekunden>&to=<Montag 01:00> zweimal aufrufen (Header X-API-Key, z. B. mit curl).
          - Danach /api/market/<Konto>/coverage?symbol=<Symbol> aufrufen.
          - Im MT5-Journal und im Bot-Log nachsehen, ob während der Abrufe etwas passiert ist.
        erwartet: Beide Aufrufe liefern dieselben 60 Kerzen, die Zeiten passen zum MT5-Chart (Brokerzeit). Coverage zeigt den Bereich als „complete“. Im Journal keine neue Zeile „authorized on …“, im Bot-Log kein Verbindungsabbruch.

      - id: ANA-05
        titel: Chart-Tab mit Kerzen, Zonenband und Stufen
        beschreibung: "Der Chart-Tab zeigt die MT5-Kerzen der gewählten Zone für Zeitraum und Zeitrahmen (M1 … D1, in der Adresse ?tf=, Standard M15) aus GET /market/{id}/rates, höchstens 100.000 Kerzen (sonst nur das Ende, mit Hinweis), Zeiten unverändert als Brokerzeit (MT5). Darüber das Zonenband (min–max als gestrichelte Linien und helle Fläche) und die Grid-Stufen, die der Bot vom aktuellen Preis aus rechnet (src/lib/analysis/levels.ts, gleiche Rechnung wie grid_execution/levels.py inkl. Breakout-Pullback und „Abstand nach Verlust“; Fraktal-Zonen haben keine Stufen, mit Hinweis). RSI(14, Wilder) im Browser aus den gezeigten Kerzen, eigener Bereich. Liegt der Zeitraum bis jetzt, kommt alle 60 s das Endstück neu (der Worker hält es 30 s im Cache); die laufende Kerze wächst mit dem Live-Preis, aber nur bei passendem Konto und Symbol, offenem Markt und sicherer Brokeruhr. Band, Stufen und RSI sind im Zahnrad abschaltbar."
        code: [frontend_nextjs/src/components/chart/ZoneChartPanel.tsx, frontend_nextjs/src/components/analysis/chart/ChartCore.tsx, frontend_nextjs/src/components/analysis/chart/primitives.ts, frontend_nextjs/src/components/analysis/chart/TimeframeSelect.tsx, frontend_nextjs/src/lib/analysis/levels.ts, frontend_nextjs/src/lib/analysis/candles.ts, frontend_nextjs/src/hooks/useMarketRates.ts, worker_python/src/utils/market_sync.py]
        tiers: [e2e, manuell]
        pruefung:
          - Analyse öffnen, ein DEMO-Konto mit laufendem Bot und eine Grid-Zone wählen, Zeitraum „Letzte 7 Tage“.
          - Zeitrahmen M15, dann H1 wählen und die Seite neu laden.
          - Im MT5-Terminal denselben Chart (Symbol, H1) daneben öffnen.
        erwartet: Die Kerzen stimmen in Zeit und Preis mit dem MT5-Chart überein (Brokerzeit). Nach dem Neuladen ist H1 noch gewählt. Das Zonenband liegt auf min/max der Zone; die Stufen liegen dort, wo der Bot seine Orders setzt.

      - id: ANA-06
        titel: Offene Positionen und Orders im Chart
        beschreibung: "Die Bot-Telemetrie (grid_metrics.calculate_live_metrics) liefert zusätzlich positions[] und orders[] der Robot-Magics (Ticket, Magic, Typ, Volumen, Einstiegspreis, SL, TP, Gewinn, MT5-Zeit; höchstens 500). Der Chart-Tab liest sie alle 5 s über GET /logs/{id}?log_type=metrics und zeigt nur die der gewählten Zone (feste Magic-Nummer und Symbol): Positionen als durchgezogene Linie mit Beschriftung (BUY/SELL + Lot), TP/SL gepunktet, Pending-Orders gestrichelt (BUY LIMIT …); ab mehr als 20 Linien ohne Beschriftung an der Preisachse (überdecken sich sonst). Ohne laufenden Bot oder ohne Magic (Zone nie gespeichert) keine Linien, dafür ein Hinweis. Die geschätzte Handelszeit der Zone steht als „geschätzt“ daneben. Abschaltbar im Zahnrad."
        code: [worker_python/src/core/grid_metrics.py, frontend_nextjs/src/hooks/useLiveTrades.ts, frontend_nextjs/src/components/chart/ZoneChartPanel.tsx, frontend_nextjs/src/store/types.ts]
        tiers: [unit, e2e, manuell]
        pruefung:
          - Bot auf dem DEMO-Konto laufen lassen, bis die Zone Orders und mindestens eine Position hat.
          - Analyse → Chart-Tab mit dieser Zone öffnen und mit der Liste „Handel“ im MT5-Terminal vergleichen.
          - Bot stoppen und 10 Sekunden warten.
        erwartet: Jede Position und Order dieser Zone erscheint auf ihrem Preis, Orders anderer Zonen nicht; die Anzahl unter dem Chart stimmt mit MT5 überein. Nach dem Stopp verschwinden die Linien und der Hinweis „Bot läuft nicht“ erscheint.

      - id: ANA-07
        titel: Deal-Archiv und Zonen-Register
        beschreibung: "GET /history/{id}/deals?from&to (MT5-Zeit, nur eigene Konten) archiviert alle Deals des Kontos in der Datenbank, auch manuelle Trades sowie Ein- und Auszahlungen; gefiltert wird erst bei der Auswertung. Abgeglichene Zeiträume werden einzeln gemerkt (ein Abgleich von „diese Woche“ sagt nichts über „letztes Jahr“); der jüngste Rand (24 h plus Puffer für den Broker-Abstand) wird jedes Mal neu abgeglichen. Liegt der Einstieg einer Position vor dem Zeitraum, wird er nachgeladen und mitgeliefert. Die Antwort enthält Kontowährung, Kontostand, Kontomodell und das Zonen-Register. Das Register (POST /settings) merkt sich je Magic-Nummer Zone, Symbol und Name, auch für gelöschte Zonen (deleted_at), und jede geänderte Fassung der Zonen-Einstellungen mit Zeitstempel. Konto löschen löscht dessen Deal-Archiv."
        code: [worker_python/src/utils/market_db.py, worker_python/src/utils/market_sync.py, worker_python/src/api/market.py, worker_python/src/api/settings.py, worker_python/src/api/accounts.py]
        tiers: [api]
        pruefung:
          - /api/history/<Konto>/deals?from=<vor 30 Tagen> aufrufen (X-API-Key).
        erwartet: Alle Deals der letzten 30 Tage wie in MT5 unter Historie → Deals, auch Ein- und Auszahlungen; „zones“ nennt die Zonen mit ihrer Magic-Nummer.

      - id: ANA-08
        titel: Trades im Chart und Trade-Archiv (Pfeile, Fraktale)
        beschreibung: "Der Chart-Tab lädt für denselben Zeitraum wie die Kerzen das Deal-Archiv (GET /history/{id}/deals, ANA-07) und führt Ein- und Ausstiege über die Positionsnummer zusammen (src/lib/analysis/tradePairing.ts): jeder Ausstieg ist ein Trade, eine Teilschließung ein eigener Trade mit nach Volumen verteilten Einstiegskosten; eine Umkehr (INOUT, Netting) schließt die Position und eröffnet den Rest in der Gegenrichtung; Close By ist gekennzeichnet; Netto = Gewinn + Kommission + Swap + Gebühr. Zone nur über das Zonen-Register: Magic im Register und Einstieg nach dem Registereintrag (MT5-Zeit minus Broker-Abstand, ohne Messung minus 14 h); sonst „Zone unbekannt“, nie geraten. Magic 200000, Ein-/Auszahlungen, manuelle Trades und andere Zonen erscheinen nicht (gezählt). Im Chart: Pfeil am Einstieg (Kauf grün, Verkauf rot), Punkt am Ausstieg nach Ergebnis, gepunktete Verbindung, „Zone unbekannt“ grau mit „?“; unter dem Fadenkreuz die Trades der Kerze; abschaltbar. Fraktal-Zonen zeigen Bill-Williams-Fraktale aus geschlossenen Kerzen (gleiche Regel wie der Bot, nie über eine Datenlücke), vom Bot gehandelte Fraktale (Order-Kommentar) orange; mit Hinweis und Knopf, wenn der Chart einen anderen Zeitrahmen als die Zone hat. Darunter das Trade-Archiv der Zone (neueste zuerst, höchstens 500 Zeilen): Schließzeit, Richtung, Lot, Ein-/Ausstieg, Netto, Zone, Hinweise (TP/SL, Teilschließung, Umkehr, Close By, vor dem Zeitraum eröffnet, Einstieg fehlt) und Sprung in den Chart. Fehlende Teile des Archivs (Konto beschäftigt, MT5-Fehler) stehen als Pflicht-Hinweis darüber. Reicht der Zeitraum bis jetzt, alle 2 min neu."
        code: [frontend_nextjs/src/lib/analysis/tradePairing.ts, frontend_nextjs/src/lib/analysis/fractals.ts, frontend_nextjs/src/hooks/useDealsHistory.ts, frontend_nextjs/src/services/historyApi.ts, frontend_nextjs/src/components/analysis/TradesTable.tsx, frontend_nextjs/src/components/chart/ZoneChartPanel.tsx, frontend_nextjs/src/components/analysis/chart/ChartCore.tsx, frontend_nextjs/src/components/analysis/chart/primitives.ts]
        tiers: [e2e, manuell]
        pruefung:
          - Analyse → Chart-Tab, DEMO-Konto mit Trades seit dem Zonen-Register, Grid-Zone, Zeitraum „Letzte 7 Tage“, Zeitrahmen M15.
          - Im MT5-Terminal unter Werkzeuge → Historie → Deals denselben Zeitraum ansehen und einige Trades vergleichen.
          - In der Trade-Liste bei einem Trade auf „Im Chart zeigen“ klicken und mit der Maus über den Pfeil fahren.
          - Eine Fraktal-Zone wählen und den Zeitrahmen der Zone einstellen.
        erwartet: Jeder Ausstieg der Zone steht mit Zeit (Brokerzeit), Preis, Lot und Netto wie in MT5 in der Liste; Teilschließungen sind einzeln und markiert; Trades aus der Zeit vor dem Register heißen „Zone unbekannt“. Pfeile und Punkte liegen im Chart auf Kerze und Preis der Ausführung. In der Fraktal-Zone liegen die Dreiecke dort, wo der MT5-Indikator „Fractals“ seine Pfeile zeigt.

      - id: ANA-09
        titel: Statistik-Tab (Kennzahlen, Kurven, Aufteilung)
        beschreibung: "Der Statistik-Tab der Analyse-Seite rechnet aus dem Deal-Archiv (GET /history/{id}/deals, Paarung wie ANA-08) die im Zeitraum geschlossenen Trades (Schließzeit, MT5-Zeit; vor dem Zeitraum eröffnete zählen mit und werden genannt). Umfang wählbar: ganzes Konto, ein Symbol oder ein Setup (Vorauswahl: Setup aus der Adresse; Symbol und Vergleich der Setups: ANA-14). Setup (= Zone, Magic) nur über das Zonen-Register (\"Setup unbekannt\" zählt zu keinem Setup). Kennzahlen (src/lib/analysis/stats.ts): Netto (Gewinn + Kommission + Swap + Gebühr), Trades/Positionen, Gewinn/Verlust/Null, Trefferquote, Profitfaktor (ohne Verlust „—“), Ø Trade, größter Gewinn/Verlust, Brutto, Grid-Zyklen (TP), max. Drawdown der realisierten Kurve. Kurven (curves.ts): realisierter Gewinn, Drawdown, Kontostand rückwärts vom heutigen Stand – nur wenn das Archiv lückenlos bis jetzt reicht, sonst ausgeblendet mit Grund; Equity nur im Backtest. Aufteilung (groupings.ts) je Symbol, je Setup, je Wochentag, je Stunde; das Konto öffnet „je Symbol“, ein Setup „je Wochentag“. Lücken im Archiv als Pflicht-Hinweis. Unten das Trade-Archiv des Umfangs mit MFE/MAE (ANA-12)."
        code: [frontend_nextjs/src/lib/analysis/stats.ts, frontend_nextjs/src/lib/analysis/curves.ts, frontend_nextjs/src/lib/analysis/groupings.ts, frontend_nextjs/src/components/analysis/stats/StatsTab.tsx, frontend_nextjs/src/components/analysis/stats/StatsKpis.tsx, frontend_nextjs/src/components/analysis/stats/BreakdownTable.tsx, frontend_nextjs/src/components/analysis/stats/CurveChart.tsx, frontend_nextjs/src/app/chart/page.tsx]
        tiers: [e2e, manuell]
        pruefung:
          - Analyse → Statistik, DEMO-Konto, ein Setup mit Trades, Zeitraum „Letzte 30 Tage“.
          - Umfang „Ganzes Konto“, dann das Setup wählen; Aufteilung je Symbol/Setup/Wochentag/Stunde durchschalten.
          - Netto und Anzahl Trades mit MT5 (Werkzeuge → Historie, gleicher Zeitraum) vergleichen.
        erwartet: Netto und Anzahl stimmen mit MT5 überein; je Setup stehen die Trades mit der Magic des Setups; Kontostand-Kurve endet beim heutigen Kontostand oder ist mit Grund ausgeblendet.

      - id: ANA-10
        titel: Kalender in Brokerzeit
        beschreibung: "Zeitraum in Brokertagen (MT5-Zeit): Vorauswahlen (heute, diese Woche ab Montag, dieser/letzter Monat, letzte 7/30/90 Tage, dieses/letztes Jahr, letzte 12 Monate, alles), Kalender und Eingabe als TT.MM.JJ mit Prüfung. „Heute“ ist der Tag auf der Brokeruhr, nicht im Browser; dazu misst GET /market/{id}/clock (nur lesend, für eigene Konten) den Abstand der Brokeruhr zu UTC und merkt ihn sich 10 min; ist MT5 nicht erreichbar, gilt die letzte sichere Messung. Ohne sichere Messung (Markt zu, alter Tick) liefert er keinen Abstand statt eines falschen; die Seite rechnet dann in UTC, fragt jede Minute erneut und zeigt einen nicht abschaltbaren Hinweis. Zeiträume sind halb offen, ohne 23:59:59 (src/lib/serverTime.ts, docs/analyse-regeln.md §1)."
        code: [frontend_nextjs/src/lib/serverTime.ts, frontend_nextjs/src/components/analysis/DateRangePicker.tsx, frontend_nextjs/src/components/analysis/BrokerClockNotice.tsx, frontend_nextjs/src/hooks/useBrokerClock.ts, worker_python/src/api/market.py, worker_python/src/utils/mt5_market.py]
        tiers: [api, e2e]
        pruefung:
          - Auf der Analyse-Seite den Zeitraum öffnen, „Letztes Jahr“ wählen.
          - Eigenen Zeitraum 01.09.26 bis 15.09.26 eingeben, übernehmen, Seite neu laden.
          - „31.02.26“ eingeben.
        erwartet: Neben dem Titel steht „Broker UTC+3“ (je nach Broker). „Letztes Jahr“ zeigt 01.01.–31.12. des Vorjahres; der eigene Zeitraum bleibt nach dem Neuladen; ein ungültiges Datum wird rot gemeldet und „Übernehmen“ ist gesperrt.

      - id: ANA-11
        titel: Fehlende Daten und Marktpausen im Chart
        beschreibung: "Keine erfundenen Kerzen: Bereiche, die laut /rates fehlen (unavailable, error, busy), werden Leerstellen ohne Preis (nur Zeitstempel, höchstens 120 je Bereich) und grau schraffiert mit „Keine Daten“ gezeichnet; darüber ein Pflicht-Hinweis ohne Schalter mit Zeitraum, Grund und letzter Prüfung (DataQualityBanner). Bis „jetzt“ abgeschnitten, die Zukunft fehlt nie. Marktpausen (Lücke zwischen zwei echten Kerzen, mindestens zwei Kerzen lang und länger als eine Kerze + 15 min: Wochenende, Feiertag, Tagespause) sind dünne gestrichelte Trennlinien, abschaltbar; eine einzelne fehlende Kerze ohne Ticks ist keine Pause. Der RSI läuft nicht über eine Datenlücke. Gekürzter Zeitraum und volle Datenbank werden ebenfalls gemeldet."
        code: [frontend_nextjs/src/lib/analysis/candles.ts, frontend_nextjs/src/components/analysis/DataQualityBanner.tsx, frontend_nextjs/src/components/analysis/chart/primitives.ts, frontend_nextjs/src/components/analysis/chart/ChartCore.tsx]
        tiers: [e2e, manuell]
        pruefung:
          - Analyse → Chart-Tab, Zeitraum über ein Wochenende (z. B. „Letzte 7 Tage“), Zeitrahmen M15.
          - Einen Zeitraum wählen, der vor dem Beginn der MT5-Historie des Symbols liegt (z. B. „Letztes Jahr“ bei M1).
        erwartet: Am Wochenende eine dünne gestrichelte Linie statt Kerzen. Vor dem Beginn der Historie eine grau schraffierte Fläche „Keine Daten“ und ein gelber Hinweis mit Zeitraum und Grund „in MT5 nicht vorhanden“; dort steht keine einzige Kerze.

      - id: ANA-12
        titel: MFE/MAE echter Trades
        beschreibung: "Das Trade-Archiv (dieselbe Tabelle im Chart-Tab und neu unten im Statistik-Tab für den gewählten Umfang) zeigt je Trade MFE/MAE: größter Zwischengewinn und größter Zwischenverlust in Punkten und Kontowährung. Nur auf Knopfdruck „MFE/MAE berechnen“: M1-Kerzen einmal je Symbol über die Spanne der noch offenen Trades (neueste zuerst, höchstens 100.000 M1-Kerzen, darüber Hinweis und erneut drücken). Rechnung (src/lib/analysis/excursions.ts, docs/analyse-regeln.md §4): nur Kerzen strikt zwischen Einstiegs- und Ausstiegskerze plus Ein-/Ausstiegspreis, also Untergrenze („geschätzt“); BUY auf Bid, SELL auf Ask = Bid + Spread der Kerze. Geld aus dem Trade selbst (Gewinn ÷ Preisabstand), bei Ausstieg = Einstieg nur Punkte. Fehlende Kerzen (missing), fehlender Einstieg, SELL-Kerze ohne Spread oder Trade länger als 100.000 Minuten offen → „nicht berechenbar“ mit Grund, nie 0; Marktpausen sind kein Fehler. Vorläufige Fälle (Spanne über der Obergrenze, Lücke nur wegen Konto beschäftigt/MT5-Fehler, point unbekannt) bleiben offen und werden beim nächsten Knopfdruck neu versucht. Symbole werden nacheinander geladen (Worker lädt eine Spanne zugleich). Ergebnisse gelten je Trade und Konto; unter einem anderen Konto erscheinen sie nie."
        code: [frontend_nextjs/src/lib/analysis/excursions.ts, frontend_nextjs/src/hooks/useExcursions.ts, frontend_nextjs/src/components/analysis/TradesTable.tsx, frontend_nextjs/src/components/analysis/stats/StatsTab.tsx]
        tiers: [e2e, manuell]
        pruefung:
          - Analyse → Statistik-Tab, Zone mit Trades der letzten Tage, unten „MFE/MAE berechnen“ drücken.
          - Zwei Trades im MT5-Terminal (M1-Chart) nachsehen; bei einem SELL den Spread der Kerzen beachten.
        erwartet: Jede Zeile zeigt +MFE / −MAE in Punkten und darunter in Kontowährung. Die Werte liegen nicht über dem, was der M1-Chart zwischen Ein- und Ausstieg zeigt (Untergrenze). Ein Trade, dessen Einstieg fehlt oder in dessen Spanne Kerzen fehlen, zeigt „nicht berechenbar“, nie 0.

      - id: ANA-14
        titel: Statistik je Symbol und Setup (Setups vergleichen)
        beschreibung: "Teil D von „Zone wird Symbol mit Setups“ (ZON-19). Der Statistik-Tab hat als Umfang zusätzlich jedes Symbol („USOUSD · alle Setups (2)“): alle Trades registrierter Setups (auch gelöschter) mit dem gehandelten Symbol des Deals (ohne Groß-/Kleinschreibung); „Setup unbekannt“, manuelle und fremde Trades zählen zu keinem Symbol. Ein Symbol öffnet die Aufteilung „je Setup“: jede Zeile ein Setup (Magic) mit Positionen, Trades, Trefferquote, Netto, Profitfaktor, Ø Trade und max. Drawdown, so lassen sich die Setups eines Symbols vergleichen. Das Konto öffnet „je Symbol“ (Symbole nach Namen, danach unbekannt, manuell, andere). Setups heißen auf der ganzen Analyse-Seite wie auf den Symbolkarten „Symbol · Setup n“ (n = Platz im Symbol, src/lib/symbolSetups.ts setupNumbers); ein Setup, das nicht mehr in den Einstellungen steht, mit Symbol und Namen aus dem Register. Die Analyse-Seite sagt „Setup“ statt „Zone“."
        code: [frontend_nextjs/src/lib/analysis/groupings.ts, frontend_nextjs/src/lib/symbolSetups.ts, frontend_nextjs/src/components/analysis/stats/StatsTab.tsx, frontend_nextjs/src/components/analysis/stats/BreakdownTable.tsx, frontend_nextjs/src/components/analysis/TradesTable.tsx, frontend_nextjs/src/hooks/useSetupLabel.ts, frontend_nextjs/src/components/analysis/ZoneSelect.tsx, frontend_nextjs/src/components/chart/ZoneChartPanel.tsx]
        tiers: [e2e, manuell]
        pruefung:
          - DEMO-Konto mit einem Symbol, das zwei Setups mit Trades hat; Analyse → Statistik, Zeitraum „Letzte 30 Tage“.
          - Umfang „<Symbol> · alle Setups“ wählen; Aufteilung „je Setup“ ansehen.
          - Netto je Setup mit MT5 vergleichen (Werkzeuge → Historie, gleicher Zeitraum, nach Magic-Nummer des Setups).
        erwartet: Netto des Symbols ist die Summe der Setup-Zeilen; jede Setup-Zeile stimmt mit den Trades ihrer Magic-Nummer in MT5 überein; die Namen „Symbol · Setup n“ stimmen mit den Symbolkarten im Dashboard überein.

      - id: ANA-13
        titel: Zeit-Check und Login-Schonung (Schritt 0)
        beschreibung: "GET /market/{id}/time-check (nur Admin, nur lesend) liefert für ein Symbol (Standard: das der ersten Zone) die Tick-Zeit (Brokerzeit) und die echte UTC des VPS, daraus den Broker-Abstand (aus dem Tick des Symbols, bei geschlossenem Markt aus einem frischeren der Marktübersicht; auf halbe Stunden gerundet, „verlässlich“ nur bei frischem Tick), die letzten 3 M1-Kerzen aus copy_rates_range, den letzten Trade-Deal (7 Tage, sonst 90 Tage), Kontomodell (hedging/netting) und Kontowährung sowie Berechnungsart, Gewinnwährung und Dreifach-Swap-Tag des Symbols. Damit wird vor dem Bau der Analyse-Seite geprüft, dass Zeiten in MT5, API und Datenbank zusammenpassen (docs/analyse-regeln.md). Der Check verbindet sich ohne Terminal-Neustart und ohne erneuten Login; ist das Konto gerade in /start oder /stop, kommt 409, ist MT5 nicht erreichbar 503 mit Grund; MT5-Fehler einzelner Abfragen stehen in errors. Datenabrufe (Zeit-Check, Symbolliste) verbinden sich mit data_query: kein mt5.login(), wenn das Terminal schon in diesem Konto und auf diesem Server angemeldet ist (dafür wird bis zu 3 s auf die Kontodaten gewartet; ein Login baut die Sitzung neu auf und könnte den dort laufenden Bot kurz trennen), und kein Kontowechsel auf einem Terminal, auf dem der Bot eines anderen Kontos läuft."
        code: [worker_python/src/api/market.py, worker_python/src/utils/mt5_market.py, worker_python/src/utils/mt5_helpers.py, worker_python/src/utils/mt5_connection.py, frontend_nextjs/e2e/live/time-check.spec.ts, docs/analyse-regeln.md]
        tiers: [unit, api, live, manuell]
        pruefung:
          - Worker auf dem VPS mit diesem Stand neu starten; DEMO-Konto, Bot läuft, Markt offen.
          - Auf dem Mac `scripts/features/run.sh live ANA-13` ausführen und die Zeilen „Zeit-Check“ lesen.
          - Per RDP in MT5 unter Werkzeuge → Historie den genannten letzten Deal suchen; in der Marktübersicht die Serverzeit ansehen.
          - Im MT5-Journal und im Bot-Log nachsehen, ob während des Checks etwas passiert ist.
          - Ergebnisse in docs/analyse-regeln.md (Tabelle „Messergebnisse“) eintragen.
        erwartet: Ticket und Uhrzeit des letzten Deals stimmen sekundengenau mit MT5 überein, Tick- und Kerzenzeit passen zur Serverzeit in MT5, der Broker-Abstand ist eine glatte Zahl (z. B. UTC+3) und „verlässlich“. Das Kontomodell ist „hedging“. Im MT5-Journal erscheint keine neue Zeile „authorized on …“, der Bot-Log zeigt keinen Verbindungsabbruch.

  - id: BKT
    titel: Backtest (Musterlösungen, Nachbau, Rechner)
    features:
      - id: BKT-01
        titel: Musterlösungen des Python-Bots
        beschreibung: "28 Szenarien (worker_python/tests/parity/scenarios, erzeugt von make_scenarios.py: Grid BUY/SELL/BOTH, eigener SELL-Abstand, SL, Höchstzahl Positionen und max_positions 0, Ausbruch, step_by_loss mit Kontraktgröße und mit Tick-Wert, Rauschen, Stops Level > 0, Lot unter volume_min, leeres sell_lot_size ohne Sync, Sync ignoriert sell_*, Start außerhalb der Zone ohne clear_on_exit, Zonen-Ausstieg mit Löschen/Schließen/Mum Kapanışı, mit dem UI-Standard (nur BUY, Seite passt nicht), nur SELL schließen und gespeicherter magic, Sofort-Einstieg mit 30-s-Bremse, Fraktal-Ausbruch/-Dönüş mit Puffer-, Gegenfraktal-, ATR- und SAR-SL, zwei Orders je Richtung, TP als Geldbetrag) werden mit dem echten Bot (manage_dynamic_grid) gegen einen FakeMT5 mit simulierter Uhr abgespielt: je Tick erst der Markt (Füllungen, TP/SL), dann ein Bot-Durchlauf. Die Ereignisfolge (place, market, cancel, modify, sltp, close, fill, exit, active; ohne Ticketnummern) ist als Musterlösung gespeichert (tests/parity/golden) und muss gleich bleiben; der Bot-Nachbau im Browser (Schritt 7) wird daran gemessen. Kerzen jedes Zeitrahmens entstehen nur aus Historie und bisherigen Ticks. Die Uhr des Bots (30-s-Bremse, Tick-Frische, Order-Zeitpunkte) läuft über src/core/clock.py, live unverändert die echte Uhr. pyround.json hält Pythons round() für Grenzfälle fest. Bewusste Änderung der Bot-Logik: pytest tests/unit/test_parity_golden.py --update-golden (hooks/RULES.md §4.7)."
        code: [worker_python/tests/parity/runner.py, worker_python/tests/parity/make_scenarios.py, worker_python/src/core/clock.py, worker_python/tests/unit/test_parity_golden.py]
        tiers: [unit]
        pruefung:
          - In worker_python `.venv/bin/python -m pytest tests/unit/test_parity_golden.py -q` ausführen.
        erwartet: Alle Szenarien gleichen ihrer Musterlösung; zweimal abgespielt ergibt dieselbe Folge.

      - id: BKT-09
        titel: Zukunftsdaten-Test
        beschreibung: "Für jedes Szenario werden ab einem Tick k (nach einem und nach zwei Dritteln) alle späteren Kurse verändert. Alle Ereignisse vor k müssen gleich bleiben (docs/analyse-regeln.md §5 „kein Blick in die Zukunft“); danach muss sich etwas ändern, sonst prüft der Test nichts."
        code: [worker_python/tests/parity/runner.py, worker_python/tests/unit/test_parity_golden.py]
        tiers: [unit]
        pruefung:
          - In worker_python `.venv/bin/python -m pytest tests/unit/test_parity_golden.py -q -k spaetere` ausführen.
        erwartet: Grün für alle Szenarien.

      # --- Geplant (offen), Plan: docs/journal/2026-10-06-backtest-module-plan.md; Schritt B1–B9 steht im Titel.
      - id: BKT-02
        titel: Bot-Nachbau Grid im Browser (B2)
        beschreibung: "Die Grid-Logik des Bots (Platzierung, Prüfung, Sofort-Einstieg, Order-Verwaltung, Zonenwahl und -zustand, Orchestrator) als TypeScript in frontend_nextjs/src/lib/backtest/engine/, eine Datei je Python-Modul mit Quelle im Kopf; Grid-Stufen aus src/lib/analysis/levels.ts. Dazu src/lib/backtest/broker/simBroker.ts im Paritätsmodus (Füllung zum Orderpreis wie der FakeMT5). Gemessen an den Musterlösungen aus BKT-01. Die Engine schreibt Log-Codes statt Texte (Übersetzung mit dem Run-Log, B4); Fraktal-Zonen folgen mit B3."
        code: [frontend_nextjs/src/lib/backtest/engine/orchestrator.ts, frontend_nextjs/src/lib/backtest/engine/pyRound.ts, frontend_nextjs/src/lib/backtest/broker/simBroker.ts, frontend_nextjs/src/lib/analysis/levels.ts, frontend_nextjs/e2e/fixtures/parity.ts, worker_python/tests/parity/runner.py]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest e2e/mocked/backtest-grid-parity-lib.spec.ts (ohne Browserseite) mit den 24 Grid-, Exit- und Sofort-Einstieg-Szenarien und pyround.json ausführen.
        erwartet: Jede Ereignisfolge ist gleich der Golden-Datei des Szenarios; je B2.1-Szenario bestätigt ein Wächter, dass es seinen Pfad erreicht (sltp bei Stops Level, mehr als 10 Füllungen bei max_positions 0 …); pyRound gleicht Pythons round() in allen Grenzfällen.

      - id: BKT-03
        titel: Bot-Nachbau Fraktal im Browser (B3, geplant)
        beschreibung: "Fraktal-Signale, Fraktal-Einstieg und Indikatoren (ATR, SAR) des Bots als TypeScript in frontend_nextjs/src/lib/backtest/engine/; Fraktale aus src/lib/analysis/fractals.ts."
        code: [frontend_nextjs/src/lib/analysis/fractals.ts, worker_python/tests/parity/runner.py]
        tiers: [e2e]
        pruefung:
          - Playwright-Logiktest ohne Browserseite (wie BKT-02, e2e/fixtures/parity.ts) mit den 4 Fraktal-Szenarien ausführen.
        erwartet: Jede Ereignisfolge ist gleich der Golden-Datei des Szenarios.

      - id: BKT-04
        titel: Backtest-Rechner mit Kosten (B1 + B4, geplant)
        beschreibung: "Web Worker (src/lib/backtest/backtest.worker.ts) lädt die Kerzen selbst über /rates (next_from, missing), baut höhere Zeitrahmen ohne Zukunftsdaten, spielt jede Kerze über ein Pfadmodell (O→L→H→C / O→H→L→C, optional „SL zuerst“, optional beide Wege) ab und rechnet Kosten: Spread je Kerze (steckt in den Füllpreisen, nur Info), Kommission je Lot (Vorschlag aus /history/deals), Swap an jedem Brokertag-Wechsel nach swap_mode und swap_rollover3days, Gewinn über trade_tick_value_profit/loss. Ausführung „Gap-Ausführung“ (Standard) oder „Parität“. Preise in Float64Array. Fortschritt, Abbruch, veraltete runId wird verworfen; über 1 Mio. Kerzen oder 100.000 Ereignisse je Kerze Abbruch mit Meldung. Der Worker liefert dazu in /symbols die Kostenfelder (trade_calc_mode, trade_tick_value_profit/loss, currency_profit, swap_mode, swap_long, swap_short, swap_rollover3days, spread, trade_stops_level). Testende: realisierter Gewinn, offener G/V, End-Equity, offene Positionen; Hinweis „Margin/Stop-out nicht geprüft“ immer sichtbar."
        code: [worker_python/src/utils/mt5_helpers.py, worker_python/src/utils/mt5_market.py, frontend_nextjs/src/lib/backtest/commission.ts]
        tiers: [unit, api, e2e]
        pruefung:
          - pytest für die Kostenfelder der Symbolliste ausführen.
          - Playwright-Logiktest e2e/mocked/backtest-costs-lib.spec.ts (Kommissions-Vorschlag je Lot, handgerechnet) ausführen.
          - Playwright-Logiktest ohne Browserseite (kommt mit B4) mit den handgerechneten Fällen ausführen (Kauf, Verkauf, Lücke, Swap mit Dreifach-Tag, offener Verlust am Testende).
        erwartet: Alle Kostenfelder sind da (auch im Mock-Worker). Die handgerechneten Fälle stimmen; kein Ereignis wird ohne Meldung übersprungen.

      - id: BKT-05
        titel: CSV-Import von Kursdaten (B9, geplant)
        beschreibung: "Kerzen aus einer CSV-Datei in market.sqlite laden, wenn MT5 nicht genug Historie liefert: POST /market/{id}/imports, PUT …/chunk, POST …/commit, DELETE; Staging, Prüfung (Zeitfolge, OHLC, Zeitzone), source = csv:<import_id>. Überlappung mit vorhandenen Daten nur mit „ersetzen“. Dialog auf /backtest."
        code: [worker_python/src/api/market.py, worker_python/src/utils/market_db.py]
        tiers: [api, e2e]
        pruefung:
          - pytest für den Import-Vorgang (prüfen, abbrechen, ersetzen) ausführen.
          - Auf /backtest eine CSV importieren und im Dialog als Datenquelle wählen.
        erwartet: Ein abgebrochener oder fehlerhafter Import ist nicht wählbar; eine Überlappung geht nur mit „ersetzen“.

      - id: BKT-06
        titel: Seite /backtest mit Setup-Dialog (B5, geplant)
        beschreibung: "Eigene Seite /backtest (Menü „Backtest“), Zustand in der URL (?account=&zone=&setup=). Dialog „Backtest erstellen/bearbeiten“ mit Basis (Konto, Symbol, Zeitraum, Datenauflösung M1/M5/M15/H1, Abdeckung), Kosten, Zone (ZoneFieldsEditor, derselbe Editor wie auf der Zonenseite; Startwert aus Zone, Preset oder leer) und Modell. Ergebnis: StatsKpis + RunSummary, CurveChart (realisiert, Drawdown, Equity), TradesTable mit fertigen MFE/MAE, Laufprotokoll. Der Backtest speichert nie eine Zone (kein POST /settings, kein mergeAndSaveSettings in components/backtest/ und lib/backtest/). Der Backtest-Tab auf /chart entfällt."
        code: [frontend_nextjs/src/components/layout/AppNav.tsx, frontend_nextjs/src/components/zone/ZoneCard.tsx]
        tiers: [e2e]
        pruefung:
          - Menü „Backtest“ öffnen, ein Setup anlegen und testen.
          - Fenster auf 375 px verkleinern.
        erwartet: Der Lauf zeigt KPIs, Kurven, Trades und Laufprotokoll; während des ganzen Ablaufs geht kein POST /settings an den Worker. Bei 375 px ist der Dialog eine Vollbildseite und nichts läuft über.

      - id: BKT-07
        titel: Backtest-Chart mit Wiedergabe (B6, geplant)
        beschreibung: "Chart auf analysis/chart/ChartCore.tsx: Kerzen, Zonenband, Grid-Stufen, Pfeile, TP/SL, Equity-/Balance-Bereich; Wiedergabe 1x/5x/10x/Max; Anzeige-Zeitrahmen. Der Rechen-Worker liefert die Anzeige-Kerzen je Zeitrahmen und Bereich (höchstens etwa 50.000), gerechnet wird mit allen. Lücken sind grau."
        tiers: [e2e]
        pruefung:
          - Einen Lauf über 1 Jahr M1 öffnen, Anzeige-Zeitrahmen wechseln, Wiedergabe starten.
        erwartet: Höchstens 50.000 gezeichnete Kerzen; die Wiedergabe zeigt nie Daten nach dem aktuellen Wiedergabe-Zeitpunkt; Lücken sind grau.

      - id: BKT-08
        titel: Mehrere Setups (B7, geplant)
        beschreibung: "Bis zu 6 Setups auf der Seite, je ein eigener Lauf (runId, Web Worker, Fortschritt), höchstens 2 gleichzeitig. Badges (Symbol, Auflösung, Modus, Abstand, TP, Spread, Lot, Zeitraum, Status) mit Bearbeiten, Duplizieren, In Zone übernehmen, Entfernen. Equity-Kurven überlagerbar; „Aggregiert“ nur bei gleichem Zeitraum und gleicher Kontowährung, sonst aus mit Grund. Ein Kontowechsel leert alle Ergebnisse, die Setups bleiben."
        tiers: [e2e]
        pruefung:
          - Zwei Setups anlegen (eines dupliziert und geändert) und beide laufen lassen.
          - Das Konto wechseln.
        erwartet: Beide Läufe laufen parallel; ein spät fertiger Lauf überschreibt kein anderes Setup. Nach dem Kontowechsel sind keine alten Ergebnisse sichtbar.

      - id: BKT-10
        titel: Hinweise zu Daten und Modell (B5, geplant)
        beschreibung: "Auf /backtest und im Laufprotokoll stehen immer, nicht abschaltbar: Datenlücken (missing), Modellgrenzen (nicht simuliert: Margin/Stop-out, Ablehnungen, verschwundene Orders, Auto-Pause, Teilfüllungen, Remote-Befehle, mehrere Zonen zugleich), „Kosten geschätzt“, Hinweis ab Datenauflösung M5 und „unsicher“, wenn der Grid-Abstand kleiner ist als die mittlere Kerzenspanne der Auflösung."
        tiers: [e2e]
        pruefung:
          - Einen Lauf mit Datenlücke und Auflösung M5 starten.
        erwartet: Lücken-, Modell- und Margin-Hinweis sind sichtbar und lassen sich nicht ausblenden.

      - id: BKT-11
        titel: Backtest-Presets je Benutzer (B8, geplant)
        beschreibung: "Presets (Name, Zone ohne id/magic/is_active, Kosten, Modell, Auflösung, letzter Zeitraum, Symbol, App-Version; keine Ergebnisse) im Worker: Tabelle backtest_presets in market.sqlite mit owner (Principal aus src/api/auth.py); GET/POST /api/backtest/presets, PUT/DELETE /api/backtest/presets/{pid}. Fremde Presets liefern 404. Menü „Presets“: laden als neues Setup, umbenennen, löschen, In Zone übernehmen."
        code: [worker_python/src/utils/market_db.py, worker_python/src/api/auth.py]
        tiers: [api, e2e]
        pruefung:
          - pytest für die Preset-Routen mit zwei Benutzern ausführen.
          - Auf /backtest ein Setup als Preset speichern, Seite neu laden, Preset laden.
        erwartet: Das Preset ist nach dem Neuladen da; das Preset eines anderen Benutzers liefert 404.

      - id: BKT-12
        titel: Zone ↔ Backtest in beide Richtungen (B5 + B8, geplant)
        beschreibung: "Zone → Backtest: Der Test-Knopf in ZoneHeader.tsx legt die Zone (auch ungespeichert, mit Vermerk) in useBacktestHandoffStore (sessionStorage) und öffnet /backtest?account=&zone=; ohne Übergabe gelten die gespeicherten Werte. Backtest → Zone: „In Zone übernehmen“ (Setup-Badge, Preset) mit Zielkonto (nur eigene), „Zone X ersetzen“ (behält id, magic, is_active, sid) oder „als neue Zone“ (neue id, ohne magic und sid, is_active = false); Symbol fehlt → gesperrt; Lots über normalizeZoneLots. Die Werte landen über useZoneTransferStore ungespeichert und als geändert markiert im Dashboard, mit Banner; nichts wird automatisch gespeichert."
        code: [frontend_nextjs/src/components/zone/ZoneHeader.tsx, frontend_nextjs/src/components/ZoneSettingsPanel.tsx]
        tiers: [e2e]
        pruefung:
          - In einer Zone einen Wert ändern (nicht speichern) und den Test-Knopf drücken.
          - Auf /backtest ein Setup „In Zone übernehmen“ → als neue Zone.
        erwartet: Der Backtest-Dialog zeigt den ungespeicherten Wert mit Vermerk. Im Dashboard erscheint die neue Zone inaktiv, als geändert markiert, mit Banner; ohne Klick auf „Speichern“ geht kein POST /settings an den Worker.

      - id: BKT-13
        titel: Setup-Vergleich (B7, geplant)
        beschreibung: "Vergleichstabelle mit den KPIs (computeStats aus src/lib/analysis/stats.ts) aller Setups nebeneinander, Testende (offener G/V, End-Equity) je Setup und Aufteilung je Setup, Wochentag und Stunde über BreakdownTable."
        code: [frontend_nextjs/src/lib/analysis/stats.ts, frontend_nextjs/src/components/analysis/stats/BreakdownTable.tsx]
        tiers: [e2e]
        pruefung:
          - Drei Setups laufen lassen und die Vergleichstabelle öffnen.
        erwartet: Jede Spalte stimmt mit den KPIs des einzeln gewählten Setups überein.
