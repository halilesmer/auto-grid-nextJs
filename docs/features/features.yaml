        beschreibung: "Für jedes Szenario werden ab einem Tick k (nach einem und nach zwei Dritteln) alle späteren Kurse verändert. Alle Ereignisse vor k müssen gleich bleiben (docs/analyse-regeln.md §5 „kein Blick in die Zukunft“); danach muss sich etwas ändern, sonst prüft der Test nichts. TypeScript-Teil (B4, e2e/mocked/backtest-future-lib.spec.ts): dieselbe Prüfung für den Bot-Nachbau an allen Szenarien (eigener fester Zufall; ohne Wirkung ist nur erlaubt, wenn der Bot ab k ohnehin nichts mehr tut) und für den Rechner: Kerzen ab k ändern weder frühere Trades noch frühere Equity (Grid und Fraktal, alle drei Kerzenwege); mitten in der Kerze ändert der zweite Teil des Wegs nichts, was der Bot bis zum ersten Extrem tat."
