# Auto Grid – Funktionskatalog (einzige Quelle der Wahrheit)
#
# Aus dieser Datei wird docs/features/FEATURES.md erzeugt:
#   worker_python/.venv/bin/python scripts/features/update_checklist.py
# FEATURES.md NIE von Hand bearbeiten.
#
# Reihenfolge = Testreihenfolge (Abhängigkeiten zuerst). Kategorien und Features
# werden genau in dieser Reihenfolge getestet und in FEATURES.md angezeigt.
#
# Felder pro Feature:
#   id               eindeutig, Format KAT-NN (wird in Tests als Tag benutzt: @pytest.mark.feature("ENG-05") / tag: '@ENG-05')
#   titel            kurzer Name
#   beschreibung     was die Funktion tut
#   code             wichtigste Dateien (relativ zum Repo-Root)
#   tiers            welche Testebenen das Feature abdecken sollen:
#                      unit    – pytest + FakeMT5 (Mac/CI, ohne MT5)
#                      api     – pytest + FastAPI TestClient (Mac/CI)
#                      e2e     – Playwright gegen gemockten Worker (Mac/CI)
#                      live    – Playwright gegen den echten Worker auf dem VPS (DEMO-Konto)
#                      manuell – braucht eine manuelle Bestätigung (manual_results.yaml)
#   pruefung         Schritte für den manuellen Test
#   erwartet         erwartetes Ergebnis
#   bekannter_fehler (optional) bekannter Defekt; Tests dafür sind als xfail markiert

version: 1

kategorien:

  # ---------------------------------------------------------------------------
  - id: SYS
    titel: Verbindung & Infrastruktur
    features:
      - id: SYS-01
        titel: Worker erreichbar (REST über ngrok)
        beschreibung: Das Frontend erreicht den Worker über NEXT_PUBLIC_API_URL + /api; axios sendet den ngrok-skip-browser-warning-Header.
        code: [frontend_nextjs/src/lib/api.ts, worker_python/main.py]
        tiers: [live]
        pruefung:
          - Worker auf dem VPS starten (start.bat), Frontend lokal starten (npm run dev:frontend).
          - http://localhost:3000 öffnen.
        erwartet: Kontoliste lädt, im Log-Bereich steht der Worker als online.

      - id: SYS-02
        titel: WebSocket-Stream + Reconnect
        beschreibung: Verbindung zu /ws/stream; Nachrichten METRICS, LIVE_DATA, LOG werden in die Stores geleitet; bei Abbruch automatischer Reconnect.
        code: [frontend_nextjs/src/store/useWebSocketManager.ts, worker_python/src/api/ws_server.py]
        tiers: [e2e, live]
        pruefung:
          - Dashboard öffnen, DevTools → Network → WS prüfen.
          - Worker kurz neu starten.
        erwartet: WS verbindet sich, nach dem Neustart verbindet er sich von selbst wieder.

      - id: SYS-03
        titel: Plattform-Erkennung
        beschreibung: GET /system/platform meldet, ob der Worker unter Windows läuft (auch als einfacher Health-Check, siehe docs/NGrok).
        code: [worker_python/src/api/system.py]
        tiers: [api, live]
        pruefung:
          - GET /api/system/platform (mit X-API-Key) über ngrok aufrufen.
        erwartet: 'Antwort {"platform": "win32", "is_windows": true}.'

      - id: SYS-04
        titel: MT5-Terminal-Scanner
        beschreibung: GET /system/scan-mt5 sucht terminal64.exe auf dem VPS; der Konto-Dialog bietet die Pfade zur Auswahl an (Rescan, eigener Pfad).
        code: [worker_python/src/api/system.py, frontend_nextjs/src/components/account/components/MT5PathSelector.tsx, frontend_nextjs/src/components/account/hooks/useMT5Scanner.ts]
        tiers: [api, e2e, live]
        pruefung:
          - „Neues Konto“ öffnen, Feld MT5-Pfad ansehen, „Rescan“ klicken.
          - Checkbox „eigener Pfad“ aktivieren.
        erwartet: Installierte Terminals erscheinen in der Liste; mit „eigener Pfad“ erscheint ein Textfeld.

      - id: SYS-05
        titel: API-Schlüssel (WORKER_API_KEY)
        beschreibung: Ist WORKER_API_KEY auf dem VPS gesetzt, braucht jede /api/*-Anfrage den Header X-API-Key und /ws/stream den Query-Parameter api_key; das Frontend sendet NEXT_PUBLIC_WORKER_API_KEY mit. Ohne Variable bleibt der Worker offen (mit Warnung beim Start).
        code: [worker_python/src/api/auth.py, worker_python/main.py, worker_python/src/api/ws_server.py, frontend_nextjs/src/lib/api.ts]
        tiers: [api, live]
        pruefung:
          - WORKER_API_KEY auf dem VPS setzen, Worker neu starten.
          - Dashboard mit passendem NEXT_PUBLIC_WORKER_API_KEY öffnen; danach die ngrok-URL /api/accounts direkt im Browser aufrufen.
        erwartet: Dashboard funktioniert normal; der direkte Aufruf ohne Schlüssel liefert 401.

      - id: SYS-06
        titel: MT5-Verbindung (Kaltstart, Zeitbudget, Python-Integration)
        beschreibung: Worker (/start, Symbolabfrage) und bot_runner verbinden sich über connect_to_mt5_with_timeout. Das Timeout ist ein Gesamtbudget (Warten auf die MT5-Sperre, initialize-Versuche, Neustart eines hängenden Terminals); danach wird nicht weiter versucht, /start antwortet also nach rund 120 s (+ Login). Bei IPC-Fehlern wird nur ein terminal64.exe desselben Pfads beendet, das älter als 180 s ist; ein startendes Terminal wird abgewartet. Die kurze Symbolabfrage (15 s) beendet nie ein Terminal. -10004 bei initialize heißt „keine IPC-Verbindung“, nicht „falsches Passwort“. Vor initialize wird der Python-Kanal des Terminals geprüft (named pipe MT5.Terminal.<SHA-256 des Pfads>). Ist das Terminal älter als 30 s und hat keinen Kanal, ist in MT5 unter Optionen → Community „Python integration“ abgewählt; dann kommt sofort eine klare Meldung statt 60 s Warten pro Versuch, und kein Terminal wird beendet. Ist der Kanal eines anderen Terminals offen, wird wie bisher verbunden.
        code: [worker_python/src/utils/mt5_helpers.py, worker_python/src/utils/mt5_connection.py, worker_python/src/utils/mt5_errors.py]
        tiers: [unit, manuell]
        pruefung:
          - Auf der Seite „VPS“ den VPS neu starten, MT5 nicht von Hand öffnen.
          - Sobald der Worker erreichbar ist, Konto wählen, eine Zone öffnen (Symbolliste) und sofort „Start Bot“ klicken.
          - "Nur DEMO, Bot vorher stoppen: Per RDP in MT5 Extras → Optionen → Community „Python-Integration“ abwählen, MT5 beenden und neu starten, „Start Bot“ klicken. Danach den Haken wieder setzen und MT5 neu starten."
        erwartet: /start antwortet nach spätestens ~2–3 min (Erfolg oder klare Fehlermeldung). Das Worker-Log zeigt „henüz açılıyor, öldürülmüyor“ statt „Öldürülüyor“ für ein Terminal, das jünger als 180 s ist. Scheitert der erste Start am langsamen Kaltstart, verbindet ein zweiter Start mit demselben Terminal. Ohne Python-Integration scheitert „Start Bot“ nach wenigen Sekunden mit der Meldung „… 'Python integration' kutusunu işaretleyin …“; mit Haken verbindet er in Sekunden.

  # ---------------------------------------------------------------------------
  - id: ACC
    titel: Konten
    features:
      - id: ACC-01
        titel: Kontoliste laden
        beschreibung: GET /accounts liefert alle Konten aus configs/accounts.json; das Dropdown zeigt sie an und schreibt sie in useAccountStore.
        code: [worker_python/src/api/accounts.py, frontend_nextjs/src/components/account/hooks/useAccounts.ts, frontend_nextjs/src/components/account/components/AccountDropdown.tsx]
        tiers: [api, e2e, live]
        pruefung:
          - Dashboard öffnen, Dropdown „Select Account“ aufklappen.
        erwartet: Alle registrierten Konten erscheinen (inkl. DEMO-Testkonto).

      - id: ACC-02
        titel: Konto anlegen + Validierung
        beschreibung: Dialog „New MT5 Account“; Pflichtfelder Name, Login, Passwort, Server, MT5-Pfad; Notizen max. 1000 Zeichen; POST /accounts.
        code: [worker_python/src/api/accounts.py, worker_python/src/api/models.py, frontend_nextjs/src/components/account/components/AccountForm.tsx, frontend_nextjs/src/components/account/hooks/useAccountForm.ts]
        tiers: [api, e2e]
        pruefung:
          - „Add new account“ klicken, leer absenden.
          - "(Nur mit einem Wegwerf-Konto!) Alle Felder ausfüllen und speichern."
        erwartet: Leeres Formular zeigt Pflichtfeld-Fehler; gültiges Konto erscheint danach im Dropdown.

      - id: ACC-03
        titel: Doppelter Login
        beschreibung: Gleicher Login wie ein bestehendes Konto → Rückfrage „bestehendes Konto bearbeiten?“; der Worker antwortet mit 409 (RFC-7807-Problem).
        code: [worker_python/src/api/accounts.py, worker_python/src/api/errors.py, frontend_nextjs/src/components/account/hooks/useAccountForm.ts]
        tiers: [api, e2e]
        pruefung:
          - Neues Konto mit dem Login eines vorhandenen Kontos anlegen.
        erwartet: Browser-Rückfrage erscheint; es entsteht kein zweites Konto.

      - id: ACC-04
        titel: Konto bearbeiten
        beschreibung: PUT /accounts/{id}; gesperrt, solange der Bot läuft.
        code: [worker_python/src/api/accounts.py, frontend_nextjs/src/components/account/components/AccountActions.tsx, frontend_nextjs/src/components/account/components/AccountFormDialog.tsx]
        tiers: [api, e2e]
        pruefung:
          - Konto wählen, „Edit account“, Notiz ändern, speichern.
        erwartet: Änderung bleibt nach Neuladen erhalten; bei laufendem Bot ist der Button deaktiviert.

      - id: ACC-05
        titel: Konto löschen
        beschreibung: DELETE /accounts/{id} nach Bestätigung („Delete Account“); gesperrt, solange der Bot läuft.
        code: [worker_python/src/api/accounts.py, frontend_nextjs/src/components/account/components/AccountActions.tsx]
        tiers: [api, e2e]
        pruefung:
          - "(Nur Wegwerf-Konto!) „Delete account“ → bestätigen."
        erwartet: Konto verschwindet aus dem Dropdown; bei laufendem Bot ist der Button deaktiviert.

      - id: ACC-06
        titel: Kontoauswahl lädt Einstellungen
        beschreibung: Auswahl im Dropdown lädt GET /settings/{id} in useSettingsStore; ohne Konto erscheint der Leerzustand „No account selected“.
        code: [frontend_nextjs/src/components/account/AccountSelector.tsx, frontend_nextjs/src/store/useSettingsStore.ts, frontend_nextjs/src/app/page.tsx]
        tiers: [e2e, live]
        pruefung:
          - Seite ohne Auswahl öffnen, dann das DEMO-Konto wählen.
        erwartet: Zuerst Leerzustand, danach erscheinen Zonen und allgemeine Einstellungen des Kontos.

      - id: ACC-07
        titel: LIVE/TEST-Kennzeichnung
        beschreibung: Badge im Header und im Dropdown aus env_type (DEMO/LIVE) des Kontos.
        code: [frontend_nextjs/src/components/account/components/EnvTypeBadge.tsx, frontend_nextjs/src/app/page.tsx]
        tiers: [e2e]
        pruefung:
          - DEMO-Konto wählen.
        erwartet: Badge zeigt TEST/DEMO, nicht LIVE.

      - id: ACC-08
        titel: LIVE/DEMO-Sicherheitsprüfung
        beschreibung: Ein als LIVE markiertes Konto darf nur mit einem echten, ein DEMO-Konto nur mit einem Demo-Server verbinden – sonst wird die Verbindung verweigert.
        code: [worker_python/src/utils/mt5_errors.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (würde ein falsch markiertes Konto erfordern).
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ACC-09
        titel: Passwort nie in API-Antworten
        beschreibung: Der Worker gibt MT5-Passwörter in keiner Antwort zurück (Liste, Anlegen, Bearbeiten, 409-Problem), sondern nur has_password. Leeres Passwort beim Bearbeiten = unverändert.
        code: [worker_python/src/api/accounts.py, worker_python/src/api/helpers.py, frontend_nextjs/src/components/account/hooks/useAccountForm.ts]
        tiers: [api]
        pruefung:
          - DevTools → Network → Antwort von /api/accounts ansehen.
          - Konto bearbeiten, Passwortfeld leer lassen, speichern.
        erwartet: Kein Feld „password“ in der Antwort; das Konto verbindet sich danach weiterhin (Passwort unverändert).

  # ---------------------------------------------------------------------------
  - id: SET
    titel: Allgemeine Einstellungen
    features:
      - id: SET-01
        titel: Einstellungen laden
        beschreibung: GET /settings/{id} liest configs/settings_{id}*.json (verschachteltes „settings“ wird ausgepackt).
        code: [worker_python/src/api/settings.py, worker_python/src/utils/config.py]
        tiers: [api, e2e, live]
        pruefung:
          - Konto wählen.
        erwartet: Zonen und Kontroll-Intervall entsprechen der Datei auf dem VPS.

      - id: SET-02
        titel: Kontroll-Intervall (LOOP_INTERVAL_SECONDS)
        beschreibung: Stepper „Kontrol Sıklığı“ 1–60 s in 0,1er-Schritten; „Kaydet“ ist nur bei Änderung aktiv.
        code: [frontend_nextjs/src/components/SettingsForm.tsx, worker_python/src/core/loop.py]
        tiers: [e2e]
        pruefung:
          - Mit −/+ den Wert ändern, 0 und 61 eintippen, speichern, neu laden.
        erwartet: Werte außerhalb 1–60 werden begrenzt; gespeicherter Wert bleibt nach Neuladen.

      - id: SET-03
        titel: „Alle speichern“ + Dirty-Tracking
        beschreibung: Bei ungespeicherten Änderungen erscheint die schwebende Leiste „Kaydedilmemiş değişiklikler var“; „Tüm Ayarları Kaydet“ speichert alles (is_active wird beim Vergleich ignoriert).
        code: [frontend_nextjs/src/components/dashboard/SaveSettingsBar.tsx, frontend_nextjs/src/store/useSettingsStore.ts]
        tiers: [e2e]
        pruefung:
          - Ein Zonenfeld ändern → Leiste prüfen → „Kaydet“.
        erwartet: Leiste erscheint, Button zeigt „Kaydediliyor…“ → „Kaydedildi“, Leiste verschwindet.

      - id: SET-04
        titel: Werte bereinigen (Sanitizing)
        beschreibung: Der Worker rundet Gleitkommazahlen beim Speichern (sanitize_settings).
        code: [worker_python/src/utils/config.py, worker_python/src/api/settings.py]
        tiers: [unit, api]
        pruefung:
          - Lot 0.0100000001 eingeben und speichern.
        erwartet: Gespeichert wird 0.01.

      - id: SET-05
        titel: Einstellungen zusammenführen (Merge)
        beschreibung: POST /settings/{id} führt die neuen Werte mit der bestehenden Datei zusammen, statt sie zu überschreiben.
        code: [worker_python/src/api/settings.py]
        tiers: [api]
        pruefung:
          - Nur das Intervall speichern.
        erwartet: Zonen bleiben unverändert.

      - id: SET-06
        titel: Standardwerte (neue Datei, fehlende Zonenfelder)
        beschreibung: Eine neue Einstellungsdatei enthält nur LOOP_INTERVAL_SECONDS und ZONES. Fehlt einer Zone ein Feld, nimmt die Engine dieselben Standardwerte wie eine neue Zone im UI (defaultZone). Die früheren GLOBAL_*-Schlüssel wurden nie gelesen und sind entfernt.
        code: [worker_python/src/utils/config.py, worker_python/src/core/grid_execution/config.py, frontend_nextjs/src/utils/zoneHelpers.ts]
        tiers: [unit]
        pruefung:
          - Nicht manuell testbar.
        erwartet: Engine- und UI-Standardwerte stimmen überein; keine ungenutzten Schlüssel in neuen Dateien.

  # ---------------------------------------------------------------------------
  - id: SYM
    titel: Symbole
    features:
      - id: SYM-01
        titel: Symbolliste + Cache
        beschreibung: GET /symbols/{id} liefert Broker-Symbole aus broker_symbols.json; 1-h-Cache, bei Ablauf wird die alte Liste geliefert und im Hintergrund aktualisiert (doppelte Anfragen werden zusammengelegt). Solange /start oder /stop für das Konto läuft, verbindet sich die Abfrage nicht selbst mit MT5 (alte Liste bzw. leer); /start füllt den Cache.
        code: [worker_python/src/api/symbols.py, worker_python/src/utils/mt5_helpers.py]
        tiers: [unit, api, live]
        pruefung:
          - Zone öffnen, ins Symbolfeld klicken.
        erwartet: Symbolliste des Brokers erscheint schnell (auch bei wiederholtem Öffnen).

      - id: SYM-02
        titel: Symbol-Autocomplete
        beschreibung: Feld „Sembol Ara…“ filtert die Symbolliste beim Tippen.
        code: [frontend_nextjs/src/components/SymbolAutoComplete.tsx]
        tiers: [e2e]
        pruefung:
          - "„XAU“ tippen und einen Vorschlag wählen."
        erwartet: Nur passende Symbole erscheinen; Auswahl übernimmt das Symbol.

      - id: SYM-03
        titel: Symboldetails
        beschreibung: Zu einem Symbol werden Details (Digits, Point, Volumen-Grenzen) geladen; daraus leiten die Zonenfelder Schrittweite, Minimum und Rundung ab, und unbekannte Symbole werden als „Geçersiz Sembol!“ markiert.
        code: [frontend_nextjs/src/hooks/useSymbolDetails.ts, frontend_nextjs/src/utils/zoneHelpers.ts, frontend_nextjs/src/services/zoneApi.ts]
        tiers: [e2e]
        pruefung:
          - Symbol wählen, Schrittweite der Preis- und Lotfelder prüfen (Pfeiltasten / DevTools).
          - Ein unbekanntes Symbol eintippen (nicht speichern).
        erwartet: Preisfelder in Schritten von point (z. B. 0,001 bei 3 Digits), Lot mit volume_min/volume_step; unbekanntes Symbol zeigt „Geçersiz Sembol!“.

  # ---------------------------------------------------------------------------
  - id: ZON
    titel: Zonen-Konfiguration (UI ↔ Backend)
    features:
      - id: ZON-01
        titel: Zone hinzufügen
        beschreibung: „Bölge Ekle“ fügt eine neue Zone mit Standardwerten hinzu; die Anzahl im Badge steigt.
        code: [frontend_nextjs/src/components/ZoneSettingsPanel.tsx, frontend_nextjs/src/hooks/useZoneActions.ts, frontend_nextjs/src/utils/zoneHelpers.ts]
        tiers: [e2e]
        pruefung:
          - „Bölge Ekle“ klicken, speichern, neu laden.
        erwartet: Neue Zone bleibt nach dem Neuladen erhalten.

      - id: ZON-02
        titel: Zone löschen
        beschreibung: Menü „…“ → „Bölgeyi Sil“ → Bestätigung „Bölge Sil“.
        code: [frontend_nextjs/src/components/zone/ZoneHeader.tsx, frontend_nextjs/src/components/ZoneSettingsPanel.tsx]
        tiers: [e2e]
        pruefung:
          - Test-Zone löschen und bestätigen, speichern.
        erwartet: Zone ist weg, auch nach Neuladen.

      - id: ZON-03
        titel: Basisfelder (Symbol, Emir Tipi, Min/Max Fiyat)
        beschreibung: Symbol, Ordertyp BUY/SELL/BOTH und Preisbereich der Zone.
        code: [frontend_nextjs/src/components/zone/ZoneBasicFields.tsx]
        tiers: [e2e]
        pruefung:
          - Jedes Feld ändern, speichern, neu laden.
        erwartet: Alle Werte bleiben erhalten; Ordertyp-Badge im Kopf passt.

      - id: ZON-04
        titel: Grid-Felder (Grid Adımı, Lot, Kar Al, Zarar Durdur)
        beschreibung: Gridabstand, Lotgröße, Take Profit, Stop Loss der Zone.
        code: [frontend_nextjs/src/components/zone/ZoneGridFields.tsx, worker_python/src/core/grid_execution/config.py]
        tiers: [e2e]
        pruefung:
          - Jedes Feld ändern, speichern, neu laden.
        erwartet: Alle Werte bleiben erhalten.

      - id: ZON-05
        titel: SELL-Felder + BUY/SELL-Sync
        beschreibung: Bei Ordertyp BOTH eigene SELL-Werte (SELL Grid/Lot/KA/ZD) oder Schalter „BUY ve SELL için aynı ayarları uygula“.
        code: [frontend_nextjs/src/components/zone/ZoneSellFields.tsx, frontend_nextjs/src/components/zone/ZoneCard.tsx]
        tiers: [e2e]
        pruefung:
          - Ordertyp BOTH wählen, Sync aus → SELL-Felder ändern; Sync an.
        erwartet: SELL-Felder erscheinen nur bei BOTH und Sync aus; Werte bleiben nach Speichern erhalten.

      - id: ZON-06
        titel: Breakout-Felder
        beschreibung: Schalter „Sadece trend yönünde“, Pullback-Abstände, Alt/Üst Seviyeler (levels_below/above), Maks Pozisyon.
        code: [frontend_nextjs/src/components/zone/ZoneBreakoutFields.tsx]
        tiers: [e2e]
        pruefung:
          - Breakout einschalten, Felder ändern, speichern, neu laden.
        erwartet: Alle Werte bleiben erhalten.

      - id: ZON-07
        titel: Exit-Felder (Bereinigen beim Verlassen)
        beschreibung: Schalter „Fiyat bölgeden çıkınca temizle“; dann Çıkış Yönü, Hedef Taraf, Temizleme Kapsamı, Çıkış Tetikleyici und bei „Mum Kapanışı“ zusätzlich Zaman Dilimi.
        code: [frontend_nextjs/src/components/zone/ZoneExitFields.tsx]
        tiers: [e2e]
        pruefung:
          - Schalter an → Auswahlfelder prüfen; Auslöser „Mum Kapanışı“ wählen.
        erwartet: Die vier Auswahlfelder erscheinen erst mit dem Schalter; Zeitrahmen nur bei Kerzenschluss.

      - id: ZON-08
        titel: Start/Pause pro Zone
        beschreibung: Button im Zonenkopf (Başladı / Başla / Hazır / Kapalı) setzt is_active (POST /settings) und START/PAUSE in ui_state (POST /ui-state); Warnung bei ungültigem Symbol oder ungespeicherter Zone.
        code: [frontend_nextjs/src/components/zone/ZoneHeader.tsx, frontend_nextjs/src/services/zoneApi.ts, worker_python/src/api/ui_state.py]
        tiers: [api, e2e, live]
        pruefung:
          - Test-Zone starten und wieder pausieren.
          - Neue, ungespeicherte Zone starten.
        erwartet: Label wechselt passend; ungespeicherte Zone zeigt eine Warnung.

      - id: ZON-09
        titel: „Kaydedilmedi“-Badge
        beschreibung: Zonen mit ungespeicherten Änderungen tragen den Badge „Kaydedilmedi“.
        code: [frontend_nextjs/src/hooks/useZoneDirtyTracking.ts, frontend_nextjs/src/components/zone/ZoneHeader.tsx]
        tiers: [e2e]
        pruefung:
          - Ein Feld ändern, dann speichern.
        erwartet: Badge erscheint nach der Änderung und verschwindet nach dem Speichern.

      - id: ZON-10
        titel: Zahlenfelder leerbar
        beschreibung: Zahlenfelder der Zone (Preis, Grid, Lot, KA/ZD, Pullback, Seviyeler) halten einen lokalen Text-Entwurf; die letzte Ziffer lässt sich löschen, erst beim Verlassen des Feldes erscheint wieder der echte Wert.
        code: [frontend_nextjs/src/components/ui/NumberInput.tsx, frontend_nextjs/src/hooks/useZoneFieldHandlers.ts]
        tiers: [e2e]
        pruefung:
          - Ein Zahlenfeld mit Rücktaste komplett leeren, dann neu tippen (z. B. 0.05) und das Feld verlassen.
        erwartet: Feld bleibt beim Löschen leer, Zwischenstände wie „0.“ bleiben erhalten, nach dem Verlassen steht der gespeicherte Wert (leer → 0).

      - id: ZON-11
        titel: Einzelne Zone speichern
        beschreibung: Jede Zonenkarte hat einen eigenen „Kaydet“-Button, der nur diese Zone im Worker ersetzt (neue Zone wird angehängt). Andere Zonen und Einstellungen mit ungespeicherten Änderungen bleiben ungespeichert; „Tüm Ayarları Kaydet“ (neben „Bölge Ekle“) speichert weiterhin alles.
        code: [frontend_nextjs/src/hooks/useZoneActions.ts, frontend_nextjs/src/services/zoneApi.ts, frontend_nextjs/src/components/zone/ZoneHeader.tsx, frontend_nextjs/src/app/hooks/useDashboard.ts]
        tiers: [e2e]
        pruefung:
          - Zone 1 ändern, Zone hinzufügen, nur bei der neuen Zone „Kaydet“ klicken.
          - Danach bei Zone 1 „Kaydet“ klicken.
        erwartet: Nach dem ersten Klick liegt die neue Zone im Worker, Zone 1 trägt weiter „Kaydedilmedi“ und „Tüm Ayarları Kaydet“ bleibt aktiv; nach dem zweiten Klick sind Badge und Dirty-Zustand weg.

      - id: ZON-12
        titel: Symbol-Richtwerte in den Hinweisen
        beschreibung: Der (i)-Hinweis von Grid-Abstand und Take Profit (Buy/Sell) nennt für gängige Symbole (Gold, Silber, Forex, BTC/ETH, US-Indizes, Öl) einen Richtwert; bei unbekanntem Symbol bleibt der Text unverändert. Nur Anzeige, keine Validierung.
        code: [frontend_nextjs/src/utils/symbolGuidance.ts, frontend_nextjs/src/components/zone/useGuidedHints.ts, frontend_nextjs/src/components/zone/ZoneGridFields.tsx, frontend_nextjs/src/components/zone/ZoneSellFields.tsx]
        tiers: [e2e]
        pruefung:
          - Symbol auf XAUUSD stellen, mit der Maus über das (i) von Grid-Abstand und Take Profit fahren.
          - Symbol auf ein unbekanntes Symbol stellen.
        erwartet: Bei XAUUSD steht „1–5“ als Richtwert im Hinweis; bei unbekanntem Symbol nur der Standardtext.

  # ---------------------------------------------------------------------------
  - id: BOT
    titel: Bot-Steuerung
    features:
      - id: BOT-01
        titel: Bot starten
        beschreibung: POST /start verbindet MT5 (Timeout 120 s), cached die Symbole, startet bot_runner.py als eigenen Prozess und stellt ihn unter Watchdog. UI-Timeout für „Connecting“ 180 s.
        code: [worker_python/src/api/bot_control.py, worker_python/src/utils/bot_manager.py, worker_python/src/core/bot_runner.py, frontend_nextjs/src/components/BotControls.tsx]
        tiers: [live]
        pruefung:
          - DEMO-Konto wählen, „Start Bot“.
        erwartet: Status wechselt über „Connecting“ zu „Running“, Markt offen/geschlossen wird angezeigt.

      - id: BOT-02
        titel: Bot stoppen
        beschreibung: POST /stop nimmt den Bot aus dem Watchdog und beendet den Prozess; Positionen und Orders bleiben unangetastet. Bestätigung „Disconnect MT5“.
        code: [worker_python/src/api/bot_control.py, worker_python/src/utils/bot_manager.py, frontend_nextjs/src/components/BotControls.tsx]
        tiers: [live]
        pruefung:
          - „Stop Bot“ → bestätigen; in MT5 die offenen Positionen prüfen.
        erwartet: Status „Stopped“; Positionen sind noch da.

      - id: BOT-03
        titel: Neustart veralteter/hängender Bot
        beschreibung: Läuft ein Bot mit alter VERSION oder ohne frische Metriken (> 180 s), startet /start ihn neu; beim Worker-Start übernimmt startup_maintenance laufende Bots.
        code: [worker_python/src/api/bot_control.py, worker_python/src/utils/bot_manager.py]
        tiers: [unit]
        pruefung:
          - Nach einem Update „Restart Bot“ klicken.
        erwartet: Bot läuft danach mit der neuen Version (PID-Datei enthält neue VERSION).

      - id: BOT-04
        titel: Statusanzeige + Alarme
        beschreibung: Anzeige Connecting / Running / „process without MT5“ / Stopped, Marktstatus, Kontoname/Server; Alarme für API-Fehler, MT5-Verbindung, abgelehnte Order, Algo Trading aus.
        code: [frontend_nextjs/src/components/BotControls.tsx, frontend_nextjs/src/store/useBotRuntimeStore.ts]
        tiers: [e2e]
        pruefung:
          - In MT5 „Algo Trading“ ausschalten, während der Bot läuft.
        erwartet: Alarm „Algo Trading off“ erscheint; nach Einschalten verschwindet er.

      - id: BOT-05
        titel: Watchdog-Neustart
        beschreibung: Alle 15 s Prüfung; abgestürzter oder hängender Bot (600 s ohne Metriken) wird mit Backoff 15/30/60/120/240 s neu gestartet.
        code: [worker_python/src/utils/bot_watchdog.py]
        tiers: [unit]
        pruefung:
          - Auf dem VPS den bot_runner-Prozess im Task-Manager beenden.
        erwartet: Nach ≤ 30 s läuft der Bot wieder (Robot-Log zeigt Neustart).

      - id: BOT-06
        titel: Watchdog gibt auf
        beschreibung: Nach 5 Neustarts in 30 min hört der Watchdog auf; gelöschte Konten werden nicht mehr beobachtet.
        code: [worker_python/src/utils/bot_watchdog.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: BOT-07
        titel: Bots nach Worker-/VPS-Neustart fortsetzen
        beschreibung: Die Watchdog-Liste (Start ohne Stop) steht zusätzlich in data/watched_bots.json. Beim Worker-Start liest main.py sie ein; startup_maintenance startet jeden dort eingetragenen, nicht laufenden Bot neu (auch LIVE) und stellt ihn unter Watchdog, auch wenn der erste Start scheitert. Gestoppte Bots, gelöschte Konten und Bots, bei denen der Watchdog aufgegeben hat, fehlen in der Liste.
        code: [worker_python/src/utils/bot_watchdog.py, worker_python/src/api/bot_control.py, worker_python/main.py, worker_python/src/utils/paths.py]
        tiers: [unit, manuell]
        pruefung:
          - DEMO-Bot starten, dann auf der Seite „VPS“ → „VPS neu starten“.
        erwartet: Nach dem Reboot läuft der Bot wieder; das Robot-Log zeigt „[AUTO] Bot … devam ettirildi“.

  # ---------------------------------------------------------------------------
  - id: ENG
    titel: Grid-Engine (Handelslogik)
    features:
      - id: ENG-01
        titel: Zonenwahl
        beschreibung: Pro Symbol ist höchstens eine Zone aktiv – die erste aktive Zone dieses Symbols, deren Mittelkurs (oder Schlusskurs der letzten Kerze bei „Mum Kapanışı“, Zeitrahmen exit_timeframe) in [min_price, max_price] liegt. Zonen mit verschiedenen Symbolen (z. B. USOUSD + XAUUSD) laufen gleichzeitig.
        code: [worker_python/src/core/grid_zone_selector.py]
        tiers: [unit]
        pruefung:
          - Zwei Zonen mit verschiedenen Bereichen anlegen, Bot laufen lassen.
          - Eine zweite Zone mit anderem Symbol anlegen und starten.
        erwartet: Beim gleichen Symbol entstehen Orders nur in der Zone, in der der Preis liegt; eine Zone mit anderem Symbol bekommt zusätzlich eigene Orders.

      - id: ENG-02
        titel: Sliding-Grid-Level
        beschreibung: Level werden an round(mid/step)*step verankert, levels_below/levels_above Stufen, auf die Zone begrenzt; acceptable-Sets mit ±2 Stufen Puffer.
        code: [worker_python/src/core/grid_execution/levels.py]
        tiers: [unit]
        pruefung:
          - Bot laufen lassen, Pending Orders in MT5 ansehen.
        erwartet: Orders liegen im Gridabstand um den Preis, nie außerhalb der Zone.

      - id: ENG-03
        titel: Breakout / Pullback
        beschreibung: Im Breakout-Modus nur Orders in Trendrichtung, mit pullback_distance / sell_pullback_distance.
        code: [worker_python/src/core/grid_execution/levels.py]
        tiers: [unit]
        pruefung:
          - Breakout-Zone aktivieren, Orders ansehen.
        erwartet: Orders nur in Trendrichtung und im Pullback-Abstand.

      - id: ENG-04
        titel: Zonen-Config lesen + Lot begrenzen
        beschreibung: extract_zone_config liest order_type, grid_step, lot_size (auf 0,01–5,0 begrenzt), TP/SL, Symbol, sync_buy_sell, sell_*-Overrides, max_positions, is_active.
        code: [worker_python/src/core/grid_execution/config.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-05
        titel: Order-Platzierung LIMIT/STOP + TP/SL
        beschreibung: Fehlende Level bekommen Pending Orders mit TP/SL; LIMIT oder STOP je nach Seite des Marktes; Toleranz 0,45 × Gridabstand; manuelle Positionen zählen als belegte Level.
        code: [worker_python/src/core/grid_execution/placement.py, worker_python/src/core/grid_orders.py]
        tiers: [unit, live]
        pruefung:
          - Test-Zone (0,01 Lot) um den aktuellen Preis starten.
        erwartet: BUY LIMIT unter / BUY STOP über dem Preis (bzw. SELL umgekehrt), jeweils mit TP/SL.

      - id: ENG-06
        titel: Validierung + Bereinigung
        beschreibung: Orders außerhalb des Fensters oder mit falschem Lot/TP/SL werden gelöscht (erwartetes Lot berücksichtigt Teilausführungen).
        code: [worker_python/src/core/grid_execution/validation.py]
        tiers: [unit]
        pruefung:
          - Bei laufendem Bot TP der Zone ändern und speichern.
        erwartet: Alte Orders werden gelöscht und mit neuem TP neu gesetzt.

      - id: ENG-07
        titel: Maximale Positionen
        beschreibung: Ist max_positions erreicht, werden die Pending Orders der Zone gelöscht; die Warnung erscheint einmal (erneut nur, wenn sich die Zahl ändert), nicht bei jedem Tick. Auch der Restlot-Nachschub (ENG-08) setzt dann nichts.
        code: [worker_python/src/core/grid_execution/handler.py]
        tiers: [unit, live]
        pruefung:
          - Maks Pozisyon = 1 setzen und eine Position füllen lassen.
        erwartet: Danach keine Pending Orders mehr in dieser Zone.

      - id: ENG-08
        titel: Teilausführung + TP/SL-Resync
        beschreibung: Geänderte TP/SL-Werte werden auf offene Positionen übertragen; liegt der neue TP/SL schon auf der falschen Seite des Kurses (MT5 würde mit 10016 ablehnen), wartet der Bot mit einer einmaligen Meldung und setzt ihn, sobald der Kurs es zulässt. Bei Teilausführung wird das Restlot neu gesendet, gemessen am Volumen der eröffnenden Order (history_orders_get), nicht am Lot in den Einstellungen; ein später erhöhtes Lot löst also keinen Nachschub aus. Am Positionslimit (ENG-07) kein Nachschub.
        code: [worker_python/src/core/grid_order_manager.py, worker_python/src/core/grid_orders.py, worker_python/src/core/grid_execution/validation.py]
        tiers: [unit]
        pruefung:
          - Bei offener Position den TP der Zone ändern und speichern.
          - "Nur DEMO: bei offenen 0,01-Positionen das Lot der Zone auf 0,02 erhöhen und speichern."
        erwartet: TP der offenen Position wird angepasst (liegt er schon hinter dem Kurs, steht einmal „TP/SL Bekliyor“ im Log). Nach der Lot-Erhöhung keine „Kısmi Dolum“-Meldungen und keine Orders auf den Leveln der offenen Positionen; neue Grid-Orders haben 0,02.

      - id: ENG-09
        titel: Zombie-Orders entfernen
        beschreibung: Orders pausierter, bereinigter, inaktiver Zonen oder mit falschem Symbol werden gelöscht.
        code: [worker_python/src/core/grid_order_manager.py]
        tiers: [unit]
        pruefung:
          - Zone mit offenen Orders pausieren.
        erwartet: Ihre Pending Orders verschwinden.

      - id: ENG-10
        titel: Bereinigung beim Verlassen der Zone
        beschreibung: "Mit clear_on_exit: Richtung (clear_exit_side), Umfang („Sadece Bekleyen Emirler“ oder „Tüm İşlemler“ = auch Positionen schließen) und Zielseite (BUY/SELL/alle). Danach steht die Zone auf AUTO_CLEAR: keine neuen Orders – auch nicht, wenn der Kurs zurückkommt – bis „Yeniden Başlat“ im Dashboard (oder Bot-Neustart)."
        code: [worker_python/src/core/grid_order_manager.py, worker_python/src/core/grid_orchestrator.py, worker_python/src/core/grid_zone_selector.py, frontend_nextjs/src/components/zone/ZoneHeader.tsx]
        tiers: [unit, live]
        pruefung:
          - Test-Zone knapp um den Preis legen, „temizle“ an, warten bis der Preis sie verlässt.
          - Warten, bis der Preis zurückkommt; dann „Yeniden Başlat“ in der Zone klicken.
        erwartet: Orders (bei „Tüm İşlemler“ auch Positionen) werden entfernt; die Zone zeigt „Otomatik temizlendi“ und setzt keine Orders mehr, bis „Yeniden Başlat“ geklickt wird.
      - id: ENG-11
        titel: Auto-Pause nach 3 Ablehnungen
        beschreibung: Nach 3 abgelehnten Orders in Folge wird die Zone pausiert (ui_state PAUSE) und order_rejected_alarm gesetzt.
        code: [worker_python/src/core/grid_orders.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-12
        titel: Order-Sicherheit (Stops-Level, order_check, 10027)
        beschreibung: safe_send_order normalisiert Volumen, hält den Broker-Stops-Level ein (vermeidet 10016), prüft vorab mit order_check, erkennt 10027 (Algo Trading aus) und prüft, ob die Order wirklich existiert.
        code: [worker_python/src/utils/trade_utils.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: ENG-13
        titel: Fernsteuerung per MT5-Handy-App
        beschreibung: "Manuelle BUY LIMIT 0,01 Lot bei 1 $ = STOP, bei 2 $ = START; alternativ Kommentar GRID:STOP / GRID:START. STOP löscht alle Robot-Orders; die Signal-Order wird danach entfernt."
        code: [worker_python/src/core/grid_remote.py]
        tiers: [unit, manuell]
        pruefung:
          - In der MT5-App eine BUY LIMIT 0,01 bei Preis 1 setzen.
          - Danach BUY LIMIT 0,01 bei Preis 2 setzen.
        erwartet: Erst werden alle Robot-Orders gelöscht (remote_paused), dann läuft der Bot weiter; die Signal-Orders verschwinden.

      - id: ENG-14
        titel: Zustand beim Start wiederherstellen
        beschreibung: Beim Bot-Start sind alle Zonen PAUSE; active_zones_state wird aus den Magic-Numbers der vorhandenen Orders/Positionen aufgebaut (data/state_<id>.json), alte ui_state-Datei gelöscht.
        code: [worker_python/src/core/startup.py, worker_python/src/utils/state_manager.py, worker_python/src/core/bot_runner.py]
        tiers: [unit]
        pruefung:
          - Bot mit offenen Orders stoppen und neu starten.
        erwartet: Vorhandene Orders werden übernommen, nicht doppelt gesetzt.

      - id: ENG-15
        titel: Markt geschlossen + Reconnect
        beschreibung: Bei geschlossenem Markt (trade_mode ≠ 4 oder Tick älter als 180 s) wartet die Schleife 60 s; Verbindungsverlust → Reconnect mit exponentiellem Backoff; nur „Algo Trading aus“ → warten statt neu einloggen.
        code: [worker_python/src/core/loop.py, worker_python/src/core/reconnection.py, worker_python/src/core/grid_helpers.py]
        tiers: [unit]
        pruefung:
          - Am Wochenende Dashboard ansehen.
        erwartet: Markt wird als geschlossen angezeigt, keine neuen Orders.

      - id: ENG-16
        titel: Aufräumen beim Beenden der Schleife
        beschreibung: Beim Verlassen der Hauptschleife werden alle Pending Orders des Robots gelöscht.
        code: [worker_python/src/core/loop.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen (/stop beendet den Prozess hart).
        erwartet: Abgedeckt durch Unit-Tests.

  # ---------------------------------------------------------------------------
  - id: MET
    titel: Live-Daten & Diagramm
    features:
      - id: MET-01
        titel: Kennzahlenleiste
        beschreibung: Vier Kacheln Preis, Floating P/L, Offene Positionen, Pending Orders mit animierten Ziffern.
        code: [frontend_nextjs/src/components/dashboard/MetricsStrip.tsx]
        tiers: [e2e, live]
        pruefung:
          - Bot laufen lassen, Werte mit MT5 vergleichen.
        erwartet: Werte stimmen mit MT5 überein und aktualisieren sich.

      - id: MET-02
        titel: Chart (10-s-Kerzen + RSI)
        beschreibung: lightweight-charts baut 10-s-Kerzen aus WebSocket-METRICS, RSI auf eigener Skala; Farben folgen dem Theme.
        code: [frontend_nextjs/src/components/ChartViewer.tsx]
        tiers: [e2e]
        pruefung:
          - /formasyon öffnen und 1 Minute warten.
        erwartet: Kerzen und RSI-Linie entstehen.

      - id: MET-03
        titel: WebSocket-Metriken des Workers
        beschreibung: ws_server sendet jede Sekunde Preis, RSI, MACD, P/L, Positionen für das erste Konto / Zone 0.
        code: [worker_python/src/api/ws_server.py, worker_python/src/core/indicator_calc.py]
        tiers: [unit, live]
        pruefung:
          - DevTools → WS-Nachrichten ansehen.
        erwartet: Jede Sekunde eine METRICS-Nachricht mit Preis und RSI.

      - id: MET-04
        titel: Bot-Telemetrie
        beschreibung: calculate_live_metrics exportiert P/L, Positions-/Orderzahl, Preis, Alarme (algo_trading_error, order_rejected_alarm, last_error, remote_paused, connection_lost), market_open und die Zonen-Zustände der Engine (zone_states) nach met_<id>.json.
        code: [worker_python/src/core/grid_metrics.py, worker_python/src/core/bot_runner.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

  # ---------------------------------------------------------------------------
  - id: LOG
    titel: Logs
    features:
      - id: LOG-01
        titel: Log-Tabs laden
        beschreibung: Tabs Activity, Robot Logs, MT5 Terminal; GET /logs/{id}?log_type=all&lines=200; ohne laufenden Bot wird mt5_connected=false erzwungen.
        code: [frontend_nextjs/src/components/LogViewer.tsx, worker_python/src/api/logs.py]
        tiers: [api, e2e, live]
        pruefung:
          - Alle drei Tabs öffnen, „Refresh“.
        erwartet: Jeder Tab zeigt seine Logs.

      - id: LOG-02
        titel: Logs löschen
        beschreibung: Activity wird nur lokal geleert; Robot/MT5 nach Rückfrage per DELETE /logs/{id}.
        code: [frontend_nextjs/src/components/LogViewer.tsx, worker_python/src/api/logs.py]
        tiers: [api, e2e]
        pruefung:
          - Im Tab Robot Logs „Clear“ → bestätigen.
        erwartet: Log ist leer, auch nach Refresh.

      - id: LOG-03
        titel: Logs als ZIP herunterladen
        beschreibung: GET /logs/download/{id} liefert ein ZIP mit Logs, State- und Settings-Datei.
        code: [frontend_nextjs/src/lib/downloadLogs.ts, worker_python/src/api/logs.py]
        tiers: [api, e2e]
        pruefung:
          - „Download log file“ klicken, ZIP öffnen.
        erwartet: ZIP enthält Logs, state_<id>.json und settings-Datei.

      - id: LOG-04
        titel: Worker-Status + Polling
        beschreibung: Anzeige Worker online/offline; Abfrage alle 10 s (beim Verbinden alle 2 s).
        code: [frontend_nextjs/src/components/LogViewer.tsx, frontend_nextjs/src/store/useLogsStore.ts]
        tiers: [e2e]
        pruefung:
          - Worker auf dem VPS stoppen.
        erwartet: Status wechselt nach ≤ 10 s auf offline.

      - id: LOG-05
        titel: Robot-Log schreiben
        beschreibung: Der Bot-Prozess schreibt seine Meldungen (log_message) nach logs/<id>/err_<id>.log.
        code: [worker_python/src/core/grid_helpers.py, worker_python/src/utils/bot_manager.py]
        tiers: [unit, manuell]
        pruefung:
          - Tab „Robot Logs“ öffnen und die letzten Zeilen ansehen.
        erwartet: Jede Meldung genau einmal, keine abgeschnittenen Zeilen.

      - id: LOG-06
        titel: MT5-Terminal-Log anzeigen
        beschreibung: Der Tab „MT5 Terminal“ zeigt das Tages-Log des MT5-Terminals, das beim Verbinden nach logs/<id>/mt5_terminal/ kopiert wird.
        code: [worker_python/src/api/logs.py, worker_python/src/utils/mt5_helpers.py]
        tiers: [api, manuell]
        pruefung:
          - Tab „MT5 Terminal“ öffnen.
        erwartet: Zeilen aus MT5_Terminal_<Datum>.log erscheinen.

  # ---------------------------------------------------------------------------
  - id: UPD
    titel: System & Updates
    features:
      - id: UPD-01
        titel: Update-Prüfung
        beschreibung: „System Info“ → „Check for Updates“; GET /system/update/check vergleicht Git-Hash und VERSION mit origin/main.
        code: [worker_python/src/api/system.py, worker_python/src/utils/self_updater.py, frontend_nextjs/src/components/dashboard/UpdateModal.tsx]
        tiers: [api, e2e]
        pruefung:
          - „Check for Updates“ klicken.
        erwartet: „You are up to date“ oder alte → neue Version.

      - id: UPD-02
        titel: Update anwenden
        beschreibung: „Apply Update (git pull)“ → POST /system/update (stash nur bei lokalen Änderungen, pull, stash pop), danach Seiten-Reload. Scheitert der Pull (z. B. Datei gesperrt oder ohne Schreibrecht), wird der Stand davor wiederhergestellt – keine halb aktualisierten Dateien, der Stash wird zurückgespielt.
        code: [worker_python/src/api/system.py, worker_python/src/utils/self_updater.py]
        tiers: [unit, e2e, manuell]
        pruefung:
          - Nach einem Merge auf main das Update im Dashboard anwenden (Zahnrad → Check for Updates → Apply Update).
        erwartet: VERSION auf dem VPS entspricht main; nach einem Fehler zeigt git status keine geänderten Dateien und git stash list keinen neuen Eintrag.

      - id: UPD-03
        titel: System herunterfahren
        beschreibung: Power-Button → Bestätigung → /stop, danach window.close().
        code: [frontend_nextjs/src/app/hooks/useDashboard.ts, frontend_nextjs/src/components/ConfirmModal.tsx]
        tiers: [e2e]
        pruefung:
          - Power-Button → bestätigen.
        erwartet: Bot wird gestoppt, Fenster schließt (falls vom Browser erlaubt).

      - id: UPD-05
        titel: Server-Neustart nach Update
        beschreibung: Nach einem erfolgreichen POST /system/update beendet sich der Worker nach 1,5 s (schedule_restart); run_uvicorn_watchdog.bat (setzt WORKER_SUPERVISED=1) startet ihn mit dem neuen Code neu. Ohne Watchdog kein Neustart. Das Dashboard wartet 8 s und lädt dann neu; veraltete Bots startet der neue Worker selbst neu (BOT-03).
        code: [worker_python/src/utils/self_updater.py, worker_python/src/api/system.py, worker_python/run_uvicorn_watchdog.bat, frontend_nextjs/src/app/hooks/useDashboard.ts]
        tiers: [unit, api, manuell]
        pruefung:
          - Update im Dashboard anwenden (System Info → Check for Updates → Apply Update).
          - Im Fenster „Uvicorn API“ auf dem VPS den Neustart beobachten.
        erwartet: Worker startet nach wenigen Sekunden mit der neuen Version; das Dashboard lädt neu und ist wieder online.

      - id: UPD-06
        titel: Abhängigkeiten nach Update installieren
        beschreibung: Ändert ein Pull worker_python/requirements.txt, führt execute_git_pull danach pip install -r mit dem Python des Workers (.venv) aus. Schlägt pip fehl, meldet das Update einen Fehler und der Worker startet nicht neu (neuer Code würde ohne Paket abstürzen).
        code: [worker_python/src/utils/self_updater.py]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: UPD-07
        titel: Automatisches Update
        beschreibung: Unter dem Watchdog (WORKER_SUPERVISED=1) prüft der Worker alle AUTO_UPDATE_MINUTES (Standard 5, 0 = aus) origin/main. Liegt der lokale Stand auf Branch main nur zurück, zieht er das Update (inkl. pip) und startet neu. Ein anderer Branch oder lokale Commits werden nicht angefasst. git läuft dabei mit den normalen Rechten des Workers.
        code: [worker_python/src/utils/auto_updater.py, worker_python/main.py]
        tiers: [unit, manuell]
        pruefung:
          - Einen PR nach main mergen und 5–10 Minuten warten.
        erwartet: Die VPS-Seite zeigt die neue Version, ohne dass etwas geklickt wurde.

  # ---------------------------------------------------------------------------
  - id: VPS
    titel: VPS-Fernsteuerung vom Mac
    features:
      - id: VPS-01
        titel: VPS-Status
        beschreibung: Die Seite /vps zeigt per SSH (Route /api/vps/status → ops/windows/vps.ps1 status) Worker, ngrok samt öffentlicher URL, laufende Bots, Version/Branch, Autostart und Uptime. Ohne VPS_SSH_HOST (z. B. Vercel) erscheint nur ein Hinweis.
        code: [frontend_nextjs/src/app/vps/page.tsx, frontend_nextjs/src/components/vps/VpsStatusPanel.tsx, frontend_nextjs/src/components/vps/useVps.ts, worker_python/ops/windows/vps.ps1]
        tiers: [e2e, manuell]
        pruefung:
          - Lokal npm run dev:frontend, Seite „VPS“ öffnen.
        erwartet: Alle Kacheln grün; ist der Worker gestoppt, steht „Gestoppt“.

      - id: VPS-02
        titel: Aktionen (Update, Neustart, Reboot)
        beschreibung: Update-Prüfung über den Worker; „Update & Neustart“ läuft über den Worker (POST /system/update) oder, wenn er nicht läuft, über die Aufgabe AutoGrid-Update; „Worker neu starten“ über die Aufgabe AutoGrid-Start (start.bat); „ngrok neu starten“ beendet ngrok, run_ngrok_watchdog.bat startet ihn neu; „VPS neu starten“ per shutdown /r. Jede Aktion mit Bestätigung. git läuft nie per SSH als Administrator.
        code: [frontend_nextjs/src/components/vps/VpsActions.tsx, "frontend_nextjs/src/app/api/vps/[action]/route.ts", frontend_nextjs/src/lib/server/vpsSsh.ts, worker_python/ops/windows/vps.ps1]
        tiers: [e2e, manuell]
        pruefung:
          - „Worker neu starten“ → bestätigen.
          - „Update & Neustart“ nach einem Merge auf main.
        erwartet: Worker ist nach ~20 s wieder erreichbar bzw. die Version steigt.

      - id: VPS-03
        titel: Logs vom VPS
        beschreibung: Tabs Worker (logs/worker_console.log), ngrok (logs/ngrok.log) und Update (logs/vps_update.log), jeweils die letzten 300 Zeilen per SSH. Das Log lädt mit dem Status-Poll neu, Farbcodes von uvicorn werden entfernt; fehlt die Neustart-Schleife (dann gibt es kein Log), erklärt ein Hinweis den Klick auf „Worker neu starten“.
        code: [frontend_nextjs/src/components/vps/VpsLogViewer.tsx, frontend_nextjs/src/components/vps/useVps.ts, worker_python/ops/windows/vps.ps1]
        tiers: [e2e]
        pruefung:
          - Tabs wechseln.
          - Seite offen lassen, nachdem der VPS aktualisiert oder neu gestartet wurde.
        erwartet: Konsolenausgabe des Workers bzw. ngrok erscheint ohne Farbcodes und aktualisiert sich von selbst; ein alter Fehler bleibt nicht stehen.

      - id: VPS-04
        titel: Schutz der VPS-Route
        beschreibung: /api/vps/* antwortet nur auf localhost; POST nur mit eigener Origin; ohne VPS_SSH_HOST 404. Nur geprüfte Aktionen/Argumente gelangen in den SSH-Befehl, SSH-Daten stehen nur server-seitig in .env.local (kein NEXT_PUBLIC_).
        code: ["frontend_nextjs/src/app/api/vps/[action]/route.ts", frontend_nextjs/src/lib/server/vpsSsh.ts]
        tiers: [e2e]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch e2e-Tests.

      - id: VPS-05
        titel: Konsolen-Log und ngrok-Watchdog
        beschreibung: Unter dem Watchdog schreibt der Worker seine Konsolenausgabe zusätzlich nach logs/worker_console.log (rotiert ab 5 MB). run_ngrok_watchdog.bat startet ngrok bei Absturz neu und loggt nach logs/ngrok.log; start.bat und cleanup_old_instances.ps1 kennen ihn. Die PowerShell-Skripte sind reines ASCII (PowerShell 5.1).
        code: [worker_python/src/utils/console_tee.py, worker_python/main.py, worker_python/run_ngrok_watchdog.bat, worker_python/start.bat, worker_python/cleanup_old_instances.ps1]
        tiers: [unit]
        pruefung:
          - Nicht manuell testen.
        erwartet: Abgedeckt durch Unit-Tests.

      - id: VPS-06
        titel: Einmalige Einrichtung und Autostart
        beschreibung: ops/windows/setup_vps.ps1 (einmal als Administrator) installiert OpenSSH (nur Schlüssel), trägt den Mac-Schlüssel ein, setzt den Besitzer des Repos auf den normalen Benutzer, richtet Auto-Login ein (Passwort als LSA-Secret), entfernt bei MT5-Terminals den Haken „Als Administrator ausführen“ (RUNASADMIN, samt Leeren des Kompatibilitäts-Caches) und legt die Aufgaben AutoGrid-Start (bei Anmeldung) und AutoGrid-Update an, beide ohne höchste Rechte.
        code: [worker_python/ops/windows/setup_vps.ps1, docs/windows_start_guide.md]
        tiers: [manuell]
        pruefung:
          - Einrichtung nach docs/windows_start_guide.md, danach VPS über die Seite „VPS“ neu starten.
        erwartet: Nach dem Reboot sind Auto-Login, Worker, ngrok und die vorher laufenden Bots von selbst wieder da.

      - id: VPS-07
        titel: Prozesse mit Adminrechten erkennen und beenden
        beschreibung: Laufen Neustart-Schleife, Worker, Bots, ngrok oder MT5 mit Adminrechten (alte Aufgabe mit höchsten Rechten, start.bat „Als Administrator“), kann der normale Worker sie weder sehen noch beenden. vps.ps1 status meldet sie (höhere Integritätsstufe als explorer.exe), die Seite „VPS“ zeigt eine rote Warnung mit „Admin-Prozesse beenden“ (fix-elevated, danach Neustart ohne Adminrechte, der Worker setzt die Bots fort); „Worker neu starten“ beendet Admin-Schleifen/-Worker/-ngrok vorher selbst. cleanup_old_instances.ps1 schreibt nicht beendbare Reste ins Worker-Log. Ein Worker mit Adminrechten warnt beim Start und macht kein git pull.
        code: [worker_python/ops/windows/vps.ps1, worker_python/cleanup_old_instances.ps1, worker_python/src/utils/elevation.py, worker_python/src/utils/self_updater.py, frontend_nextjs/src/components/vps/VpsElevatedWarning.tsx]
        tiers: [unit, e2e, manuell]
        pruefung:
          - Seite „VPS“ öffnen, wenn nichts mit Adminrechten läuft.
          - "Nur mit Absprache: auf dem VPS start.bat per Rechtsklick „Als Administrator ausführen“, danach Seite „VPS“ neu laden und „Admin-Prozesse beenden“."
        erwartet: Ohne Admin-Prozesse keine Warnung. Mit Admin-Start nennt die Warnung Neustart-Schleifen und Worker mit PID; nach „Admin-Prozesse beenden“ verschwindet sie, Worker und ngrok laufen wieder ohne Adminrechte und das Worker-Log zeigt keine neue Admin-Warnung.

  # ---------------------------------------------------------------------------
  - id: UI
    titel: Oberfläche
    features:
      - id: UI-01
        titel: Navigation
        beschreibung: Logo, Version, Links Dashboard, Formasyon und VPS mit animierter Markierung. Auf Mobil (375px) kompakter, ohne horizontales Scrollen.
        code: [frontend_nextjs/src/components/layout/AppNav.tsx]
        tiers: [e2e]
        pruefung:
          - Zwischen Dashboard und Formasyon wechseln.
          - Bei 375px Breite öffnen.
        erwartet: Aktiver Link ist markiert, Version entspricht VERSION. Bei 375px kein horizontales Scrollen, „Grid Robot“ bricht nicht um.

      - id: UI-02
        titel: Theme hell / dunkel / System
        beschreibung: Umschalter „Açık / Koyu / Sistem“ (auf Mobil ein einzelner Button, der der Reihe nach durchschaltet), gespeichert in localStorage grid-robot-theme, ohne Aufblitzen beim Laden.
        code: [frontend_nextjs/src/components/layout/ThemeToggle.tsx, frontend_nextjs/src/components/layout/ThemeSync.tsx, frontend_nextjs/src/app/layout.tsx]
        tiers: [e2e]
        pruefung:
          - Alle drei Varianten wählen und die Seite neu laden.
        erwartet: Theme bleibt erhalten, kein helles Aufblitzen im Dunkelmodus.

      - id: UI-03
        titel: PWA / Service Worker
        beschreibung: Manifest und Registrierung von /service-worker.js im Layout.
        code: [frontend_nextjs/src/app/layout.tsx, frontend_nextjs/public/manifest.json]
        tiers: [e2e]
        pruefung:
          - DevTools → Application → Service Workers.
        erwartet: Service Worker ist registriert, keine 404 in der Konsole.

      - id: UI-04
        titel: Zonen-Test-Link (/chart?zone=)
        beschreibung: Link „Test“ im Zonenkopf öffnet /chart?zone=<id>.
        code: [frontend_nextjs/src/app/chart/page.tsx, frontend_nextjs/src/components/zone/ZoneHeader.tsx]
        tiers: [e2e]
        pruefung:
          - In einer Zone auf „Test“ klicken.
        erwartet: Das Chart zeigt die gewählte Zone.

      - id: UI-05
        titel: Sprache Türkisch / Englisch / Deutsch
        beschreibung: Umschalter TR · EN · DE in der Navigation (auf Mobil ein einzelner Button, der durchschaltet). Die Wahl liegt in localStorage grid-robot-locale, setzt <html lang> schon vor dem ersten Paint und gilt für alle Seiten, Dialoge, Toasts und Fehlermeldungen des Frontends. Texte stehen in frontend_nextjs/src/i18n/messages/*.ts (je Bereich tr, en, de nebeneinander, tsc erzwingt gleiche Schlüssel). Meldungen des Workers (detail-Texte, Logzeilen) bleiben unübersetzt.
        code: [frontend_nextjs/src/i18n/index.ts, frontend_nextjs/src/i18n/messages/index.ts, frontend_nextjs/src/store/useLocaleStore.ts, frontend_nextjs/src/components/layout/LanguageSwitcher.tsx, frontend_nextjs/src/components/layout/LocaleSync.tsx]
        tiers: [e2e]
        pruefung:
          - Im Umschalter EN, dann DE, dann TR wählen und dabei Dashboard, /vps und /chart ansehen.
          - Seite neu laden.
        erwartet: Alle Texte wechseln sofort, die Sprache bleibt nach dem Reload erhalten, <html lang> stimmt. Keine hartcodierten Reste, keine überlaufenden Buttons (Deutsch ist am längsten).

      - id: UI-06
        titel: Zahlen- und Zeitformat folgt der Sprache
        beschreibung: Preise und Gewinne ($97,25 in tr/de, $97.25 in en), Uhrzeiten in Logs und VPS-Seite sowie das Dezimalmuster im Symbol-Label („Sembol (0,00)“) richten sich nach der gewählten Sprache.
        code: [frontend_nextjs/src/i18n/format.ts, frontend_nextjs/src/components/dashboard/MetricsStrip.tsx, frontend_nextjs/src/components/ChartViewer.tsx, frontend_nextjs/src/components/zone/ZoneBasicFields.tsx]
        tiers: [e2e]
        pruefung:
          - Bot mit MT5 verbinden, dann die Sprache zwischen EN und DE wechseln.
        erwartet: Der Preis in der Kennzahlenleiste wechselt zwischen Punkt und Komma als Dezimaltrenner.

      - id: UI-07
        titel: Hinweise (Tooltips) zu jedem Feld und Button
        beschreibung: Jede Einstellung, jedes Feld, jeder Schalter, Button, Tab und Menüpunkt erklärt sich. Felder und Schalter tragen ein (i) hinter dem Label (Hover, Tastaturfokus oder Antippen), Buttons und Links zeigen den Tooltip bei Hover/Fokus, deaktivierte Buttons nennen den Grund. Der Tooltip ist ein Popover im Top-Layer (nicht von overflow-hidden abgeschnitten, über den Dialogen), Escape schließt zuerst nur ihn. Texte stehen als i18n-Schlüssel `<label-key>.hint` in src/i18n/messages/hints.ts (tr, en, de). `hint` ist Pflicht-Prop von InputField, Switch, Button, Tabs und ConfirmModal; der Abdeckungstest meldet jedes Bedienelement ohne Hinweis (hooks/RULES.md §5).
        code: [frontend_nextjs/src/components/ui/tooltip.tsx, frontend_nextjs/src/components/ui/InputField.tsx, frontend_nextjs/src/components/ui/button.tsx, frontend_nextjs/src/components/ui/switch.tsx, frontend_nextjs/src/i18n/messages/hints.ts]
        tiers: [e2e]
        pruefung:
          - Im Dashboard mit der Maus über das (i) hinter „Alt Seviyeler“, „Maks Pozisyon“ und „Çıkış Tetikleyici“ fahren.
          - Mit Tab durch die Felder gehen; Escape drücken.
          - Bei laufendem Bot über „Edit“ fahren; im Konto-Dialog über ein (i) fahren.
          - Sprache auf EN und DE stellen.
        erwartet: Zu jedem Element erscheint ein verständlicher Text in der gewählten Sprache. Er wird nicht abgeschnitten, liegt im Dialog über dem Dialog, Escape schließt erst den Tooltip. Ein deaktivierter Button nennt den Grund. Der Abdeckungstest findet kein Bedienelement ohne Hinweis.

      - id: UI-08
        titel: Mobil (375 px) ohne horizontalen Überlauf
        beschreibung: Bei 375 px Breite läuft keine Seite horizontal über. Im Zonenbereich brechen die Kopfzeile des Panels („Kaydedildi“ und „Bölge Ekle“) und der Zonenkopf (Status, Kaydet, Test und ⋯-Menü) in eine zweite Zeile um, statt die Karte zu sprengen. Das gilt für alle drei Sprachen (Deutsch ist am längsten), auch mit dem Abzeichen „Kaydedilmedi“ und einer vom Motor gestoppten Zone. Ab Tablet-Breite bleibt das Layout unverändert.
        code: [frontend_nextjs/src/components/ZoneSettingsPanel.tsx, frontend_nextjs/src/components/zone/ZoneHeader.tsx]
        tiers: [e2e]
        pruefung:
          - Dashboard bei 375 px Breite öffnen (Entwicklertools, Geräteleiste) und ein Konto mit Zone wählen.
          - Sprache auf DE stellen und in der Zone einen Wert ändern.
          - /formasyon, /vps und /chart bei 375 px ansehen.
        erwartet: Kein horizontaler Scrollbalken auf keiner Seite. „Bölge Ekle“, „Kaydet“, „Test“ und das ⋯-Menü der Zone sind vollständig sichtbar, notfalls in einer zweiten Zeile.
